<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Southwest Edge Portal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#E1531A">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SW Edge">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --edge:#E1531A;
    --edge-dark:#B8410F;
    --edge-darker:#8F3009;
    --edge-light:#FDECE3;
    --edge-lighter:#FFF7F3;
    --ink:#20242C;
    --ink-soft:#5B6270;
    --line:#E7E5E2;
    --line-soft:#F0EEEB;
    --paper:#FFFFFF;
    --canvas:#FAF9F7;
    --good:#3E8E5B;
    --bad:#D64545;
    --warn:#C98A1E;
    --radius:10px;
    --shadow:0 12px 40px rgba(32,20,10,0.14);
    --shadow-sm:0 2px 8px rgba(32,20,10,0.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--canvas);
    color:var(--ink);
    overflow:hidden;
  }
  #app{height:100vh;width:100vw;display:flex;flex-direction:column;position:relative;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#DDD8D2;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    min-height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    background:var(--canvas);
    padding:48px 24px;overflow-y:auto;
  }
  .login-logo{margin-bottom:2px;}
  .login-logo img{height:128px;width:auto;display:block;margin:0 auto;}
  .login-title{font-size:30px;font-weight:600;margin-top:14px;color:var(--edge);}
  .login-title-sub{font-size:16px;font-weight:600;margin-top:2px;color:var(--edge);}
  .login-tag{color:var(--ink);margin-top:8px;font-size:17px;letter-spacing:.02em;font-style:italic;font-weight:600;}
  .login-card{
    background:var(--paper);border-radius:16px;box-shadow:var(--shadow);width:420px;max-width:100%;
    padding:30px 30px 26px;margin-top:34px;
  }
  .login-card-title{font-size:20px;font-weight:600;color:var(--edge);margin-bottom:16px;}
  .login-user-row{
    display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;
    margin-bottom:10px;cursor:pointer;transition:border-color .12s, background .12s;
  }
  .login-user-row:hover{border-color:#EFC1A8;}
  .login-user-row.selected{border-color:var(--edge);background:var(--edge-lighter);}
  .login-user-row .user-avatar{
    width:34px;height:34px;border-radius:50%;background:var(--edge);color:#fff;font-weight:600;font-size:13px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .login-user-row .user-name{font-weight:600;font-size:14.5px;color:var(--edge-darker);}
  .login-user-row .user-handle{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .login-password-field{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;
    background:var(--line-soft);margin-top:6px;
  }
  .login-submit-btn{
    width:100%;padding:12px;border:none;border-radius:9px;background:var(--edge);color:#fff;font-weight:600;
    font-size:14.5px;margin-top:14px;
  }
  .login-submit-btn:hover{background:var(--edge-dark);}
  .login-hint{margin-top:16px;font-size:12px;color:var(--ink-soft);text-align:left;line-height:1.55;}
  .login-register-link{
    display:block;text-align:center;margin-top:14px;color:var(--edge);font-weight:600;font-size:13.5px;
    background:none;border:none;width:100%;padding:6px;
  }
  .login-register-panel{
    margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  }
  .login-register-panel .field{margin-bottom:10px;}
  .login-register-panel label{font-size:11.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .login-register-panel input{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;
  }

  /* ---------- BUTTONS ---------- */
  .btn{
    background:var(--edge);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;
    transition:background .12s;
  }
  .btn:hover{background:var(--edge-dark);}
  .btn.secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
  .btn.secondary:hover{background:var(--line-soft);}
  .btn.ghost{background:transparent;color:var(--edge);border:1px solid var(--edge);}
  .btn.ghost:hover{background:var(--edge-light);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn.danger{background:var(--bad);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- LEASING REPORT (LSR) ---------- */
  .lsr-dead-date{font-size:11px;color:var(--bad);font-weight:600;}
  .print-only{display:none;}
  @media print{
    body *{visibility:hidden;}
    #lsrPrintArea, #lsrPrintArea *{visibility:visible;}
    #mapPrintOverlay, #mapPrintOverlay *{visibility:visible;}
    body:has(#mapPrintOverlay) #app{ display:none !important; }
    #mapPrintOverlay{ position:static !important; }
    #mapPrintOverlay h2{ font-size:16px !important; margin:0 0 6px 0 !important; }
    #mapPrintOverlay img{ max-width:100% !important; max-height:7in !important; width:auto !important; height:auto !important; }
    .no-print{display:none !important;}
    .print-only{display:block !important;}
    /* Release every ancestor's scroll/height/overflow clipping so the report can
       flow across as many pages as it needs, instead of being cut to what fit
       on screen inside the modal's own scrollable viewport. */
    .modal-overlay, .modal-card, .modal-body{
      position:static !important; overflow:visible !important; max-height:none !important;
      height:auto !important; width:auto !important; box-shadow:none !important; background:none !important;
    }
    #lsrPrintArea{position:static;width:100%;}
    @page{size:11in 8.5in;margin:0.4in;}
  }

  /* ---------- CALENDAR VIEW ---------- */
  .cv-overlay{position:fixed;inset:0;background:rgba(20,14,8,0.5);z-index:150;display:flex;align-items:stretch;justify-content:stretch;overscroll-behavior-y:contain;}
  .cv-card{background:var(--canvas);width:100vw;height:100vh;border-radius:0;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;}
  .cv-head{background:var(--edge);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;}
  .cv-head-title{font-size:19px;font-weight:700;flex:1;}
  .cv-nav-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:15px;}
  .cv-nav-btn:hover{background:rgba(255,255,255,.32);}
  .cv-legend{display:flex;gap:16px;padding:10px 22px;background:var(--paper);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-soft);align-items:center;}
  .cv-legend-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle;}
  .cv-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(110px,1fr);padding:10px;gap:6px;}
  .cv-dow{grid-row:1;text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;padding:4px 0;}
  .cv-day{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px;overflow-y:auto;
    display:flex;flex-direction:column;gap:4px;
  }
  .cv-day.other-month{background:var(--canvas);opacity:.55;}
  .cv-day.is-today{border-color:var(--edge);box-shadow:0 0 0 2px rgba(225,83,26,.18) inset;}
  .cv-day-num{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:2px;}
  .cv-day.is-today .cv-day-num{color:var(--edge-dark);}
  .cv-day.drag-over{background:var(--edge-lighter);border-color:var(--edge);}
  .cv-card-note{
    font-size:11px;padding:4px 6px;border-radius:5px;cursor:grab;line-height:1.3;
    background:var(--edge-light);color:var(--edge-darker);border-left:3px solid var(--edge);
  }
  .cv-card-note.assigned-other{
    background:#E6F0FA;color:#1D5A99;border-left-color:#3B82C4;
  }
  .cv-card-note:active{cursor:grabbing;}

  /* ---------- SHELL ---------- */
  .shell{display:flex;height:100vh;width:100vw;}
  .sidebar{
    width:270px;min-width:270px;height:100vh;background:var(--paper);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .sidebar-header{
    padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-soft);
  }
  .sidebar-avatar{
    width:36px;height:36px;border-radius:50%;background:var(--edge);color:#fff;font-weight:600;font-size:14px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .sidebar-user{font-weight:600;font-size:14px;}
  .sidebar-sub{font-size:11px;color:var(--ink-soft);}
  .sidebar-topicons{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;
    justify-content:center;font-size:15px;color:var(--ink-soft);
  }
  .icon-btn:hover{background:var(--line-soft);color:var(--ink);}

  .nav-section-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;
    padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;
  }
  .nav-add{
    width:20px;height:20px;border-radius:50%;background:var(--edge-light);color:var(--edge-dark);border:none;
    font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:600;
  }
  .nav-list{display:flex;flex-direction:column;padding:0 8px;}
  .nav-row-wrap{
    display:flex;align-items:center;border-radius:8px;position:relative;
  }
  .nav-row-wrap:hover{background:var(--edge-lighter);}
  .nav-row-wrap:hover .nav-ellipsis{opacity:1;}
  .nav-row-wrap.active{background:var(--edge-light);}
  .nav-row-wrap.active .nav-row{color:var(--edge-darker);font-weight:600;}
  .nav-row{
    display:flex;align-items:center;gap:10px;padding:9px 8px;font-size:13.5px;color:var(--ink);flex:1;min-width:0;
    border:none;background:transparent;text-align:left;
  }
  .nav-ellipsis{
    background:none;border:none;color:var(--ink-soft);font-size:13px;padding:6px 8px;border-radius:6px;
    opacity:0;flex-shrink:0;margin-right:4px;
  }
  .nav-ellipsis:hover{opacity:1 !important;background:var(--line-soft);}
  .nav-context-menu{
    position:absolute;top:34px;right:6px;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow);z-index:250;min-width:150px;overflow:hidden;
  }
  .nav-context-menu button{
    display:block;width:100%;text-align:left;padding:8px 12px;font-size:12.5px;background:none;border:none;color:var(--ink);
  }
  .nav-context-menu button:hover{background:var(--edge-lighter);}
  .nav-context-menu button.danger{color:var(--bad);}
  .nav-icon{width:20px;text-align:center;font-size:14px;flex-shrink:0;}
  .nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-count{
    font-size:11px;font-weight:600;color:#fff;background:#C7C2BC;border-radius:9px;padding:1px 7px;min-width:16px;
    text-align:center;
  }
  .nav-count.urgent{background:var(--bad);}
  .nav-count.mild{background:var(--warn);}
  .sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line-soft);}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--canvas);}
  .topbar{
    height:56px;min-height:56px;border-bottom:1px solid var(--line);background:var(--paper);
    display:flex;align-items:center;padding:0 22px;gap:14px;
  }
  .topbar-title{font-size:22px;font-weight:700;color:var(--edge-darker);letter-spacing:-0.01em;}
  .topbar-eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  .topbar-sub{font-size:12px;color:var(--ink-soft);}
  .topbar-spacer{flex:1;}
  .segmented{display:flex;background:var(--line-soft);border-radius:8px;padding:2px;}
  .segmented button{
    border:none;background:transparent;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .segmented button.active{background:var(--paper);color:var(--edge-darker);box-shadow:var(--shadow-sm);}

  .content{flex:1;overflow-y:auto;padding:20px 26px 60px;}
  .content-flex{display:flex;gap:24px;align-items:flex-start;max-width:1280px;margin:0 auto;}
  .content-inner{flex:1;min-width:0;max-width:760px;}
  .content-inner.wide{max-width:none;}
  .side-panel{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;}
  .side-panel-columns{display:flex;gap:16px;flex-shrink:0;}
  .side-panel-calendar-col{width:300px;flex-shrink:0;}
  @media (max-width:1180px){ .side-panel{display:none;} .side-panel-columns{display:none;} }
  .widget-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow-sm);}
  .widget-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .widget-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
  .cal-dow{font-size:9.5px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
  .cal-day{
    font-size:11.5px;padding:5px 0;border-radius:6px;position:relative;color:var(--ink);
  }
  .cal-day.today{background:var(--edge);color:#fff;font-weight:700;}
  .cal-day.has-todos:not(.today)::after{
    content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;
    border-radius:50%;background:var(--edge);
  }
  .cal-day.blank{visibility:hidden;}
  .weather-row{display:flex;align-items:center;gap:12px;}
  .weather-temp{font-size:30px;font-weight:700;color:var(--edge-darker);}
  .weather-icon{font-size:32px;}
  .widget-picker-toggle{background:none;border:none;color:var(--ink-soft);font-size:14px;padding:2px 4px;}
  .widget-picker-toggle:hover{color:var(--edge);}

  /* ---------- ROWS / CARDS ---------- */
  .section-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;
    margin:22px 0 8px;
  }
  .section-label:first-child{margin-top:0;}
  .row-card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;
    margin-bottom:9px;display:flex;align-items:flex-start;gap:13px;cursor:pointer;transition:box-shadow .12s, border-color .12s;
  }
  .row-card:hover{box-shadow:var(--shadow-sm);border-color:#E3B79E;}
  .row-check{
    width:26px;height:26px;border-radius:50%;border:2.5px solid var(--edge);flex-shrink:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
  }
  .row-check.done{background:var(--good);border-color:var(--good);}
  .row-body{flex:1;min-width:0;}
  .row-title{font-size:14.5px;font-weight:600;color:var(--ink);}
  .row-title.done{text-decoration:line-through;color:var(--ink-soft);}
  .row-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .row-meta .due{font-weight:600;}
  .row-meta .due.overdue{color:var(--bad);}
  .row-meta .due.today{color:var(--edge-dark);}
  .pill{
    font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--edge-light);color:var(--edge-darker);
  }
  .pill.gray{background:var(--line-soft);color:var(--ink-soft);}
  .pill.private{background:#EFE7FB;color:#7647B5;}
  .progress-track{height:5px;border-radius:4px;background:var(--line-soft);margin-top:8px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--good);}
  .row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
  .row-select{width:14px;height:14px;margin-top:4px;flex-shrink:0;accent-color:#B8B2A8;opacity:.75;}
  .row-trash{
    background:none;border:none;font-size:14px;opacity:.55;padding:2px;border-radius:6px;line-height:1;
  }
  .row-trash:hover{opacity:1;background:var(--edge-light);}
  .row-contact{display:flex;flex-direction:column;gap:3px;margin-left:6px;flex-shrink:0;max-width:170px;align-items:flex-end;}
  .contact-link{
    font-size:11px;color:var(--edge-dark);text-decoration:none;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:170px;
  }
  .contact-link:hover{text-decoration:underline;}
  .bulk-bar{
    display:flex;align-items:center;gap:10px;background:var(--edge-light);border:1px solid var(--edge-light);
    border-radius:10px;padding:9px 14px;margin-bottom:10px;font-size:13px;color:var(--edge-darker);
  }
  .bulk-bar .btn{padding:6px 12px;font-size:12px;}
  .avatar-chip{
    width:24px;height:24px;border-radius:50%;background:var(--edge);color:#fff;font-size:10.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  .star{color:#E8B23D;}
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .empty-state .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .empty-state .tiny{font-size:12.5px;line-height:1.6;}

  .team-row{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
    margin-bottom:9px;display:flex;align-items:center;gap:13px;cursor:pointer;
  }
  .team-row:hover{box-shadow:var(--shadow-sm);}
  .team-stats{margin-left:auto;display:flex;gap:18px;}
  .team-stat{text-align:center;}
  .team-stat .num{font-size:16px;font-weight:600;color:var(--edge-darker);}
  .team-stat .lab{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

  .fab{
    position:fixed;bottom:26px;left:30px;width:52px;height:52px;border-radius:50%;background:var(--edge);
    color:#fff;font-size:24px;border:none;box-shadow:0 8px 22px rgba(225,83,26,0.45);display:flex;
    align-items:center;justify-content:center;z-index:80;
  }
  .fab:hover{background:var(--edge-dark);}
  .voice-fab{
    position:fixed;bottom:26px;right:30px;width:52px;height:52px;border-radius:50%;background:var(--ink);
    color:#fff;font-size:22px;border:none;box-shadow:0 8px 22px rgba(0,0,0,0.35);display:flex;
    align-items:center;justify-content:center;z-index:110;
  }
  .voice-fab.recording{background:var(--bad);animation:voicePulse 1.2s ease-in-out infinite;}
  @keyframes voicePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  @media (max-width:820px){ .fab{bottom:88px;} .voice-fab{bottom:88px;} }
  .portal-chat-fab{
    position:fixed;bottom:26px;right:30px;width:52px;height:52px;border-radius:50%;background:var(--edge);
    color:#fff;font-size:24px;border:none;box-shadow:0 8px 22px rgba(225,83,26,0.45);display:flex;
    align-items:center;justify-content:center;z-index:130;
  }
  /* Only Michael has the separate Voice Note fab in the same corner — when it's present,
     stack the chat button above it instead of sitting on top of it. */
  .portal-chat-fab.stacked{bottom:92px;}
  @media (max-width:820px){ .portal-chat-fab{bottom:88px;} .portal-chat-fab.stacked{bottom:154px;} }
  .chat-mic-btn{
    flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--canvas);
    color:var(--ink-soft);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .chat-mic-btn.recording{background:var(--bad);border-color:var(--bad);color:#fff;animation:voicePulse 1.2s ease-in-out infinite;}
  .chat-item-chip{
    font-size:12px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;
    color:var(--edge-darker);cursor:pointer;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;
  }
  .chat-item-chip:hover{background:var(--edge-lighter);border-color:var(--edge);}

  /* ---------- MODALS ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,14,8,0.42);display:flex;align-items:center;justify-content:center;
    z-index:100;animation:fadeIn .12s ease-out;overscroll-behavior-y:contain;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-card{
    background:var(--paper);border-radius:16px;width:560px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .modal-card.wide{width:1320px;max-height:90vh;}
  .modal-head{
    background:var(--edge);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;
  }
  .modal-breadcrumb{font-size:12px;opacity:.85;display:flex;gap:5px;flex-wrap:wrap;}
  .modal-breadcrumb span{cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .modal-title-row{display:flex;align-items:center;width:100%;}
  .modal-title{font-size:17px;font-weight:600;flex:1;}
  .modal-close{background:rgba(255,255,255,.18);border:none;color:#fff;min-width:28px;height:28px;padding:0 10px;border-radius:8px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:rgba(255,255,255,.32);}
  .modal-body{padding:18px 20px;overflow-y:auto;flex:1;overscroll-behavior-y:contain;}
  .modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}

  .contact-card{
    background:var(--edge-lighter);border:1px solid var(--edge-light);border-radius:10px;padding:12px 14px;margin-bottom:14px;
  }
  .contact-card .label{font-size:10px;text-transform:uppercase;color:var(--edge-darker);font-weight:600;letter-spacing:.05em;}
  .contact-line{display:flex;font-size:13px;margin-top:6px;}
  .contact-line span{width:80px;flex-shrink:0;color:var(--ink-soft);}
  .contact-line b{font-weight:600;}

  .field{margin-bottom:13px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--ink);
    background:#fff;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--edge);outline-offset:1px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .type-toggle{display:flex;gap:6px;margin-bottom:13px;}
  .type-toggle button{
    flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .type-toggle button.active{background:var(--edge);color:#fff;border-color:var(--edge);}
  .quickdate-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .quickdate-row button{
    border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:11.5px;color:var(--ink-soft);
  }
  .quickdate-row button:hover{border-color:var(--edge);color:var(--edge-dark);}
  .autocomplete-box{position:relative;}
  .suggest-list{
    position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow);z-index:20;max-height:180px;overflow-y:auto;margin-top:3px;
  }
  .suggest-item{padding:8px 12px;font-size:13px;cursor:pointer;}
  .suggest-item:hover{background:var(--edge-lighter);}
  .suggest-item .sub{font-size:11px;color:var(--ink-soft);}

  .assign-toggle{display:flex;gap:8px;margin-top:6px;}
  .assign-toggle .btn{flex:1;}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:300;
    animation:toastIn .15s ease-out;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

  .admin-menu{
    position:absolute;top:64px;left:16px;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);width:250px;z-index:150;overflow:hidden;
  }
  .admin-item{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px;}
  .admin-item:hover{background:var(--edge-lighter);cursor:pointer;}
  .admin-item:last-child{border-bottom:none;}

  .contacts-table{width:100%;min-width:720px;border-collapse:collapse;font-size:13px;}
  .contacts-table th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
    padding:8px 10px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--canvas);
  }
  .contacts-table td{padding:9px 10px;border-bottom:1px solid var(--line-soft);}
  .contacts-table tr:hover td{background:var(--edge-lighter);}
  .checkbox-cell{width:28px;}

  .tab-strip{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab-strip button{
    padding:9px 4px;margin-right:18px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;
  }
  .tab-strip button.active{color:var(--edge-darker);border-color:var(--edge);}

  /* ---------- MOBILE ---------- */
  @media (max-width:820px){
    .sidebar{
      position:fixed;inset:0;z-index:60;width:100%;min-width:0;transform:translateX(0);
    }
    .shell.mobile-detail .sidebar{display:none;}
    .main{width:100%;}
    .shell.mobile-list .main{display:none;}
    .modal-card{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0;position:fixed;inset:0;}
    .fab{bottom:78px;left:18px;}
    .mobile-tabbar{
      display:flex;position:fixed;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid var(--line);
      z-index:70;
    }
    .mobile-tabbar button{
      flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;font-size:10px;color:var(--ink-soft);
    }
    .mobile-tabbar button.active{color:var(--edge);}
    .mobile-tabbar .mt-icon{font-size:18px;}
    .content{padding-bottom:80px;}

    /* Bigger type on the main landing page list — plenty of vertical room, scrolling is fine */
    .topbar-title{font-size:24px;}
    .topbar-sub{font-size:14px;}
    .section-label{font-size:13px;}
    .row-card{padding:15px 16px;gap:14px;}
    .row-title{font-size:17px;}
    .row-meta{font-size:14.5px;gap:10px;}
    .pill{font-size:12.5px;padding:3px 10px;}
    .row-check{width:30px;height:30px;font-size:15px;}
    .nav-icon{width:24px;font-size:17px;}
    .avatar-chip{width:28px;height:28px;font-size:12.5px;}
    .contact-link{font-size:13px;max-width:none;}
    .bulk-bar{font-size:14.5px;}
    .empty-state .big{font-size:17px;}
    .empty-state .tiny{font-size:14.5px;}
  }
  .mobile-tabbar{display:none;}
  @media (max-width:820px){ .mobile-tabbar{display:flex;} }
  .mobile-back{display:none;background:none;border:none;color:#fff;font-size:20px;margin-right:6px;}
  @media (max-width:820px){ .mobile-back.show{display:block;} }
</style>
</head>

          email:r.email||'', mobile:r.mobile||'', phone:r.phone||'', address:r.address||'',
          city:r.city||'', state:r.state||'', zip:r.zip||'', categories:r.categories||[],
          createdBy: r.created_by||null, isPrivate: r.is_private!==false};
}
function contactLocalToRow(c){
  return {id:c.id, first_name:c.first, last_name:c.last, company:c.company||null, website:c.website||null,

async function fetchContactsFromSupabase(){
  // Supabase/PostgREST caps any single request at 1000 rows by default — with several
  // thousand real contacts, a single .select('*') silently only ever returns the first
  // 1000. Paging through in batches until a batch comes back with fewer than the page
  // size guarantees every contact loads, no matter how many exist.
  const PAGE_SIZE = 1000;
  let all = [];
  let from = 0;
  while(true){
    const { data, error } = await supabaseClient.from('contacts').select('*').range(from, from + PAGE_SIZE - 1);
    if(error){ console.error('fetchContactsFromSupabase error:', error); return; }
    all = all.concat(data);
    if(data.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }
  db.contacts = all.map(contactRowToLocal);
}

/* ---------------- SHARED USER-ID MAPPING ----------------
   Local code everywhere uses short ids like 'mclark'/'nault'/'lkhoudary'. The
   database needs real Supabase Auth UUIDs for any foreign key pointing at a
   person (edge_tracker, owner_id, assigned_to, created_by). These two helpers
   convert between the two. If someone hasn't ever logged in on Supabase yet,
   there's no UUID for them — the write is skipped rather than crashing. */
function localUserIdToAuthId(localId){
  const u = USERS.find(x=>x.id===localId);
  return (u && u.authId) || null;
}
function authIdToLocalUserId(authId){
  const u = USERS.find(x=>x.authId===authId);
  return u ? u.id : null;
}
// deal.splits[].userId is NOT reliably one or the other — most rows use the local short id
// (e.g. 'nault'), but some were saved with the raw Supabase auth UUID instead (e.g. Michael
// Clark's split on some older deals). Matching only against the local id silently misses
// those and makes a found split look like "no split for this person" (full deal weight
// instead of their actual share) — so match against both forms of the same person's id.
function findSplitForUser(deal, localUserId){
  if(!localUserId) return null;
  const authId = localUserIdToAuthId(localUserId);
  return (deal.splits||[]).find(s=>s.userId===localUserId || (authId && s.userId===authId)) || null;
}

async function fetchListsClientsDealsFromSupabase(){
  const { data:lists, error:e1 } = await supabaseClient.from('lists').select('*');
  if(e1){ console.error('fetchListsClientsDealsFromSupabase error:', e1); return; }
  if(!lists.length) return; // nothing seeded server-side yet — keep local defaults as the starting point
  const { data:clients, error:e2 } = await supabaseClient.from('clients').select('*');
  if(e2){ console.error('fetchListsClientsDealsFromSupabase error:', e2); return; }
  const [{data:secConts,error:e3}, {data:deals,error:e4}, {data:authUsers,error:e5}] = await Promise.all([
    supabaseClient.from('client_secondary_contacts').select('*'),
    supabaseClient.from('deals').select('*'),
    supabaseClient.from('client_authorized_users').select('*'),
  ]);
  if(e3||e4){ console.error('fetchListsClientsDealsFromSupabase error:', e3||e4); return; }
  const customCategories = await fetchPropertyCategoriesFromSupabase() || [];
  const newLists = lists.slice().sort((a,b)=>a.display_order-b.display_order).map(l=>({
    id:l.id, name:l.name, icon:l.icon, type:l.type, isDefault:l.is_default,
    clients: l.type==='deep' ? [] : undefined,
    entries: l.type==='flat' ? [] : undefined,
  }));
  db.archivedClients = [];
  clients.forEach(cr=>{
    const list = newLists.find(l=>l.id===cr.list_id);
    if(!list) return;
    const c = clientRowToLocal(cr);
    c.secondContactId = (secConts.find(sc=>sc.client_id===cr.id && sc.slot==='second')||{}).contact_id || null;
    c.thirdContactId = (secConts.find(sc=>sc.client_id===cr.id && sc.slot==='third')||{}).contact_id || null;
    c.deals = deals.filter(d=>d.client_id===cr.id).map(dealRowToLocal);
    if(authUsers) c.authorizedUserIds = authUsers.filter(a=>a.client_id===cr.id).map(a=>authIdToLocalUserId(a.user_id)).filter(Boolean);
    if(list.id==='listings'){
      c.prospects=[];
      c.categoryConfig=newLSRCategoryConfig();
      c.categoryConfig.custom = customCategories.filter(cat=>cat.listing_id===cr.id).map(cat=>({id:cat.id, name:cat.name}));
      c.categoryConfig.custom.forEach(cat=>{ if(!c.categoryConfig.order.includes(cat.id)) c.categoryConfig.order.push(cat.id); });
    }
    if(cr.archived_at){ c.archivedListId = list.id; db.archivedClients.push(c); }
    else list.clients.push(c);
  });
  db.lists = newLists;
}

async function approveDeletionRequest(reqId){
  const req = db.deletionRequests.find(r=>r.id===reqId);
  if(!req) return;
  const l = db.lists.find(x=>x.id===req.listId);
  const c = l && l.clients.find(x=>x.id===req.clientId);
  if(c){
    // Detach (don't delete) any to-do's pointing at this client, so they aren't silently lost.
    db.todos.filter(t=>t.clientId===c.id).forEach(t=>{ t.clientId=null; t.listId=null; supaUpdateTodo(t); });
    l.clients = l.clients.filter(x=>x.id!==c.id);
    supaDeleteClient(c.id);
  } else {
    // It may currently be sitting in Archived instead of its normal list.
    db.archivedClients = db.archivedClients.filter(x=>x.id!==req.clientId);
    supaDeleteClient(req.clientId);
  }
  db.deletionRequests = db.deletionRequests.filter(r=>r.id!==reqId);
  const { error } = await supabaseClient.from('client_deletion_requests').delete().eq('id', reqId);
  if(error) console.error('approveDeletionRequest cleanup error:', error);
  flashToast(`${req.clientName} deleted — approved by ${state.currentUser.name}.`);
  render();
}
async function cancelDeletionRequest(reqId){

}

const CLOSED_ESCROW_CHECKLIST_ITEMS = ['Closing Statement','Purchase of Sale','Deed','Extensions/Amendments','Ernest & receipts','FIRPTA'];
async function createBrokerReview(reviewType, sourceTable, sourceId, clientId, dealName, dueDays){
  const dateSigned = todayDate();
  // Designated Broker due dates (10 days) are BUSINESS days; Gina's 3-day checklist stays calendar.
  const dueDate = reviewType==='closedEscrow' ? addDays(dateSigned, dueDays) : addBusinessDays(dateSigned, dueDays);
  const dbDueDate = reviewType==='closedEscrow' ? addBusinessDays(dateSigned, 10) : null;
  const row = {
    source_table:sourceTable, source_id:sourceId, client_id:clientId, deal_name:dealName,
    review_type:reviewType, date_signed: toLocalDateStr(dateSigned), due_date: toLocalDateStr(dueDate),
    db_due_date: dbDueDate ? toLocalDateStr(dbDueDate) : null,
    status: reviewType==='closedEscrow' ? 'pending' : 'pending',
    checklist: reviewType==='closedEscrow' ? CLOSED_ESCROW_CHECKLIST_ITEMS.map(name=>({name, checked:false})) : null,
    created_by: localUserIdToAuthId(state.currentUser.id)
  };
  const { data, error } = await supabaseClient.from('broker_reviews').insert(row).select().single();
  if(error){ console.error('createBrokerReview error:', error); flashToast('Broker review could not be created (' + error.message + ')'); render(); return null; }
  const local = {id:data.id, sourceTable, sourceId, clientId, dealName, reviewType, dateSigned:row.date_signed,
    dueDate:row.due_date, dbDueDate:row.db_due_date, status:row.status, checklist:row.checklist, omCompletedAt:null, approvedAt:null, createdAt:data.created_at};
  db.brokerReviews.push(local);
  return local;
}

// Called right after a Deal or Prospect is saved with a new stage — compares old vs new
// and fires off whichever Designated Broker / Office Manager workflow applies.
async function handleStageTransition(sourceTable, sourceId, clientId, dealName, dealType, oldStage, newStage){
  if(oldStage===newStage) return;
  const david = davidUser();
  if(newStage==='signedLease'){
    const rev = await createBrokerReview('signedLease', sourceTable, sourceId, clientId, dealName, 10);
    if(rev){
      if(david){
        const todo = {id:crypto.randomUUID(), title:`Designated Broker Review: ${dealName}`, category:'Broker Review',
          dueDate: new Date(rev.dueDate+'T00:00:00'), assignedTo:david.id, createdBy:state.currentUser.id,
          type:'brokerReview', private:false, completed:false, isNew:true, brokerReviewId:rev.id,
          notes:`Signed Lease — please review in Egnyte and mark reviewed.`,
          listId:null, clientId, dealId: sourceTable==='deals'?sourceId:null, entryId:null, attachments:[]};
        db.todos.push(todo); await supaCreateTodo(todo);
      }
      invokeBrokerReviewEmail(rev.id, 'leaseOrPsaReview', state.currentUser.id);
    }
  } else if(newStage==='inEscrow'){
    const rev = await createBrokerReview('signedPSA', sourceTable, sourceId, clientId, dealName, 10);
    if(rev){
      if(david){
        const todo = {id:crypto.randomUUID(), title:`Designated Broker Review: ${dealName}`, category:'Broker Review',
          dueDate: new Date(rev.dueDate+'T00:00:00'), assignedTo:david.id, createdBy:state.currentUser.id,
          type:'brokerReview', private:false, completed:false, isNew:true, brokerReviewId:rev.id,
          notes:`Signed PSA / In Escrow — please review in Egnyte and mark reviewed.`,
          listId:null, clientId, dealId: sourceTable==='deals'?sourceId:null, entryId:null, attachments:[]};
        db.todos.push(todo); await supaCreateTodo(todo);
      }
      invokeBrokerReviewEmail(rev.id, 'leaseOrPsaReview', state.currentUser.id);
    }
  } else if(newStage==='closedEscrow'){
    const rev = await createBrokerReview('closedEscrow', sourceTable, sourceId, clientId, dealName, 3);
    if(rev){
      const gina = ginaUser();
      if(gina){
        const todo = {id:crypto.randomUUID(), title:`Closing Documents: ${dealName}`, category:'Closing Checklist',
          dueDate: new Date(rev.dueDate+'T00:00:00'), assignedTo:gina.id, createdBy:state.currentUser.id,
          type:'closedEscrowChecklist', private:false, completed:false, isNew:true, brokerReviewId:rev.id,
          notes:`Confirm each closing document is in Egnyte, then mark complete for Designated Broker review.`,
          listId:null, clientId, dealId: sourceTable==='deals'?sourceId:null, entryId:null, attachments:[]};
        db.todos.push(todo); await supaCreateTodo(todo);
      }
      invokeBrokerReviewEmail(rev.id, 'closedEscrowGinaChecklist', state.currentUser.id);
    }
  }
}

/* ---------------- DATE HELPERS ---------------- */
function todayDate(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
// Local-calendar-date formatter for date-only fields (due dates, date of contact, etc).
// Deliberately NOT toISOString() — that converts through UTC first, which can silently
// shift a date backward a day for any browser/timezone that isn't behind UTC. This just
// reads the date's own local year/month/day, so what you see is what gets saved.
function toLocalDateStr(d){
  if(!d) return null;
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addBusinessDays(d,n){
  const r=new Date(d);
  let added=0;
  while(added<n){
    r.setDate(r.getDate()+1);
    const day=r.getDay();
    if(day!==0 && day!==6) added++;
  }
  return r;
}
function fmtDate(d){
  if(!d) return null;
  const opts={month:'short',day:'numeric'};
  const now = new Date();
  if(d.getFullYear()!==now.getFullYear()) opts.year='numeric';
  return d.toLocaleDateString('en-US',opts);
}
function isSameDay(a,b){ return a && b && a.toDateString()===b.toDateString(); }
function wireDragReorder(selector, dragAttr, onReorder){
  let draggedId = null;
  document.querySelectorAll(selector).forEach(el=>{
    el.ondragstart = (ev)=>{ draggedId = el.dataset[dragAttr]; ev.dataTransfer.effectAllowed='move'; el.style.opacity='0.4'; };
    el.ondragend = ()=>{ el.style.opacity=''; };
    el.ondragover = (ev)=>{ ev.preventDefault(); };
    el.ondrop = (ev)=>{
      ev.preventDefault();
      const targetId = el.dataset[dragAttr];
      if(draggedId && targetId && draggedId!==targetId) onReorder(draggedId, targetId);
      draggedId = null;
    };
  });

  // Touch devices don't fire the HTML5 drag events above at all — this adds an
  // equivalent long-press-then-drag gesture so reordering also works on mobile,
  // without hijacking normal tapping (to open a list) or scrolling (to see more
  // of the sidebar). A press has to hold still for a beat before it's treated as
  // a drag, exactly like rearranging icons on a phone's home screen.
  let touchDraggedId = null, touchStartX = 0, touchStartY = 0, touchHoldTimer = null, touchDragActive = false, lastTouchTargetEl = null;
  const LONG_PRESS_MS = 350, MOVE_CANCEL_PX = 10;
  document.querySelectorAll(selector).forEach(el=>{
    el.ontouchstart = (ev)=>{
      const touch = ev.touches[0];
      touchStartX = touch.clientX; touchStartY = touch.clientY;
      touchDraggedId = el.dataset[dragAttr];
      touchDragActive = false;
      clearTimeout(touchHoldTimer);
      touchHoldTimer = setTimeout(()=>{
        touchDragActive = true;
        el.style.opacity = '0.4';
        if(navigator.vibrate) navigator.vibrate(15);
      }, LONG_PRESS_MS);
    };
    el.ontouchmove = (ev)=>{
      const touch = ev.touches[0];
      const dx = Math.abs(touch.clientX - touchStartX), dy = Math.abs(touch.clientY - touchStartY);
      if(!touchDragActive){
        // Moved too far before the hold timer fired — this is a scroll, not a drag.
        if(dx > MOVE_CANCEL_PX || dy > MOVE_CANCEL_PX) clearTimeout(touchHoldTimer);
        return;
      }
      // Actively dragging now — stop the page from scrolling underneath the finger.
      ev.preventDefault();
      if(lastTouchTargetEl) lastTouchTargetEl.style.background = '';
      const under = document.elementFromPoint(touch.clientX, touch.clientY);
      const dropEl = under && under.closest ? under.closest(selector) : null;
      if(dropEl && dropEl.dataset[dragAttr] !== touchDraggedId){
        dropEl.style.background = 'var(--edge-light)';
        lastTouchTargetEl = dropEl;
      } else {
        lastTouchTargetEl = null;
      }
    };
    el.ontouchend = ()=>{
      clearTimeout(touchHoldTimer);
      el.style.opacity = '';
      if(lastTouchTargetEl){
        lastTouchTargetEl.style.background = '';
        const targetId = lastTouchTargetEl.dataset[dragAttr];
        if(touchDraggedId && targetId && touchDraggedId!==targetId) onReorder(touchDraggedId, targetId);
      }
      touchDraggedId = null; touchDragActive = false; lastTouchTargetEl = null;
    };
    el.ontouchcancel = ()=>{
      clearTimeout(touchHoldTimer);
      el.style.opacity = '';
      if(lastTouchTargetEl) lastTouchTargetEl.style.background = '';
      touchDraggedId = null; touchDragActive = false; lastTouchTargetEl = null;
    };
  });
}
function dueStatus(d){
  if(!d) return 'none';
  const t = todayDate();
  if(d < t) return 'overdue';
  if(isSameDay(d,t)) return 'today';
  // "This week" means the actual current Sunday-through-Saturday calendar week, not a
  // rolling 7 days from today — a rolling window would keep showing "next week" dates
  // as still due "this week" for several more days whenever today falls later in the
  // week (worst case: on a Friday, the rolling window would reach all the way through
  // the following Friday).
  const endOfWeek = addDays(t, 6 - t.getDay()); // t.getDay(): 0=Sunday...6=Saturday
  if(d <= endOfWeek) return 'week';
  // "This month" means the actual current calendar month (e.g. all of July), not a
  // rolling 30 days from today — same issue as "this week" had: a rolling window would
  // keep counting days into next month as still due "this month," and the later in the
  // month today is, the worse the mismatch gets.
  if(d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth()) return 'month';
  return 'future';
}
// Natural language date parser: today, tomorrow, next monday, 7/20, 7/20/26, 7/20/2026
function parseNaturalDate(str){
  if(!str) return null;
  str = str.trim().toLowerCase().replace(/[.!,;]+$/,'');
  const t = todayDate();
  if(str==='today') return t;
  if(str==='tomorrow') return addDays(t,1);
  if(str==='next week') return addDays(t,7);
  const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  for(let i=0;i<days.length;i++){
    if(str.includes(days[i])){
      let target = i, cur = t.getDay();
      let diff = (target - cur + 7) % 7;
      if(diff===0) diff=7;
      if(str.includes('this') && diff>0 && (target-cur+7)%7 !== 0) diff = (target-cur+7)%7 || 7;
      return addDays(t, diff);
    }
  }
  // mm/dd or mm/dd/yy or mm/dd/yyyy
  const m = str.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m){
    let year = m[3] ? parseInt(m[3]) : t.getFullYear();
    if(year < 100) year += 2000; // shorthand '26' -> 2026
    return new Date(year, parseInt(m[1])-1, parseInt(m[2]));
  }
  // yyyy-mm-dd — what this app's own toLocalDateStr() produces, and what a native date
  // input's value always is. Must be built from local y/m/d components like the branch
  // above, NOT handed to `new Date(str)` — that treats a bare "2026-07-24" as UTC midnight,
  // which silently shifts it back a day in any timezone behind UTC (e.g. Arizona). Without
  // this explicit branch, simply re-saving a to-do without retyping its date at all would
  // creep the due date backward by one day every time.
  const mIso = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(mIso){
    return new Date(parseInt(mIso[1]), parseInt(mIso[2])-1, parseInt(mIso[3]));
  }
  const d2 = new Date(str);
  if(!isNaN(d2)) return d2;
  return null;
}

// Fixed hierarchy — NOT user-editable, unlike property categories. Ordered top (most
// advanced) to bottom, matching the board layout. "track" controls which stages a
// deal can move between once it's Lease vs Sale.
function roleLabel(role){
  if(role==='FullAccess') return 'Office Manager / Designated Broker';
  return role;
}
const LSR_STAGES = [
  {id:'signedLease', name:'Signed Lease', track:'lease', color:'#E8951E'},
  {id:'closedEscrow', name:'Closed Escrow', track:'sale', color:'#E8951E'},
  {id:'negotiating', name:'Negotiating Lease / PSA', track:'both', color:'#E0469A'},
  {id:'inEscrow', name:'In Escrow', track:'sale', color:'#E0469A'},
  {id:'signedLOI', name:'Signed LOI', track:'both', color:'#00A65A'},
  {id:'loi', name:'LOI', track:'both', color:'#00A65A'},
  {id:'prospect', name:'Prospect', track:'both', color:'#8A8378'},
  {id:'dead', name:'Dead', track:'both', color:'#8A7D6E'},
];
const LSR_STAGE_MAP = {}; LSR_STAGES.forEach(s=>LSR_STAGE_MAP[s.id]=s);
// The map needs every stage visually distinct (LSR_STAGES intentionally pairs lease/sale
// equivalents to the same color elsewhere, e.g. LOI and Signed LOI are both green there).
const MAP_STAGE_COLORS = {
  loi:'#00A65A', signedLOI:'#0B7A9C', negotiating:'#E0469A', inEscrow:'#8A3FCF',
  signedLease:'#E8951E', closedEscrow:'#C0392B', prospect:'#8A8378'
};
function lsrDealIsActive(p){
  // Closed Escrow means the sale already fully closed — never "active" from that point on.
  if(p.stage==='closedEscrow') return false;
  // A signed lease stops being "active" once both commission halves are paid — at that
  // point it's a fully closed-out deal, not something anyone still needs to track/chase.
  if(p.dealType==='lease' && p.commission1Paid && p.commission2Paid) return false;
  return true;
}
function lsrStagesForTrack(dealType){
  // dropdown options once converted, in hierarchy order (lowest to highest for a <select>).
  // Dead sits at the very end on both tracks — it's not part of the natural progression,
  // it's a terminal "this fell through" state a deal can drop into from anywhere.
  if(dealType==='sale') return ['prospect','loi','signedLOI','negotiating','inEscrow','closedEscrow','dead'];
  return ['prospect','loi','signedLOI','negotiating','signedLease','dead'];
}

function newLSRCategoryConfig(){
  return { order: DEFAULT_PROPERTY_CATEGORIES.map(c=>c.id), hidden: [], custom: [] };
}
function lsrCategoriesFor(listingClient){
  if(!listingClient.categoryConfig) listingClient.categoryConfig = newLSRCategoryConfig();
  const cfg = listingClient.categoryConfig;
  const all = DEFAULT_PROPERTY_CATEGORIES.concat(cfg.custom);
  const byId = {}; all.forEach(c=>byId[c.id]=c);
  // respect saved order, then append anything new (e.g. just-added custom categories)
  const ordered = cfg.order.map(id=>byId[id]).filter(Boolean);
  all.forEach(c=>{ if(!cfg.order.includes(c.id)) ordered.push(c); });
  return ordered.filter(c=>!cfg.hidden.includes(c.id));
}

// Custom smart lists are synced through Supabase (per-person, private — RLS scopes each
// row to its own user_id) so they follow you to any device, including mobile, instead of
// being stuck in one browser's local storage.
async function fetchSmartListsFromSupabase(){
  const authId = state.currentUser && state.currentUser.authId;
  if(!authId) return;
  const { data, error } = await supabaseClient.from('smart_lists').select('*').eq('user_id', authId).order('display_order', {ascending:true});
  if(error){ console.error('fetchSmartListsFromSupabase error:', error); return; }
  const custom = data.map(r=>({id:r.id, name:r.name, icon:r.icon, isDefault:false, filter:r.filter}));
  let defaults = SMART_LIST_DEFAULTS.map(s=>({...s, isDefault:true}));
  if(state.defaultSmartListOrder && state.defaultSmartListOrder.length){
    const order = state.defaultSmartListOrder;
    const known = new Set(order);
    defaults.forEach(d=>{ if(!known.has(d.id)){ order.push(d.id); known.add(d.id); } }); // anything new since last save still shows up
    defaults = order.map(id=>defaults.find(d=>d.id===id)).filter(Boolean);
  }
  smartListsArr = [...defaults, ...custom];
}
async function supaCreateSmartList(sl, order){
  const authId = state.currentUser && state.currentUser.authId;
  if(!authId) return;
  const { error } = await supabaseClient.from('smart_lists').insert({id:sl.id, user_id:authId, name:sl.name, icon:sl.icon, filter:sl.filter, display_order:order});
  if(error){ console.error('supaCreateSmartList error:', error); flashToast('Saved here, but syncing this smart list failed. (' + error.message + ')'); render(); }
}
async function supaUpdateSmartList(sl){
  const { error } = await supabaseClient.from('smart_lists').update({name:sl.name, icon:sl.icon, filter:sl.filter}).eq('id', sl.id);
  if(error){ console.error('supaUpdateSmartList error:', error); flashToast('Saved here, but syncing this smart list failed. (' + error.message + ')'); render(); }
}
async function supaDeleteSmartList(id){
  const { error } = await supabaseClient.from('smart_lists').delete().eq('id', id);
  if(error){ console.error('supaDeleteSmartList error:', error); flashToast('Deleted here, but syncing that deletion failed. (' + error.message + ')'); render(); }
}
async function supaReorderSmartLists(){
  const authId = state.currentUser && state.currentUser.authId;
  if(!authId) return;
  const customOnly = smartListsArr.filter(s=>!s.isDefault);
  await Promise.all(customOnly.map((sl, i)=>
    supabaseClient.from('smart_lists').update({display_order:i}).eq('id', sl.id)
      .then(({error})=>{ if(error) console.error('supaReorderSmartLists error:', error); })
  ));
  state.defaultSmartListOrder = smartListsArr.filter(s=>s.isDefault).map(s=>s.id);
  const { error } = await supabaseClient.from('profiles').update({default_smart_list_order: state.defaultSmartListOrder}).eq('id', authId);
  if(error) console.error('Saving default smart list order failed:', error);
}

function smartListTodos(key){
  const raw = smartListTodosRaw(key);
  if(key==='completed' || key==='archived') return raw;
  // Keep anything the user just marked complete visible in this same "open" list
  // until they navigate away — so a mis-click doesn't make it vanish instantly.
  if(state.recentlyCompletedIds.length){
    state.recentlyCompletedIds.forEach(id=>{
      if(raw.some(t=>t.id===id)) return;
      const td = db.todos.find(t=>t.id===id);
      if(td) raw.push(td);
    });
  }
  return raw;
}
// "My sphere" — my own to-do's, plus anything I've personally assigned to
// someone else. Deliberately excludes to-do's that only involve *other*
// people (e.g. something Nick created and assigned to himself, or to Lexi) —
// that's clutter for anyone who isn't Nick. Admins who genuinely need the
// full, unrestricted team view can still get it from the Admin menu.
function inMySphere(td){
  const me = state.currentUser.id;
  return td.assignedTo===me || td.createdBy===me;
}
function smartListTodosRaw(key){
  const t = db.todos.filter(td=>true);
  const me = state.currentUser.id;
  switch(key){
    case 'todayMe': return t.filter(td=>!td.completed && td.assignedTo===me && dueStatus(td.dueDate)==='today');
    case 'todayAll': return t.filter(td=>!td.completed && inMySphere(td) && dueStatus(td.dueDate)==='today');
    case 'overdueMe': return t.filter(td=>!td.completed && td.assignedTo===me && dueStatus(td.dueDate)==='overdue');
    case 'overdueAll': return t.filter(td=>!td.completed && inMySphere(td) && dueStatus(td.dueDate)==='overdue');
    case 'assignedByOthers': return t.filter(td=>!td.completed && td.assignedTo===me && td.createdBy && td.createdBy!==me);
    case 'week': return t.filter(td=>!td.completed && inMySphere(td) && ['today','overdue','week'].includes(dueStatus(td.dueDate)));
    case 'month': return t.filter(td=>!td.completed && inMySphere(td) && ['today','overdue','week','month'].includes(dueStatus(td.dueDate)));
    case 'allMe': return t.filter(td=>!td.completed && inMySphere(td));
    case 'someday': return t.filter(td=>!td.completed && !td.dueDate && inMySphere(td));
    case 'completed': return t.filter(td=>td.completed && inMySphere(td));
    case 'archived': return db.archivedTodos.filter(td=>inMySphere(td));
    case 'everything': return t.filter(td=>!td.completed && inMySphere(td));
    case 'fullTeam': return t.filter(td=>!td.completed); // Admin-only, unrestricted — genuinely everyone
    default: {
      const custom = smartListsArr.find(c=>c.id===key && !c.isDefault);
      if(custom) return t.filter(td=>matchesCustomFilter(td, custom.filter));
      return [];
    }
  }
}
function todoBelongsToClient(td, clientId){
  if(td.clientId===clientId) return true;
  // also match to-do's linked to a deal that belongs to this client
  if(td.dealId){
    for(const l of db.lists){
      if(l.type==='deep'){
        const c = l.clients.find(x=>x.id===clientId);
        if(c && c.deals.some(d=>d.id===td.dealId)) return true;
      }
    }
  }
  return false;
}
function matchesCustomFilter(td, f){
  if(!f) return false;
  const matchMode = f.matchMode || 'all'; // old saved lists have no matchMode — behave exactly as before (all-AND)
  const checks = []; // only conditions the person actually specified go in here

  if(f.status && f.status!=='any'){
    checks.push(f.status==='completed' ? !!td.completed : !td.completed);
  }
  if(f.assignee && f.assignee!=='any'){
    if(f.assignee==='me') checks.push(td.assignedTo===state.currentUser.id);
    else if(f.assignee==='meByOthers') checks.push(td.assignedTo===state.currentUser.id && !!td.createdBy && td.createdBy!==state.currentUser.id);
    else if(f.assignee==='unassigned') checks.push(!td.assignedTo);
    else checks.push(td.assignedTo===f.assignee);
  }
  if(f.dateRule && f.dateRule!=='any'){
    const s = dueStatus(td.dueDate);
    if(f.dateRule==='nodate') checks.push(!td.dueDate);
    else if(f.dateRule==='exact') checks.push(!!(td.dueDate && f.exactDate && isSameDay(td.dueDate, new Date(f.exactDate+'T00:00:00'))));
    else if(f.dateRule==='today') checks.push(s==='today');
    else if(f.dateRule==='week') checks.push(['today','overdue','week'].includes(s));
    else if(f.dateRule==='month') checks.push(['today','overdue','week','month'].includes(s));
    else if(f.dateRule==='overdue') checks.push(s==='overdue');
  }
  // Categories: accept either the new multi-select array or an old single-value string,
  // so lists saved before this change keep working. Matching ANY selected category is
  // always the right interpretation here regardless of the overall matchMode — picking
  // several categories means "could be any of these", not "must have all of them at once"
  // (a to-do can only have one category anyway).
  const categories = (f.categories && f.categories.length) ? f.categories : (f.category ? [f.category] : []);
  if(categories.length){
    const tdCat = (td.category||'').toLowerCase();
    checks.push(categories.some(c=>c.trim().toLowerCase()===tdCat));
  }
  // Clients: same reasoning — multiple selected clients means "any of these accounts".
  const clientIds = (f.clientIds && f.clientIds.length) ? f.clientIds : (f.clientId ? [f.clientId] : []);
  if(clientIds.length){
    checks.push(clientIds.some(cid=>todoBelongsToClient(td, cid)));
  }
  if(f.personalOnly){
    checks.push(!td.clientId && !td.dealId && !td.entryId);
  }

  if(!checks.length) return true; // no criteria specified at all — matches everything, same as before
  return matchMode==='any' ? checks.some(Boolean) : checks.every(Boolean);
}
function visibleTodo(td){
  // privacy: if private and not mine and not... (admins still can't see detail, only count)
  if(td.private && td.assignedTo!==state.currentUser.id) return false;
  return true;
}

const DAYS_OF_WEEK = [
  {id:'sunday',short:'Sun'},{id:'monday',short:'Mon'},{id:'tuesday',short:'Tue'},{id:'wednesday',short:'Wed'},
  {id:'thursday',short:'Thu'},{id:'friday',short:'Fri'},{id:'saturday',short:'Sat'}
];
function scheduleSummary(sched){
  if(!sched) return 'Using company default';
  if(sched.type==='off') return 'Off — no reminder emails';
  const timeLabel = sched.time;
  if(sched.type==='weekly'){
    const day = DAYS_OF_WEEK.find(d=>d.id===(sched.days[0]||'sunday'));
    return `Weekly, ${day?day.short:'Sun'} at ${timeLabel}`;
  }
  const days = sched.days||[];
  let daysLabel;
  if(days.length===7) daysLabel='every day';
  else if(days.length===5 && !days.includes('saturday') && !days.includes('sunday')) daysLabel='weekdays';
  else daysLabel = days.map(d=>DAYS_OF_WEEK.find(x=>x.id===d).short).join('/') || 'no days selected';
  return `Daily (${daysLabel}) at ${timeLabel}`;
}
function generateDigestBody(forUser){
  const items = smartListTodos('week').filter(td=>td.assignedTo===forUser.id);
  const visible = items.filter(td=> !td.private || forUser.id===state.currentUser.id);
  const hiddenCount = items.length - visible.length;
  let body = `Hi ${forUser.name.split(' ')[0]},\n\nHere's what's due this week on Southwest Edge Portal:\n\n`;
  if(!visible.length) body += 'Nothing due this week. Nice work.\n';
  else visible.forEach(td=>{ body += `• ${td.title}${td.dueDate? ' — due '+fmtDate(td.dueDate):''}\n`; });
  if(hiddenCount>0) body += `\n(${hiddenCount} private item${hiddenCount===1?'':'s'} not shown here.)\n`;
  body += `\nLog in to see full details: ${portalUrl()}\n\n— Southwest Edge Portal`;
  return body;
}

function portalUrl(todoId){

  // (Netlify, custom domain, etc.) without hardcoding any address.
  const base = window.location.origin + window.location.pathname;

async function doAppRefresh(){
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const reg of regs) await reg.update();
    }
  } catch(e){ /* fine either way — reload below still fetches fresh over the network */ }
  location.reload();
}
function openEmailDraft(toUser, subject, body){
  const client = (state.currentUser && state.currentUser.emailClient) || 'other';
  const enc = encodeURIComponent;
  let url;
  if(client==='outlookWeb'){
    url = `https://outlook.office.com/mail/deeplink/compose?to=${enc(toUser.email)}&subject=${enc(subject)}&body=${enc(body)}`;
  } else if(client==='gmail'){
    url = `https://mail.google.com/mail/?view=cm&fs=1&to=${enc(toUser.email)}&su=${enc(subject)}&body=${enc(body)}`;
  } else {
    url = `mailto:${toUser.email}?subject=${enc(subject)}&body=${enc(body)}`;
  }
  // window.location works far more reliably than the old "invisible link click" trick,
  // especially on mobile Safari, where synthetic clicks on mailto: links are often
  // silently swallowed. Web-based clients still need a real new tab.
  if(client==='outlookWeb' || client==='gmail') window.open(url, '_blank');
  else window.location.href = url;
}

}

function passwordIsStrong(pw){
  return pw.length>=8 && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
}
function attachLoginHandlers(){
  document.querySelectorAll('[data-selectuser]').forEach(el=>el.onclick=()=>{
    state.selectedLoginUser = el.dataset.selectuser; state.loginError=null; render();
  });
  const toggleModeBtn = document.getElementById('toggleLoginModeBtn');
  if(toggleModeBtn) toggleModeBtn.onclick=()=>{
    state.loginMode = (state.loginMode==='signin') ? 'create' : 'signin';
    state.loginError = null;
    render();
  };
  const submit = document.getElementById('loginSubmitBtn');
  if(submit) submit.onclick=async ()=>{
   try{
    const u = USERS.find(x=>x.id===state.selectedLoginUser);
    const pw = document.getElementById('loginPw').value;
    state.loginError = null;
    submit.disabled = true; submit.textContent = 'One moment…';

    if(state.loginMode==='create'){
      const pw2 = document.getElementById('loginPw2').value;
      if(!passwordIsStrong(pw)){
        state.loginError = 'Password must be at least 8 characters, with a number and a special character.';
        submit.disabled=false; render(); return;
      }
      if(pw!==pw2){
        state.loginError = "Passwords don't match — try again.";
        submit.disabled=false; render(); return;
      }
      const { data, error } = await supabaseClient.auth.signUp({ email: u.email, password: pw });
      if(error){
        state.loginError = error.message.includes('already registered')
          ? 'An account already exists for this person — use "Sign in" instead.'
          : `Couldn't create the account: ${error.message}`;
        submit.disabled=false; render(); return;
      }
      // Real signup succeeded — now create the matching profile row.
      const { error: profileError } = await supabaseClient.from('profiles').insert({
        id: data.user.id, name: u.name, email: u.email, role: u.role, initials: u.initials
      });
      if(profileError){
        state.loginError = `Account created, but saving your profile failed: ${profileError.message}. Contact an admin.`;
        submit.disabled=false; render(); return;
      }
      u.authId = data.user.id;
      state.pendingLoginUser = u;
      state.showEmailClientPicker = true;
      render();
      return;
    }

    // mode === 'signin'
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: u.email, password: pw });
    if(error){
      state.loginError = error.message.includes('Invalid login credentials')
        ? 'Incorrect password, or no account yet — first time here? Use "Create your account" below.'
        : `Sign-in failed: ${error.message}`;
      submit.disabled=false; render(); return;
    }
    let profile = await fetchMyProfile(data.user.id);
    let selfHealError = null;
    if(!profile){
      // Account exists but its profile row never got created (e.g. an earlier
      // attempt hit an RLS error, exactly like this bug did) — self-heal it now.
      const { error: createError } = await supabaseClient.from('profiles').insert({
        id: data.user.id, name: u.name, email: u.email, role: u.role, initials: u.initials
      });
      if(!createError) profile = await fetchMyProfile(data.user.id);
      else selfHealError = createError;
    }
    if(!profile){
      // Still no profile — do NOT silently let them into the app with no real
      // account record. Show the real error so this can't fail invisibly again.
      state.loginError = `Signed in, but couldn't create/find your profile: ${selfHealError ? selfHealError.message : 'unknown error'}. Contact an admin — likely a database permissions issue.`;
      submit.disabled=false; render(); return;
    }
    u.authId = profile.id;
    if(!u.emailClient) u.emailClient = profile.email_client;
    if(profile.widget_order) state.widgetOrder = profile.widget_order;
    if(profile.sidebar_lists_order && profile.sidebar_lists_order.length) sidebarListsOrder = profile.sidebar_lists_order;
    if(profile.default_smart_list_order && profile.default_smart_list_order.length) state.defaultSmartListOrder = profile.default_smart_list_order;
    u.notesList = await fetchPersonalNotes(profile.id);
    await fetchAllProfilesIntoUsers();
    if(!u.emailClient){
      state.pendingLoginUser = u;
      state.showEmailClientPicker = true;
      render();
      return;
    }
    state.currentUser=u; state.screen='app'; state.mainView={type:'dashboard'}; if(!appStateWasLoaded) seedAll(); state.loginTarget=null;
    try{
      await fetchAllAppDataFromSupabase();
      checkTodoDeepLink(); checkBrokerReviewDeepLink();
    } catch(e){
      console.error('Post-login data load failed (still letting the user in):', e);
      flashToast("Signed in, but something went wrong loading your data. Try refreshing — if this keeps happening, tell an admin.");
    }
    render();
   } catch(e){
    console.error('Sign-in failed unexpectedly:', e);
    state.loginError = `Something unexpected went wrong signing in: ${e.message}. Try again — if it keeps happening, tell an admin.`;
    submit.disabled=false;
    render();
   }
  };
  const showReg = document.getElementById('showRegisterBtn');
  if(showReg) showReg.onclick=()=>{ state.showRegisterForm=true; render(); };
  const regBtn = document.getElementById('regCreateBtn');
  if(regBtn) regBtn.onclick=()=>{
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    if(!name || !email){ flashToast('Name and email are both required.'); render(); return; }
    const request = {id:crypto.randomUUID(), name, email, requestedAt:new Date()};
    pendingUsers.push(request);
    supaCreatePendingUser(request);
    state.showRegisterForm = false;
    state.showSendRequestReminder = {name}; // persistent on-screen reminder, not just a toast
    // Notify every admin — no one is logged in yet at this point, so this always
    // goes out as a plain mailto: rather than through a chosen email client. This
    // opens in the REQUESTER's own email app, not the admin's — so the wording
    // and the on-screen reminder both need to make it obvious they must hit Send.
    const admins = USERS.filter(x=>x.role==='Admin');
    const toList = admins.map(a=>a.email).join(',');
    const subject = `ACTION NEEDED: ${name} Has Requested Access to Southwest Edge Portal`;
    const body = `${name} (${email}) has requested access to the Southwest Edge Portal.\n\nLog in and open Admin > Pending User Requests to admit or deny this request.\n\n— Southwest Edge Portal`;
    window.location.href = `mailto:${toList}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    render();
  };
  const dismissReminder = document.getElementById('dismissSendReminderBtn'); if(dismissReminder) dismissReminder.onclick=()=>{
    state.showSendRequestReminder = null; render();
  };
}

function moveKeyInArray(arr, key, dir){
  const idx = arr.indexOf(key);
  if(idx<0) return;
  const swapIdx = dir==='up'? idx-1 : idx+1;
  if(swapIdx<0 || swapIdx>=arr.length) return;
  const tmp = arr[idx]; arr[idx]=arr[swapIdx]; arr[swapIdx]=tmp;
}
function moveArrayItem(arr, id, dir){
  const idx = arr.findIndex(x=>x.id===id);
  if(idx<0) return;
  const swapIdx = dir==='up'? idx-1 : idx+1;
  if(swapIdx<0 || swapIdx>=arr.length) return;
  const tmp = arr[idx]; arr[idx]=arr[swapIdx]; arr[swapIdx]=tmp;
}

// Normalizes text for fuzzy matching — treats &, /, "and", + as interchangeable separators,
// strips punctuation and extra whitespace, lowercases. This is the "WAG" (wild-ass guess)
// feature: "Main & Main - SEC" and "Main / Main - SEC" become identical before comparing.
function normalizeForMatch(str){
  if(!str) return '';
  return str.toLowerCase()
    .replace(/\band\b/g, '&')
    .replace(/[\/+]/g, '&')
    .replace(/[^a-z0-9&\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function tokenizeForMatch(str){
  return normalizeForMatch(str).split(/[\s&]+/).filter(Boolean);
}
// Tolerates both formatting differences ("&" vs "/" vs "and") AND a misheard word from
// voice-to-text (e.g. "Kino" heard as "Keno") — compared word-by-word so an extra suffix
// like "NEC" doesn't throw off the comparison on the word that actually matters.
function fuzzyTextMatch(a, b){
  const na = normalizeForMatch(a), nb = normalizeForMatch(b);
  if(!na || !nb) return false;
  const naJoined = na.replace(/\s+/g,''), nbJoined = nb.replace(/\s+/g,'');
  if(naJoined===nbJoined || naJoined.includes(nbJoined) || nbJoined.includes(naJoined)) return true;
  const tokensA = tokenizeForMatch(a), tokensB = tokenizeForMatch(b);
  if(!tokensA.length || !tokensB.length) return false;
  const [shortTokens, longTokens] = tokensA.length <= tokensB.length ? [tokensA, tokensB] : [tokensB, tokensA];
  return shortTokens.every(tok=>{
    if(tok.length < 3) return longTokens.includes(tok);
    return longTokens.some(t2=>{
      if(t2===tok || t2.includes(tok) || tok.includes(t2)) return true;
      const maxDistance = Math.max(1, Math.floor(Math.max(tok.length, t2.length) * 0.25));
      return levenshteinDistance(tok, t2) <= maxDistance;
    });
  });
}
// --- Voice Note feature (Michael only) ---
function startVoiceNoteRecording(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    flashToast("Voice recognition isn't supported in this browser — try Chrome or Safari.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  state.voiceNoteRecording = true;
  render();
  const clearSafety = ()=>{ if(state._voiceNoteSafetyTimer){ clearTimeout(state._voiceNoteSafetyTimer); state._voiceNoteSafetyTimer=null; } };
  recognition.onresult = (event)=>{
    clearSafety();
    const transcript = event.results[0][0].transcript;
    state.voiceNoteRecording = false;
    render();
    processVoiceNoteTranscript(transcript);
  };
  recognition.onerror = (event)=>{
    clearSafety();
    console.error('Speech recognition error:', event.error);
    state.voiceNoteRecording = false;
    flashToast("Didn't catch that — please try again.");
    render();
  };
  recognition.onend = ()=>{ clearSafety(); if(state.voiceNoteRecording){ state.voiceNoteRecording=false; render(); } };
  state._activeSpeechRecognition = recognition;
  // Safety net: some mobile browsers can leave a recording session hanging (e.g. an
  // accidental bump that doesn't register a second tap to stop). This guarantees it
  // can never stay stuck listening for more than 20 seconds, no matter what.
  state._voiceNoteSafetyTimer = setTimeout(()=>{
    if(state.voiceNoteRecording){
      try{ recognition.abort(); }catch(e){}
      state.voiceNoteRecording = false;
      flashToast("Voice recording timed out — please try again.");
      render();
    }
  }, 20000);
  recognition.start();
}
function toggleVoiceNoteRecording(){
  if(state.voiceNoteRecording){
    if(state._voiceNoteSafetyTimer){ clearTimeout(state._voiceNoteSafetyTimer); state._voiceNoteSafetyTimer=null; }
    if(state._activeSpeechRecognition){ try{ state._activeSpeechRecognition.abort(); }catch(e){} }
    state.voiceNoteRecording = false;
    render();
  } else {
    startVoiceNoteRecording();
  }
}
async function processVoiceNoteTranscript(transcript){
  flashToast('Processing voice note…');
  try{
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const jwt = sessionData?.session?.access_token;
    const teamNames = USERS.map(u=>u.name.split(' ')[0]);
    const res = await fetch(`https://ugtlyzwvnhmcphtqkbke.supabase.co/functions/v1/parse-voice-note`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${jwt}` },
      body: JSON.stringify({ transcript, teamNames, today: toLocalDateStr(todayDate()) })
    });
    const body = await res.json();
    if(!res.ok || body.error){ flashToast(body.error || "Couldn't process that voice note."); render(); return; }
    const parsed = body.parsed;
    if(parsed.intent==='createProspect') await resolveAndCreateProspect(parsed);
    else if(parsed.intent==='signCall') await resolveAndCreateSignCall(parsed);
    else await resolveAndSaveVoiceNote(parsed);
  }catch(e){
    console.error('processVoiceNoteTranscript error:', e);
    flashToast("Something went wrong processing that voice note.");
    render();
  }
}
async function resolveAndSaveVoiceNote(parsed){
  if(!parsed.accountName){
    flashToast("Couldn't tell which account that was for — please try again and name it clearly.");
    render();
    return;
  }
  const clientsList = db.lists.find(x=>x.id==='clients');
  const matchedClientRec = clientsList.clients.find(c=>fuzzyTextMatch(c.name, parsed.accountName));
  let clientDealCandidate = null, clientDealIsNew = false;
  if(matchedClientRec){
    const deals = matchedClientRec.deals||[];
    clientDealCandidate = parsed.propertyDescription
      ? deals.find(d=>fuzzyTextMatch(d.building||d.name, parsed.propertyDescription))
      : (deals.length===1 ? deals[0] : null);
    // Client account exists, but this specific site/deal doesn't yet — create it rather
    // than failing, same as the LOI import does for a brand-new site under a known Client.
    if(!clientDealCandidate && parsed.propertyDescription){
      clientDealCandidate = {id:crypto.randomUUID(), name: parsed.propertyDescription, complete:false, activeDeal:false,
        dueDate:null, caExecuted:false, dealType:null, building: parsed.propertyDescription, stage:'prospect',
        splits:[], commission1Paid:false, commission2Paid:false, notes:''};
      clientDealIsNew = true;
    }
  }
  const listingsList = db.lists.find(x=>x.id==='listings');
  let listingMatch=null, prospectMatch=null, prospectIsNew=false;
  if(parsed.propertyDescription){
    const listing = listingsList.clients.find(l=>fuzzyTextMatch(l.name, parsed.propertyDescription));
    if(listing){
      const prospects = listing.prospects||[];
      const prospect = prospects.find(p=>fuzzyTextMatch(p.tenantName, parsed.accountName)) || (prospects.length===1?prospects[0]:null);
      if(prospect){ listingMatch=listing; prospectMatch=prospect; }
      else {
        // Listing exists, but this tenant isn't tracked there yet — create a new
        // prospect rather than failing, so a brand-new lead can still get a note.
        listingMatch = listing;
        prospectMatch = {id:crypto.randomUUID(), tenantName: parsed.accountName, stage:'contacted', dealType:null,
          dateOfContact: todayDate(), notes:'', edgeTracker:null, attachments:[], commission1Paid:false, commission2Paid:false};
        prospectIsNew = true;
      }
    }
  }
  if(!listingMatch){
    const matches = [];
    listingsList.clients.forEach(l=>{ (l.prospects||[]).forEach(p=>{ if(fuzzyTextMatch(p.tenantName, parsed.accountName)) matches.push({listing:l, prospect:p}); }); });
    if(matches.length===1){ listingMatch=matches[0].listing; prospectMatch=matches[0].prospect; }
    else if(matches.length>1){ state.voiceNoteAmbiguous = {type:'listingPick', candidates:matches, parsed}; render(); return; }
  }
  const haveClientResult = !!(matchedClientRec && clientDealCandidate);
  const haveListingResult = !!(listingMatch && prospectMatch);
  if(haveClientResult && haveListingResult){
    state.voiceNoteAmbiguous = {type:'sidePick',
      clientResult:{client:matchedClientRec, deal:clientDealCandidate, isNew:clientDealIsNew},
      listingResult:{listing:listingMatch, prospect:prospectMatch, isNew:prospectIsNew}, parsed};
    render();
    return;
  }
  if(haveListingResult){ await saveVoiceNoteToTarget('listings', listingMatch, prospectMatch, parsed, prospectIsNew); return; }
  if(haveClientResult){ await saveVoiceNoteToTarget('clients', matchedClientRec, clientDealCandidate, parsed, clientDealIsNew); return; }
  flashToast(`Couldn't find a matching deal for "${parsed.accountName}"${parsed.propertyDescription?` at ${parsed.propertyDescription}`:''} — nothing was saved.`);
  render();
}
async function saveVoiceNoteToTarget(side, accountRec, rec, parsed, isNew){
  const dateStr = fmtDate(todayDate());
  const existingNotes = rec.notes || '';
  rec.notes = existingNotes ? `${existingNotes}\n\n[${dateStr}] ${parsed.noteText}` : `[${dateStr}] ${parsed.noteText}`;
  if(side==='clients'){
    if(isNew){ accountRec.deals = accountRec.deals || []; accountRec.deals.push(rec); await supaCreateDeal(rec, accountRec.id); }
    else await supaUpdateDeal(rec, accountRec.id);
  } else {
    if(isNew){ accountRec.prospects = accountRec.prospects || []; accountRec.prospects.push(rec); await supaCreateProspect(rec, accountRec.id); }
    else await supaUpdateProspect(rec, accountRec.id);
  }
  let todoMsg = '';
  if(parsed.followUpDate){
    let assignee = state.currentUser;
    if(parsed.assigneeName){
      const found = USERS.find(u=>u.name.toLowerCase().startsWith(parsed.assigneeName.toLowerCase()));
      if(found) assignee = found;
    }
    const targetName = side==='clients' ? rec.name : rec.tenantName;
    const todo = {id:crypto.randomUUID(), title:`Follow up: ${targetName}`,
      dueDate:new Date(parsed.followUpDate+'T00:00:00'), assignedTo:assignee.id, createdBy:state.currentUser.id,
      type:'task', private:false, completed:false, isNew:true, notes: parsed.noteText,
      listId:null, clientId:accountRec.id, dealId: side==='clients'?rec.id:null, entryId:null, attachments:[]};
    db.todos.push(todo);
    await supaCreateTodo(todo);
    todoMsg = ` To-do created for ${assignee.name.split(' ')[0]}, due ${fmtDate(new Date(parsed.followUpDate+'T00:00:00'))}.`;
  }
  state.voiceNoteAmbiguous = null;
  flashToast(`Note added to ${side==='clients'?rec.name:rec.tenantName}.${todoMsg}`);
  render();
}

const LOI_COUNTER_CODES = {
  'clients-lease': {code:'LLC', label:'Landlord Counter (LLC)'},
