  overlay.querySelectorAll('[data-action="addChecklistItem"]').forEach(btn=>btn.onclick=()=>{
    const newItem = {id:crypto.randomUUID(), text:'', done:false};
    td.checklistItems.push(newItem);
    supaUpdateTodo(td);
    renderPreservingScroll('.modal-body');
    // render() inside renderPreservingScroll runs synchronously, so the new input
    // already exists in the DOM by the time we get here — focusing it immediately,
    // in the same tick as the tap, is what makes mobile Safari actually raise the
    // keyboard. Wrapping this in requestAnimationFrame (as scroll-restore needs)
    // breaks that connection to the original tap and silently fails on mobile.
    const els = document.querySelectorAll(`[data-checklistitemtext="${newItem.id}"]`);
    const newInput = els[els.length-1];
    if(newInput) newInput.focus();
  });
  overlay.querySelectorAll('[data-checklistitemtext]').forEach(el=>el.onchange=()=>{
    const item = td.checklistItems.find(i=>i.id===el.dataset.checklistitemtext);
    if(item){ item.text = el.value.trim(); supaUpdateTodo(td); renderPreservingScroll('.modal-body'); }
  });
  overlay.querySelectorAll('[data-checklistitemdue]').forEach(el=>el.onchange=()=>{
    const item = td.checklistItems.find(i=>i.id===el.dataset.checklistitemdue);
    if(item){ item.dueDate = el.value ? new Date(el.value+'T00:00:00') : null; supaUpdateTodo(td); }
  });
  overlay.querySelectorAll('[data-checklistitemdue2]').forEach(el=>el.onchange=()=>{
    const item = td.checklistItems.find(i=>i.id===el.dataset.checklistitemdue2);
    if(item){ item.dueDate2 = el.value ? new Date(el.value+'T00:00:00') : null; supaUpdateTodo(td); }
  });
  overlay.querySelectorAll('[data-checkitem]').forEach(el=>el.onchange=()=>{
    const item = td.checklistItems.find(i=>i.id===el.dataset.checkitem);
    if(item){ item.done = el.checked; supaUpdateTodo(td); renderPreservingScroll('.modal-body'); }
  });
  overlay.querySelectorAll('[data-removeitem]').forEach(el=>el.onclick=()=>{
    td.checklistItems = td.checklistItems.filter(i=>i.id!==el.dataset.removeitem);
    supaUpdateTodo(td);
    renderPreservingScroll('.modal-body');
  });
  overlay.querySelectorAll('[data-action="newProjectChildTodo"]').forEach(btn=>btn.onclick=()=>{
    openNewTodoModal({listId: td.listId, clientId: td.clientId, dealId: td.dealId, entryId: td.entryId, projectId: td.id});
    render();
  });
  const addProjectAuthBtn = overlay.querySelector('[data-action="addProjectAuthUser"]'); if(addProjectAuthBtn) addProjectAuthBtn.onclick=safeHandler(async ()=>{
    const sel = document.getElementById('addProjectAuthUserSelect');
    const userId = sel.value;
    const ok = await supaAddProjectAuthorizedUser(td.id, userId);
    if(ok){
      if(!td.authorizedUserIds) td.authorizedUserIds=[];
      td.authorizedUserIds.push(userId);
      flashToast(`${USERS.find(u=>u.id===userId).name} can now see this Project.`);
    }
    renderPreservingScroll('.modal-body');
  });
  overlay.querySelectorAll('[data-removeprojectauth]').forEach(el=>el.onclick=safeHandler(()=>{
    const userId = el.dataset.removeprojectauth;
    td.authorizedUserIds = (td.authorizedUserIds||[]).filter(id=>id!==userId);
    supaRemoveProjectAuthorizedUser(td.id, userId);
    renderPreservingScroll('.modal-body');
  }));
  const moveBtn = overlay.querySelector('[data-action="openMoveTodo"]'); if(moveBtn) moveBtn.onclick=()=>{
    state.moveTodoPicker = {todoId: td.id, step:'client', query:''};
    render();
  };
  const detAssign = document.getElementById('detAssign');
  detAssign.onchange = ()=>{
    td.assignedTo = detAssign.value;
    const forMe = detAssign.value===state.currentUser.id;
    document.getElementById('detSaveBtn').textContent = forMe? 'Save & Close' : 'Save & Assign';
    document.getElementById('detSaveBtnTop').textContent = forMe? 'Save & Close' : 'Save & Assign';
  };
  const detPrivateEl = document.getElementById('detPrivate'); if(detPrivateEl) detPrivateEl.onchange=()=>{ td.private = detPrivateEl.checked; };
  wireAttachmentZone(overlay, 'detDropZone', 'detFileInput', ()=>td.attachments, 'det');
  overlay.querySelector('[data-action="detDelete"]').onclick=()=>{
    if(confirm(`Delete "${td.title}"? This can't be undone.`)){ deleteTodo(td.id); render(); }
  };
  overlay.querySelector('[data-action="detToggleComplete"]').onclick=()=>{ td.completed=!td.completed; td.completedAt = td.completed ? new Date() : null; supaUpdateTodo(td); render(); };
  const sendReminderBtn = overlay.querySelector('[data-action="detSendReminder"]');
  if(sendReminderBtn) sendReminderBtn.onclick=()=>{
    if(!confirm(`Send ${USERS.find(u=>u.id===td.assignedTo).name} a reminder to update this to-do? They'll get an email and won't be able to close it without responding.`)) return;
    td.reminderPending = true;
    supaUpdateTodo(td);
    flashToast('Reminder sent.');
    render();
  };
  // Live-commit these fields as they're typed, so the checklist add/remove/edit
  // handlers below (which do trigger a full re-render) can never wipe them out.
  const detTitleEl = document.getElementById('detTitle'); if(detTitleEl) detTitleEl.oninput=()=>{ td.title = detTitleEl.value; };
  const detCategoryEl = document.getElementById('detCategory'); if(detCategoryEl) detCategoryEl.oninput=()=>{ td.category = detCategoryEl.value; };
  const detStatusEl = document.getElementById('detStatus'); if(detStatusEl) detStatusEl.oninput=()=>{ td.status = detStatusEl.value; };
  const detNotesEl = document.getElementById('detNotes'); if(detNotesEl) detNotesEl.oninput=()=>{ td.notes = detNotesEl.value; };
  const detDueEl = document.getElementById('detDue'); if(detDueEl) detDueEl.onchange=()=>{ td.dueDate = detDueEl.value ? new Date(detDueEl.value+'T00:00:00') : null; };
  overlay.querySelectorAll('[data-action="detSave"]').forEach(btn=>btn.onclick=()=>{
    td.title=document.getElementById('detTitle').value.trim()||td.title;
    td.category=document.getElementById('detCategory').value.trim();
    td.status=document.getElementById('detStatus').value.trim();
    td.dueDate=parseNaturalDate(document.getElementById('detDue').value.trim());
    td.notes=document.getElementById('detNotes').value.trim();
    const newAssign=td.assignedTo;
    const originalAssign=state.todoDetailModal.originalAssignedTo;
    if(newAssign!==originalAssign){
      const targetClientId = td.clientId || (td.dealId ? clientIdForDeal(td.dealId) : null);
      if(newAssign!==state.currentUser.id && targetClientId && !userHasClientAccess(newAssign, targetClientId)){
        const nu = USERS.find(x=>x.id===newAssign);
        const ok = confirm(`${nu.name} doesn't have access to this client yet, so they'll only be able to see this specific to-do — not the rest of the client's deals or info. Assign it to them anyway?`);
        if(!ok){ td.assignedTo = originalAssign; return; }
      }
      if(newAssign!==state.currentUser.id){
        td.isNew=true;
        flashToast(`Assigned to ${USERS.find(x=>x.id===newAssign).name}.`);
      }
    }
    td.private=document.getElementById('detPrivate').checked;
    if(!attemptCloseTodoDetail(td)){ render(); return; }
    supaUpdateTodo(td);
    flashToast('Changes saved.');
    render();
  });
}

/* ---------------- CENTRALIZED TODO ROW WIRING ---------------- */
function wireTodoRowHandlers(root){
  const selectAllCb = root.querySelector('#selectAllTodosCheckbox');
  if(selectAllCb) selectAllCb.onchange=()=>{
    const ids = selectAllCb.dataset.selectallids ? selectAllCb.dataset.selectallids.split(',').filter(Boolean) : [];
    if(selectAllCb.checked){
      ids.forEach(id=>{ if(!state.selectedTodoIds.includes(id)) state.selectedTodoIds.push(id); });
    } else {
      state.selectedTodoIds = state.selectedTodoIds.filter(id=>!ids.includes(id));
    }
    render();
  };
  root.querySelectorAll('[data-todo]').forEach(el=>{
    el.onclick=(ev)=>{
      if(ev.target.closest('[data-toggle],[data-select],[data-delete],[data-stopprop]')) return;
      openTodoDetail(el.dataset.todo); render();
    };
  });
  root.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=(ev)=>{ ev.stopPropagation(); toggleComplete(el.dataset.toggle); renderPreservingScroll('.content'); });
  root.querySelectorAll('[data-select]').forEach(el=>el.onclick=(ev)=>{ ev.stopPropagation(); toggleSelectTodo(el.dataset.select); renderPreservingScroll('.content'); });
  root.querySelectorAll('[data-delete]').forEach(el=>el.onclick=(ev)=>{
    ev.stopPropagation();
    const td = db.todos.find(x=>x.id===el.dataset.delete);
    if(td && confirm(`Delete "${td.title}"? This can't be undone.`)){ deleteTodo(el.dataset.delete); render(); }
  });
  root.querySelectorAll('[data-stopprop]').forEach(el=>el.onclick=(ev)=>ev.stopPropagation());
  const bc=root.querySelector('[data-action="bulkComplete"]'); if(bc) bc.onclick=()=>{ bulkCompleteSelected(); render(); };
  const bd=root.querySelector('[data-action="bulkDelete"]'); if(bd) bd.onclick=()=>{
    if(confirm(`Delete ${state.selectedTodoIds.length} selected to-do(s)? This can't be undone.`)){ bulkDeleteSelected(); render(); }
  };
  const bx=root.querySelector('[data-action="bulkClear"]'); if(bx) bx.onclick=()=>{ state.selectedTodoIds=[]; render(); };
  const archiveAllBtn=root.querySelector('[data-action="archiveAllCompleted"]'); if(archiveAllBtn) archiveAllBtn.onclick=()=>{
    const n = archiveAllCompleted();
    flashToast(`Archived ${n} completed to-do${n===1?'':'s'}.`);
    render();
  };
  root.querySelectorAll('[data-restorearchived]').forEach(el=>el.onclick=()=>{
    restoreArchivedTodo(el.dataset.restorearchived);
    flashToast('Restored to your active to-do\'s.');
    render();
  });
}

/* ---------------- MODAL STACK: Client / Deal / FlatEntry ---------------- */
// Central access gate for opening a client/deal — every navigation path (search results,
// nav links, "move to" pickers, anything now or added later) routes through these two
// functions, so checking access here covers all of them in one place.
function canViewClientLocally(listId, clientId){
  if(state.currentUser.role==='Admin' || state.currentUser.role==='FullAccess') return true;
  const l = db.lists.find(x=>x.id===listId);
  const c = l && l.clients.find(x=>x.id===clientId);
  if(!c) return false; // not even present in this browser's data — definitely no access
  return c.createdBy===state.currentUser.id || (c.authorizedUserIds||[]).includes(state.currentUser.id);
}
function openClientModal(listId, clientId, viewMode){
  if(!canViewClientLocally(listId, clientId)){
    alert('You are not listed as a user on the account.');
    return;
  }
  state.modalStack=[{kind:'client', listId, clientId, viewMode: viewMode||'all'}];
}
function openDealModal(listId, clientId, dealId){
  if(!canViewClientLocally(listId, clientId)){
    alert('You are not listed as a user on the account.');
    return;
  }
  const parentScroller = document.querySelector('.modal-body');
  state.modalStack.push({kind:'deal', listId, clientId, dealId, parentScrollTop: parentScroller ? parentScroller.scrollTop : null});
}
function openEntryModal(listId, entryId){
  state.modalStack=[{kind:'entry', listId, entryId}];
}
function openArchivedClientModal(listId, clientId){
  const idx = (db.archivedClients||[]).findIndex(x=>x.id===clientId);
  if(idx<0) return;
  const [c] = db.archivedClients.splice(idx,1);
  const l = db.lists.find(x=>x.id===listId);
  l.clients.push(c); // temporary, in-memory only — archivedAt is untouched, so it goes right back on close
  openClientModal(listId, clientId);
}
function closeModalStack(){
  const bottom = state.modalStack[0];
  if(bottom && bottom.kind==='client'){
    const l = db.lists.find(x=>x.id===bottom.listId);
    const c = l && l.clients.find(x=>x.id===bottom.clientId);
    if(c && c.archivedAt){
      l.clients = l.clients.filter(x=>x.id!==c.id);
      db.archivedClients.push(c);
    }
  }
  state.modalStack=[]; state.reopenMapAfterDealClose=null; render();
}
function popModalTo(index){ state.modalStack = state.modalStack.slice(0, index+1); state.reopenMapAfterDealClose=null; render(); }
// Shared by the ✕ button and the Escape key — always steps back exactly ONE level of
// the Client/Deal/Prospect/Entry hierarchy (never collapses the whole stack), and if
// that level has real fields that only save on an explicit button click (Deal Terms,
// Prospect edit), asks first so a Yes/No mis-click or a stray Escape can't be silently lost.
// If this deal was opened by clicking a pin on its Client's map, closing it should return
// to that map rather than just the plain Client page underneath — otherwise you lose your
// place and have to reopen the map and wait for it to re-plot everything again.
function maybeReopenMapAfterDealClose(closingFrame){
  const pending = state.reopenMapAfterDealClose;
  if(pending && closingFrame.kind==='deal' && closingFrame.listId===pending.listId && closingFrame.clientId===pending.clientId){
    state.clientMapModal = {listId: pending.listId, clientId: pending.clientId};
  }
  state.reopenMapAfterDealClose = null;
}
function closeTopModalFrame(){
  if(state.modalStack.length > 1){
    const closingFrame = state.modalStack[state.modalStack.length-1];
    if(closingFrame.kind==='deal' || closingFrame.kind==='lsrProspect'){
      if(confirm('Save your changes before going back?')){
        const saveBtn = document.querySelector(closingFrame.kind==='deal' ? '[data-action="saveDealTerms"]' : '[data-action="lsrSaveProspect"]');
        if(saveBtn) saveBtn.click();
      }
    }
    state.modalStack.pop();
    maybeReopenMapAfterDealClose(closingFrame);
    render();
    if(typeof closingFrame.parentScrollTop==='number'){
      requestAnimationFrame(()=>{
        const scroller = document.querySelector('.modal-body');
        if(scroller) scroller.scrollTop = closingFrame.parentScrollTop;
      });
    }
  } else {
    closeModalStack();
  }
}

function breadcrumbFor(stack){
  const crumbs=[{label:'Home', idx:-1}];
  stack.forEach((frame,i)=>{
    if(frame.kind==='client'){
      const l=db.lists.find(x=>x.id===frame.listId); const c=l.clients.find(x=>x.id===frame.clientId);
      crumbs.push({label:c.name, idx:i});
    } else if(frame.kind==='deal'){
      const l=db.lists.find(x=>x.id===frame.listId); const c=l.clients.find(x=>x.id===frame.clientId);
      const d=c.deals.find(x=>x.id===frame.dealId);
      crumbs.push({label:d.name, idx:i});
    } else if(frame.kind==='entry'){
      const l=db.lists.find(x=>x.id===frame.listId); const e=l.entries.find(x=>x.id===frame.entryId);
      crumbs.push({label:e.name, idx:i});
    } else if(frame.kind==='lsrProspect'){
      const l=db.lists.find(x=>x.id==='listings'); const c=l.clients.find(x=>x.id===frame.clientId);
      const p=c.prospects.find(x=>x.id===frame.prospectId);
      crumbs.push({label:p.tenantName, idx:i});
    }
  });
  return crumbs;
}

function renderModalStack(){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = renderTopModalCard();
  document.getElementById('app').appendChild(overlay);
  overlay.addEventListener('mousedown', (ev)=>{ if(ev.target===overlay) closeModalStack(); });
  attachModalHandlers(overlay);
}
function guessDomain(name){
  const compact = (name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  return compact + '.com';
}
function brandLogoImg(name){
  if(!name) return '';
  return `<img src="https://logo.clearbit.com/${guessDomain(name)}" alt="" style="width:26px;height:26px;border-radius:6px;background:#fff;object-fit:contain;margin-right:9px;flex-shrink:0;" onerror="this.style.display='none'">`;
}
function renderTopModalCard(){
  const frame = state.modalStack[state.modalStack.length-1];
  const crumbs = breadcrumbFor(state.modalStack);
  let bodyHtml='', titleText='', brandName='', dealCanEdit=true, clientCanEdit=true, entryCanEdit=true, clientListId=null;
  if(frame.kind==='client'){
    const l=db.lists.find(x=>x.id===frame.listId); const c=l.clients.find(x=>x.id===frame.clientId);
    clientListId = l.id;
    titleText=c.name; brandName=c.name;
    clientCanEdit = state.currentUser.role==='Admin' || c.createdBy===state.currentUser.id || (c.authorizedUserIds||[]).includes(state.currentUser.id);
    const pendingDel = db.deletionRequests.find(r=>r.clientId===c.id);
    let banner = '';
    if(c.archivedAt) banner = `<div style="background:#FBEBD8;color:#A5620C;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:14px;">🗄️ This is archived — viewing only. Restore it to make it active again.</div>`;
    if(pendingDel){
      const requester = USERS.find(u=>u.id===pendingDel.requestedBy);
      banner += `<div style="background:#FBE0DA;color:#A5300C;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:14px;">🗑️ Deletion requested by ${requester?escapeHtml(requester.name):'an Admin'} — pending approval from the other Admin. Still fully usable until then.</div>`;
    }
    bodyHtml = banner + renderClientModalBody(l,c,frame.viewMode,pendingDel);
  } else if(frame.kind==='deal'){
    const l=db.lists.find(x=>x.id===frame.listId); const c=l.clients.find(x=>x.id===frame.clientId);
    const d=c.deals.find(x=>x.id===frame.dealId);
    titleText=d.name; brandName=c.name;
    bodyHtml = renderDealModalBody(l,c,d);
    dealCanEdit = state.currentUser.role==='Admin' || c.createdBy===state.currentUser.id || (c.authorizedUserIds||[]).includes(state.currentUser.id);
  } else if(frame.kind==='entry'){
    const l=db.lists.find(x=>x.id===frame.listId); const e=l.entries.find(x=>x.id===frame.entryId);
    titleText=e.name; brandName=e.name;
    entryCanEdit = state.currentUser.role==='Admin' || e.ownerId===state.currentUser.id || (e.authorizedUserIds||[]).includes(state.currentUser.id);
    bodyHtml = renderEntryModalBody(l,e);
  } else if(frame.kind==='lsrProspect'){
    const l=db.lists.find(x=>x.id==='listings'); const c=l.clients.find(x=>x.id===frame.clientId);
    const p=c.prospects.find(x=>x.id===frame.prospectId);
    titleText=p.tenantName; brandName=p.tenantName;
    bodyHtml = renderLSRProspectBody(l,c,p);
  }
  return `
  <div class="modal-card wide">
    <div class="modal-head">
      <div style="flex:1;">
        <div class="modal-breadcrumb">
          ${crumbs.map(cr=>`<span data-crumb="${cr.idx}">${escapeHtml(cr.label)}</span>`).join('<span style="opacity:.6;"> / </span>')}
        </div>
        <div class="modal-title-row">${brandLogoImg(brandName)}<div class="modal-title" style="flex:none;">${escapeHtml(titleText)}</div>${frame.kind==='client' && clientCanEdit ? `<button data-action="renameClient" data-listid="${frame.listId}" data-client="${frame.clientId}" title="Rename this ${frame.listId==='listings'?'listing':'client'}" style="background:none;border:none;color:rgba(255,255,255,.75);font-size:15px;margin-left:8px;cursor:pointer;padding:4px;">✏️</button>` : ''}${frame.kind==='deal' && dealCanEdit ? `<button data-action="renameDeal" data-listid="${frame.listId}" data-client="${frame.clientId}" data-deal="${frame.dealId}" title="Rename this deal" style="background:none;border:none;color:rgba(255,255,255,.75);font-size:15px;margin-left:8px;cursor:pointer;padding:4px;">✏️</button>` : ''}${frame.kind==='entry' && entryCanEdit ? `<button data-action="renameEntry" data-listid="${frame.listId}" data-entry="${frame.entryId}" title="Rename this entry" style="background:none;border:none;color:rgba(255,255,255,.75);font-size:15px;margin-left:8px;cursor:pointer;padding:4px;">✏️</button>` : ''}</div>
      </div>
      ${frame.kind==='deal' && dealCanEdit ? `<button class="btn sm" data-action="saveAndCloseDeal" style="background:#fff;color:var(--edge);">Save &amp; Close</button>` : ''}
      ${frame.kind==='client' && clientListId==='clients' ? `<button data-action="openClientMap" style="background:#fff;color:var(--edge);width:auto;min-width:130px;height:auto;padding:8px 14px;white-space:nowrap;font-size:13px;border:none;border-radius:8px;cursor:pointer;">🗺️ Map</button>` : ''}
      <button class="modal-close" data-action="closeModal" style="${(frame.kind==='client' || frame.kind==='entry') ? 'width:auto;min-width:130px;height:auto;padding:8px 14px;white-space:nowrap;font-size:13px;' : ''}">${(frame.kind==='client' || frame.kind==='entry') ? '✓ Save & Close' : '✕ Done'}</button>
    </div>
    <div class="modal-body">${bodyHtml}</div>
  </div>`;
}

// Groups a client's Sites/Deals list into collapsible sub-sections. "Open for Business"
// (d.complete) takes priority over stage — a deal lives in exactly one group.
const DEAL_GROUPS = {
  openForBusiness: {title:'Open for Business', color:'#00A65A', match:d=>!!d.complete},
  signedLease:     {title:'Signed Lease',      color:'#E8951E', match:d=>!d.complete && d.stage==='signedLease'},
  negotiating:     {title:'Negotiating Lease / PSA', color:'#E0469A', match:d=>!d.complete && d.stage==='negotiating'},
  signedLOI:       {title:'Signed LOI',        color:'#00A65A', match:d=>!d.complete && d.stage==='signedLOI'},
  loi:             {title:'LOI',               color:'#00A65A', match:d=>!d.complete && d.stage==='loi'},
  prospects:       {title:'Prospects',         color:'#8A8378', match:d=>!d.complete && (!d.stage || d.stage==='prospect')},
  inEscrow:        {title:'In Escrow',         color:'#E0469A', match:d=>!d.complete && d.stage==='inEscrow'},
  closedEscrow:    {title:'Closed Escrow',     color:'#E8951E', match:d=>!d.complete && d.stage==='closedEscrow'},
  dead:            {title:'Dead',              color:'#8A7D6E', match:d=>!d.complete && d.stage==='dead'},
};
function renderDealGroupsInClient(l,c){
  const rowsByKey = {};
  Object.keys(DEAL_GROUPS).forEach(k=>{ rowsByKey[k] = c.deals.filter(DEAL_GROUPS[k].match); });
  // In Escrow always sits directly below Signed Lease, whether or not anything is
  // currently in that stage — a fixed position, not one that shifts around based on
  // what's in it. Dead stays last — it's a terminal, out-of-the-running state, not
  // part of the normal progression.
  const order = ['signedLease','inEscrow','negotiating','signedLOI','loi','prospects','closedEscrow','openForBusiness','dead'];
  return order.map(k=>renderDealGroupSection(l, c, {key:k, ...DEAL_GROUPS[k]}, rowsByKey[k])).join('');
}
function renderDealGroupSection(l, c, g, rows){
  const key = 'dealgroup_'+c.id+'_'+g.key;
  const collapsed = state.dealGroupCollapsed[key] !== false; // closed by default — has to be explicitly opened once
  let body = '';
  if(!collapsed){
    body = rows.length
      ? rows.map(d=>renderDealRowInClient(l,c,d)).join('')
      : `<div class="empty-state" style="padding:14px;text-align:left;"><div class="tiny" style="color:var(--ink-soft);">Nothing here yet.</div></div>`;
  }
  return `
  <div style="margin-bottom:12px;">
    <button type="button" class="row-card" data-dealgrouptoggle="${key}" style="cursor:pointer;border-left:4px solid ${g.color};width:100%;text-align:left;background:#fff;">
      <div class="row-body">
        <div class="row-title" style="color:${g.color};">${collapsed?'▸':'▾'} ${escapeHtml(g.title)}
          <span style="color:var(--ink-soft);font-weight:400;font-size:12px;">(${rows.length})</span>
        </div>
      </div>
    </button>
    ${body}
  </div>`;
}

  document.getElementById('app').appendChild(overlay);
  overlay.querySelector('[data-action="closeCommission"]').onclick=()=>{ state.commissionModal=null; render(); };
  const commStructureEl = document.getElementById('commStructure');
  if(commStructureEl) commStructureEl.oninput=()=>{ obj.commissionStructure = commStructureEl.value; };
  const commTotalFeeEl = document.getElementById('commTotalFee');
  if(commTotalFeeEl) commTotalFeeEl.oninput=()=>{ obj.totalFee = commTotalFeeEl.value; };
  overlay.querySelector('[data-action="addSplitRow"]').onclick=()=>{
    draft.push({userId: USERS[0].id, pct: ''});
    renderPreservingScroll('.modal-body');
  };
  const addCoBtn = overlay.querySelector('[data-action="addCommissionOnlyPerson"]');
  if(addCoBtn) addCoBtn.onclick=safeHandler(async ()=>{
    const name = prompt("This person's name (they'll never get a login — just a commission split entry):");
    if(!name || !name.trim()) return;
    const person = await supaCreateCommissionOnlyPerson(name.trim());
    if(!person) return;
    draft.push({userId: person.id, pct: ''});
    renderPreservingScroll('.modal-body');
  });
  overlay.querySelectorAll('[data-removesplitrow]').forEach(el=>el.onclick=()=>{
    draft.splice(parseInt(el.dataset.removesplitrow), 1);
    renderPreservingScroll('.modal-body');
  });
  overlay.querySelectorAll('[data-splituser]').forEach(el=>el.onchange=()=>{
    draft[parseInt(el.dataset.splituser)].userId = el.value;
  });
  overlay.querySelectorAll('[data-splitpct]').forEach(el=>el.oninput=()=>{
    draft[parseInt(el.dataset.splitpct)].pct = el.value;
    const newTotal = draft.reduce((s,row)=>s + (parseFloat(row.pct)||0), 0);
    const newTotalOk = Math.abs(newTotal-100) < 0.02;
    const totalLine = document.getElementById('splitsTotalLine');
    if(totalLine){
      totalLine.style.color = newTotalOk ? 'var(--good)' : 'var(--bad)';
      totalLine.textContent = `Total: ${newTotal.toFixed(2)}%${newTotalOk?' ✓':' — must equal 100%'}`;
    }
  });
  overlay.querySelector('[data-action="saveCommission"]').onclick=()=>{
    const currentTotal = draft.reduce((s,row)=>s + (parseFloat(row.pct)||0), 0);
    if(draft.length && Math.abs(currentTotal-100) >= 0.02){
      flashToast(`Splits add up to ${currentTotal.toFixed(2)}%, not 100% — fix the percentages before saving.`);
      renderPreservingScroll('.modal-body');
      return;
    }
    obj.commissionStructure = document.getElementById('commStructure').value.trim();
    obj.totalFee = document.getElementById('commTotalFee').value.trim();
    obj.splits = draft.map(row=>({userId:row.userId, pct:parseFloat(row.pct)||0}));
    obj.commission1Paid = document.getElementById('comm1Paid').checked;
    obj.commission2Paid = document.getElementById('comm2Paid').checked;
    saveFn();
    state.commissionModal=null;
    flashToast('Commission details saved.');
    render();
  };
}

/* Rendered inline inside the Listing's own Client modal — same row-card language,
   breadcrumb drill-down, and modal chrome used everywhere else in the app. */
function lsrEnsureListing(listing){
  if(!listing.prospects) listing.prospects=[];
  if(!listing.categoryConfig) listing.categoryConfig = newLSRCategoryConfig();
}
function lsrMoney(val){
  if(val===undefined||val===null||val==='') return '';
  const s = String(val).trim();
  if(!s) return '';
  return /^[\$]/.test(s) ? s : (/^[0-9.]+$/.test(s) ? '$'+s : s);
}
function lsrFilterRows(rows){
  let out = rows;
  const q = (state.lsrSearch||'').toLowerCase().trim();
  if(q){
    out = out.filter(p=>{
      const contact = p.contactId ? db.contacts.find(c=>c.id===p.contactId) : null;
      const hay = `${p.tenantName} ${p.notes||''} ${contact? contact.first+' '+contact.last:''}`.toLowerCase();
      return hay.includes(q);
    });
  }
  if(state.lsrTrackerFilter && state.lsrTrackerFilter!=='all'){
    out = out.filter(p=>p.edgeTracker===state.lsrTrackerFilter);
  }
  return out;
}
function lsrSortRows(rows){
  return rows.slice().sort((a,b)=>{
    if(!a.dueDateSortHelperUnused){} // no-op, keeps structure simple
    const ad = a.dateOfContact||a.deadDate, bd = b.dateOfContact||b.deadDate;
    const at = ad? ad.getTime():0, bt = bd? bd.getTime():0;
    return bt-at; // most recent activity first
  });
}
function renderLSRInline(listing, mode){

  } else if(mode==='deals'){

  let html = `

      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:16px;">Prepared ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
    </div>`;

    html += renderLSRSectionInline({key:'dead', title:'Dead Deals', color:'#8A8378', rows:deadRows, listing, kind:'dead'});
    html += renderLSRSectionInline({key:'notInterested', title:'Prospects - Not Interested', color:'#B9B4AD', rows:niRows, listing, kind:'dead'});
  }
  let tradeAreaHtml = '';
  if(showCategories){
    const tradeAreaRows = lsrSortRows(visible.filter(p=>p.inTradeArea && (p.stage==='contacted'||p.stage==='interested')));
    tradeAreaHtml = `<div class="no-print">${renderLSRSectionInline({key:'tradeArea', title:'Trade Area Tenants', color:'#B08B3F', rows:tradeAreaRows, listing, kind:'prospect', categoryId:null})}</div>`;

  return `${toolbarHtml}<div id="lsrPrintArea">${html}</div>${tradeAreaHtml}`;

async function convertSignCallToProspect(sc){

  if(!listing){ flashToast("Couldn't find that listing."); return; }
  const prospect = {id:crypto.randomUUID(), tenantName: sc.name||'New Prospect', stage:'contacted', dealType:null,
    contactId: sc.contactId||null, dateOfContact: todayDate(),
    notes: sc.phone ? `Phone: ${sc.phone}${sc.notes?`\n\n${sc.notes}`:''}` : (sc.notes||''),
    edgeTracker:null, attachments:[], commission1Paid:false, commission2Paid:false};
  listing.prospects = listing.prospects || [];
  listing.prospects.push(prospect);
  await supaCreateProspect(prospect, listing.id);
  sc.convertedToProspectId = prospect.id;
  await supaUpdateSignCall(sc);
  state.signCallModal=null;

function renderLSRSectionInline(opts){
  const collapsed = state.lsrCollapsed[opts.key] !== false; // closed by default — has to be explicitly opened once
  let body = '';
  if(!collapsed){
    if(!opts.rows.length){
      body = `<div class="empty-state" style="padding:14px;text-align:left;"><div class="tiny" style="color:var(--ink-soft);">Nothing here yet.</div></div>`;
    } else {
      body = opts.rows.map(p=>renderLSRRowCard(p, opts.listing, opts.kind)).join('');
    }
    if(opts.kind==='prospect' && opts.categoryId){
      body += `<button class="btn ghost sm" data-action="lsrAddProspect" data-category="${opts.categoryId}" data-client="${opts.listing.id}" style="margin-top:4px;">+ Add tenant</button>`;
    }
  }
  return `
  <div style="margin-bottom:16px;">
    <button class="row-card" data-lsrtoggle="${opts.key}" style="cursor:pointer;border-left:4px solid ${opts.color};width:100%;text-align:left;background:#fff;">
      <div class="row-body">
        <div class="row-title" style="color:${opts.color};">${collapsed?'▸':'▾'} ${escapeHtml(opts.title)}
          <span style="color:var(--ink-soft);font-weight:400;font-size:12px;">(${opts.rows.length})</span>
        </div>
      </div>
    </button>
    ${body}
  </div>`;
}
function renderLSRRowCard(p, listing, kind){
  const cat = DEFAULT_PROPERTY_CATEGORIES.concat(listing.categoryConfig.custom).find(c=>c.id===p.categoryId);
  const contact = p.contactId ? db.contacts.find(x=>x.id===p.contactId) : null;
  const tracker = USERS.find(u=>u.id===p.edgeTracker);
  let meta = [];
  if(cat) meta.push(`<span class="pill">${escapeHtml(cat.name)}</span>`);
  if(kind==='deal'){
    const moneyLabel = p.dealType==='sale'?'Price':'Rent';
    const money = lsrMoney(p.dealType==='sale'?p.price:p.rent);
    if(p.building) meta.push(`<span>${escapeHtml(p.building)}${p.spaceNum?' #'+escapeHtml(p.spaceNum):''}</span>`);
    if(p.size) meta.push(`<span>${escapeHtml(p.size)}</span>`);
    if(money) meta.push(`<span>${moneyLabel}: ${escapeHtml(money)}</span>`);
    if(p.term) meta.push(`<span>${escapeHtml(p.term)}</span>`);
  } else if(kind==='dead'){
    if(p.deadDate) meta.push(`<span class="due overdue">Marked ${fmtDate(p.deadDate)}</span>`);
  } else {
    if(p.dateOfContact) meta.push(`<span>Contacted ${fmtDate(p.dateOfContact)}</span>`);
  }
  if(tracker) meta.push(`<span class="pill gray">${escapeHtml(tracker.name)}</span>`);
  return `
  <div class="row-card" data-lsropen="${p.id}" data-client="${listing.id}" style="flex-wrap:wrap;">
    <div class="nav-icon" style="font-size:18px;">${kind==='dead'?'⚫':(kind==='deal'?'⭐':'🎯')}</div>
    <div class="row-body" style="min-width:220px;">
      <div class="row-title">${escapeHtml(p.tenantName)}</div>
      <div class="row-meta">${meta.join('')}</div>
      ${p.notes? `<div class="row-meta" style="color:var(--ink-soft);">${escapeHtml(p.notes)}</div>`:''}
    </div>
    ${contact ? `
    <div class="row-contact" style="flex-shrink:0;">
      ${contact.email? `<a class="contact-link" href="mailto:${contact.email}" data-stopprop="1">✉️ ${escapeHtml(contact.email)}</a>`:''}
      ${contact.mobile? `<a class="contact-link" href="${telHref(contact.mobile)}" data-stopprop="1">📱 ${escapeHtml(contact.mobile)}</a>`:''}
    </div>` : ''}
    ${kind==='prospect' ? `<button class="btn" data-lsrconvert="${p.id}" data-client="${listing.id}" data-stopprop="1" style="flex-shrink:0;margin-left:auto;">Convert to Deal →</button>` : ''}
    ${kind==='deal' && p.dealType==='lease' ? `
    <div style="width:100%;display:flex;align-items:center;gap:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);" data-stopprop="1">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);" ${brokerReviewApproved('prospects',p.id,'lease')?'':'title="Cannot mark paid until the Designated Broker has approved this deal"'}>
        <input type="checkbox" data-lsrcomm1="${p.id}" data-client="${listing.id}" ${p.commission1Paid?'checked':''} ${brokerReviewApproved('prospects',p.id,'lease')?'':'disabled'} style="width:auto;accent-color:var(--good);"> 1st Half Commission Paid
      </label>
      <button class="btn ${p.commission2Paid?'secondary':''} sm" data-lsrcomm2="${p.id}" data-client="${listing.id}" ${brokerReviewApproved('prospects',p.id,'lease')?'':'disabled title="Cannot mark paid until the Designated Broker has approved this deal"'}>
        ${p.commission2Paid? '✓ 2nd Half Paid':'2nd Half Commission Paid'}
      </button>
      ${!lsrDealIsActive(p) ? `<span class="pill gray">Fully Closed</span>`:''}
    </div>`:''}
  </div>`;
}

/* ---- Category manager (small floating modal) ---- */
function renderLSRCategoryManagerModal(){
  const clientId = state.lsrCategoryManagerOpen;
  const listing = db.lists.find(x=>x.id==='listings').clients.find(c=>c.id===clientId);
  lsrEnsureListing(listing);
  const cfg = listing.categoryConfig;
  const all = DEFAULT_PROPERTY_CATEGORIES.concat(cfg.custom);
  const ordered = cfg.order.map(id=>all.find(c=>c.id===id)).filter(Boolean);
  all.forEach(c=>{ if(!cfg.order.includes(c.id)) ordered.push(c); });
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.style.zIndex=270;
  overlay.innerHTML = `
  <div class="modal-card">
    <div class="modal-head"><div class="modal-title">Manage Categories — ${escapeHtml(listing.name)}</div><button class="modal-close" data-action="lsrCloseCatMgr">✕</button></div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--ink-soft);margin-top:0;">Hide categories this property doesn't need, reorder them, or add your own. This only affects this listing.</p>
      ${ordered.map((c,i)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);">
          <span style="flex:1;font-size:13px;${cfg.hidden.includes(c.id)?'color:var(--ink-soft);text-decoration:line-through;':''}">${escapeHtml(c.name)}</span>
          <button class="btn secondary sm" data-catmove="up:${c.id}" ${i===0?'disabled':''}>↑</button>
          <button class="btn secondary sm" data-catmove="down:${c.id}" ${i===ordered.length-1?'disabled':''}>↓</button>
          <button class="btn secondary sm" data-cattogglehide="${c.id}">${cfg.hidden.includes(c.id)?'Show':'Hide'}</button>
        </div>`).join('')}
      <div class="field" style="margin-top:14px;">
        <label>Add a new category</label>
        <div style="display:flex;gap:8px;">
          <input id="newCatName" placeholder="e.g., Barbecue" style="flex:1;">
          <button class="btn sm" data-action="lsrAddCategory">Add</button>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn secondary" data-action="lsrCloseCatMgr">Close</button></div>
  </div>`;
  document.getElementById('app').appendChild(overlay);
  overlay.querySelectorAll('[data-action="lsrCloseCatMgr"]').forEach(b=>b.onclick=()=>{ state.lsrCategoryManagerOpen=null; render(); });
  overlay.querySelectorAll('[data-catmove]').forEach(el=>el.onclick=()=>{
    const [dir,id] = el.dataset.catmove.split(':');
    if(!cfg.order.includes(id)) cfg.order = ordered.map(c=>c.id);
    const idx = cfg.order.indexOf(id);
    const swap = dir==='up'? idx-1 : idx+1;
    if(swap<0||swap>=cfg.order.length) return;
    const tmp=cfg.order[idx]; cfg.order[idx]=cfg.order[swap]; cfg.order[swap]=tmp;
    supaSaveListingCategorySettings(listing.id, cfg);
    renderPreservingScroll('.modal-body');
  });
  overlay.querySelectorAll('[data-cattogglehide]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.cattogglehide;
    if(cfg.hidden.includes(id)) cfg.hidden = cfg.hidden.filter(x=>x!==id);
    else cfg.hidden.push(id);
    supaSaveListingCategorySettings(listing.id, cfg);
    renderPreservingScroll('.modal-body');
  });
  overlay.querySelector('[data-action="lsrAddCategory"]').onclick=()=>{

function wireCategoryCreateOption(selectEl, listing){
  if(!selectEl) return;
  lsrEnsureListing(listing);
  let lastValue = selectEl.value;
  selectEl.addEventListener('change', ()=>{
    if(selectEl.value==='__new__'){
      const name = prompt('Name the new category (e.g., "Barbecue"):');
      if(!name){ selectEl.value = lastValue; return; }
      const id = 'custom'+uid();
      listing.categoryConfig.custom.push({id, name});
      listing.categoryConfig.order.push(id);
      supaCreateCategory(id, name, listing.id);
      supaSaveListingCategorySettings(listing.id, listing.categoryConfig);
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = name;
      const newCatOption = Array.from(selectEl.options).find(o=>o.value==='__new__');
      selectEl.insertBefore(opt, newCatOption);
      selectEl.value = id;
      lastValue = id;
      flashToast(`"${name}" category added.`);
    } else {
      lastValue = selectEl.value;
    }
  });
}

function notifyNewLSRTracker(newTrackerId, p, listing){
  if(newTrackerId===state.currentUser.id) return;
  const u = USERS.find(x=>x.id===newTrackerId);
  if(!u) return;
  // A real to-do, assigned to them and marked "new" — reuses the existing float-to-top +
  // email mechanism to-do's already use, rather than inventing a second notification system.
  const newTodo = {
    id:crypto.randomUUID(), title:`Review lead: ${p.tenantName} (${listing.name})`, category:listing.name,
    dueDate: addDays(todayDate(),1), assignedTo:newTrackerId, createdBy:state.currentUser.id,
    type:'task', private:false, completed:false, isNew:true,
    notes:`You're now the Edge Tracker for ${p.tenantName} at ${listing.name}.`,
    listId:'listings', clientId:listing.id, dealId:null, entryId:null, attachments:[]
  };
  db.todos.push(newTodo);
  supaCreateTodo(newTodo);
  flashToast(`${u.name} is now the Edge Tracker — a new to-do is waiting for them.`);
}

function convertEntryToDeal(listId, entryId){
  const flatList = db.lists.find(x=>x.id===listId);
  const entry = flatList.entries.find(x=>x.id===entryId);
  let clientsList = db.lists.find(x=>x.id==='clients');
  const newClient = {id:crypto.randomUUID(), name:entry.name, primary:entry.contactId||null, secondContactId:null, thirdContactId:null, deals:[], createdBy:state.currentUser.id, authorizedUserIds:[]};
  clientsList.clients.push(newClient);
  supaCreateClient(newClient, 'clients');
  // move todos
  db.todos.forEach(t=>{ if(t.entryId===entryId){ t.entryId=null; t.clientId=newClient.id; t.listId='clients'; supaUpdateTodo(t); } });
  flatList.entries = flatList.entries.filter(x=>x.id!==entryId);
  supaDeleteEntry(entryId);
  state.modalStack=[];
  flashToast(`${entry.name} converted to a Client. Add sites to start tracking deals.`);
  state.addUsersPrompt = {listId:'clients', clientId:newClient.id};
}

function searchBrokerCandidates(q){
  if(!q) return [];
  const phoenixMatches = PHOENIX_BROKER_LIST.filter(b=>b.name.toLowerCase().includes(q) || (b.company||'').toLowerCase().includes(q));
  const myContactMatches = db.contacts
    .filter(c=>c.createdBy===state.currentUser.authId)
    .filter(c=>{
      const name = `${c.first||''} ${c.last||''}`.trim().toLowerCase();
      return name.includes(q) || (c.company||'').toLowerCase().includes(q);
    })
    .map(c=>({id:c.id, name:`${c.first||''} ${c.last||''}`.trim(), company:c.company, mobile:c.mobile, phone:c.phone, isMyContact:true}));
  return [...phoenixMatches, ...myContactMatches];
}

  document.getElementById('app').appendChild(overlay);
  document.getElementById('dupUpdate').onclick=()=>{

  };
  document.getElementById('dupCreateNew').onclick=async ()=>{

function finishContactPick(contactId){
  state.duplicatePrompt=null;
  const scroller = document.querySelector('.modal-body');
  const savedScrollTop = scroller ? scroller.scrollTop : null;
  if(state.contactPickerOpen && state.contactPickerOpen.lsrProspectId){
    const {lsrClientId, lsrProspectId} = state.contactPickerOpen;
    const listing = db.lists.find(x=>x.id==='listings').clients.find(c=>c.id===lsrClientId);
    const p = listing.prospects.find(x=>x.id===lsrProspectId);
    p.contactId = contactId;
    supaUpdateProspect(p, listing.id);
  } else if(state.contactPickerOpen && state.contactPickerOpen.dealId){
    // Must be checked before the generic clientId branch below — a deal-contact
    // pick carries clientId too (with no slot for the client-contact case), so it
    // would otherwise fall through and silently overwrite the client's own secondary
    // contacts instead of the deal's.
    const {listId, clientId, dealId, slot} = state.contactPickerOpen;
    const l = db.lists.find(x=>x.id===listId);
    const client = l.clients.find(c=>c.id===clientId);
    const d = client.deals.find(x=>x.id===dealId);
    if(slot==='second') d.secondContactId = contactId;
    else if(slot==='third') d.thirdContactId = contactId;
    else d.contactId = contactId; // 'primary' or unset — Primary Site Contact
    supaUpdateDeal(d, client.id);
  } else if(state.contactPickerOpen && state.contactPickerOpen.clientId){
    const {clientId, slot} = state.contactPickerOpen;
    const clientsList = db.lists.find(l=>l.type==='deep' && l.clients.some(c=>c.id===clientId));
    const client = clientsList.clients.find(c=>c.id===clientId);
    if(slot==='primary'){
      client.primary=contactId;
      supaUpdateClientContact(client, clientsList.id);
    } else if(slot==='second' || slot==='third'){
      if(slot==='second') client.secondContactId=contactId; else client.thirdContactId=contactId;
      supabaseClient.from('client_secondary_contacts').delete().eq('client_id', client.id).eq('slot', slot)
        .then(()=>supabaseClient.from('client_secondary_contacts').insert({client_id:client.id, contact_id:contactId, slot}))
        .then(({error})=>{ if(error) console.error('secondary contact sync error:', error); });
    }
  } else if(state.contactPickerOpen && state.contactPickerOpen.entryId){
    const {listId, entryId} = state.contactPickerOpen;
    const l = db.lists.find(x=>x.id===listId);
    const entry = l.entries.find(x=>x.id===entryId);
    entry.contactId = contactId;
    supaUpdateEntry(entry, l.id);
  } else if(state.contactPickerOpen && state.contactPickerOpen.standalone){
    flashToast('Contact created.');
  }
  state.contactPickerOpen=null;
  render();
  if(savedScrollTop!==null){
    requestAnimationFrame(()=>{
      const newScroller = document.querySelector('.modal-body');
      if(newScroller) newScroller.scrollTop = savedScrollTop;
    });
  }
}

function wireAttachmentZone(overlay, zoneId, inputId, getAttachments, target){
  const zone = overlay.querySelector('#'+zoneId);
  const input = overlay.querySelector('#'+inputId);
  if(!zone || !input) return;
  input.onchange = ()=>{ getAttachments().push(...filesToAttachments(input.files)); renderPreservingScroll('.modal-body'); };
  zone.ondragover = (ev)=>{ ev.preventDefault(); zone.style.borderColor='var(--edge)'; };
  zone.ondragleave = ()=>{ zone.style.borderColor='var(--line)'; };
  zone.ondrop = (ev)=>{
    ev.preventDefault(); zone.style.borderColor='var(--line)';
    if(ev.dataTransfer.files.length) getAttachments().push(...filesToAttachments(ev.dataTransfer.files));
    renderPreservingScroll('.modal-body');
  };
  overlay.querySelectorAll(`[data-removeattachfor="${target}"]`).forEach(b=>b.onclick=()=>{
    getAttachments().splice(parseInt(b.dataset.removeattach),1); renderPreservingScroll('.modal-body');
  });
}

  const ntCategoryLiveEl = document.getElementById('ntCategory'); if(ntCategoryLiveEl) ntCategoryLiveEl.oninput=()=>{ m.category = ntCategoryLiveEl.value; };

    if(assignTo!==state.currentUser.id && targetClientId && !userHasClientAccess(assignTo, targetClientId)){

      const ok = confirm(`${u.name} doesn't have access to this client yet, so they'll only be able to see this specific to-do — not the rest of the client's deals or info. Assign it to them anyway?`);
      if(!ok) return;
    }
    const newTd = {
      id:crypto.randomUUID(), title, category, status, dueDate: parseNaturalDate(dueStr), assignedTo:assignTo, createdBy:state.currentUser.id,
      type:m.type, private:priv, completed:false, notes, isNew:false, attachments: m.attachments,
      checklistItems: m.checklistItems || [],
      listId: ctx.listId||null, clientId: ctx.clientId||null, dealId: ctx.dealId||null, entryId: ctx.entryId||null, projectId: ctx.projectId||null
    };
    db.todos.push(newTd);

    }
    render();
  };
}

// Splits the search text into individual words and requires every one of them to
// appear somewhere in the contact's info — not as one continuous phrase. This means
// "Smith John" and "John Smith" both match the same person, commas don't matter, and
// each additional word typed only ever narrows the results further, never changes
// the matching logic.
function matchesSearchTokens(hayString, query){
  const tokens = query.toLowerCase().replace(/,/g, ' ').split(/\s+/).filter(Boolean);
  if(!tokens.length) return true;
  const hay = hayString.toLowerCase();
  return tokens.every(t => hay.includes(t));
}

function findContactMatch(row){
  const firstL = (row.first||'').toLowerCase().trim(), lastL = (row.last||'').toLowerCase().trim();
  return db.contacts.find(c=>
    (firstL && lastL && c.first.toLowerCase().trim()===firstL && c.last.toLowerCase().trim()===lastL) ||
    (row.email && c.email && c.email.toLowerCase().trim()===row.email.toLowerCase().trim()) ||
    (row.mobile && c.mobile && c.mobile.trim()===row.mobile.trim()) ||
    (row.phone && c.phone && c.phone.trim()===row.phone.trim())
  );
}

  {key:'first', label:'First Name'}, {key:'last', label:'Last Name'}, {key:'company', label:'Company'},
  {key:'website', label:'Website'}, {key:'email', label:'Email'}, {key:'mobile', label:'Mobile'},

function importCSV(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const text = e.target.result;
    const rows = parseCSV(text);
    if(!rows.length){ flashToast('No rows found in that file.'); return; }
    const header = rows[0].map(h=>h.trim());
    const idx = (name)=>header.indexOf(name);
    const iFirst=idx('First Name'), iLast=idx('Last Name'), iCompany=idx('Company'), iWebsite=idx('Website'),
          iEmail=idx('E-mail Address'), iMobile=idx('Mobile Phone'), iPhone=idx('Business Phone'),
          iAddress=idx('Business Street'), iCity=idx('Business City'), iState=idx('Business State'), iZip=idx('Business Postal Code');
    const uniqueRows = [];
    const queue = []; // {row, match}
    for(let r=1;r<rows.length;r++){
      const row=rows[r]; if(!row || row.length<2) continue;
      const first=(row[iFirst]||'').trim(), last=(row[iLast]||'').trim();
      if(!first && !last) continue;
      const parsed = {
        first, last, company:(row[iCompany]||'').trim(), website:(row[iWebsite]||'').trim(),
        email:(row[iEmail]||'').trim(), mobile:(row[iMobile]||'').trim(), phone:(row[iPhone]||'').trim(),
        address:(row[iAddress]||'').trim(), city:(row[iCity]||'').trim(), state:(row[iState]||'').trim(), zip:(row[iZip]||'').trim(),
      };
      const match = findContactMatch(parsed);
      if(match) queue.push({row:parsed, match});
      else uniqueRows.push(parsed);
    }
    if(!queue.length){
      commitContactImport(uniqueRows, []);
      return;
    }
    state.contactImportReview = {uniqueRows, queue, index:0, decisions:[], fieldChoices: buildDefaultFieldChoices(queue[0])};
    render();
  };
  reader.readAsText(file);
}
function buildDefaultFieldChoices(pair){
  // Sensible starting point per field — not a stance on Skip/Merge/Delete overall,
  // just saves a click when one side is obviously blank and the other isn't.
  const choices = {};
  CONTACT_FIELDS.forEach(f=>{
    const existingVal = pair.match[f.key]||'';
    const newVal = pair.row[f.key]||'';
    choices[f.key] = (!existingVal && newVal) ? 'new' : 'existing';
  });
  return choices;
}
async function commitContactImport(uniqueRows, decisions){
  // decisions: [{type:'merge'|'delete', match, row, fieldChoices}]
  const newContacts = uniqueRows.map(row=>({id:crypto.randomUUID(), ...row}));
  db.contacts.push(...newContacts);
  for(const d of decisions){
    if(d.type==='merge'){
      CONTACT_FIELDS.forEach(f=>{ d.match[f.key] = d.fieldChoices[f.key]==='new' ? (d.row[f.key]||'') : d.match[f.key]; });
      supaUpdateContact(d.match);
    } else if(d.type==='delete'){
      db.contacts = db.contacts.filter(c=>c.id!==d.match.id);
      supaDeleteContact(d.match.id);
      const replacement = {id:crypto.randomUUID(), ...d.row};
      db.contacts.push(replacement);
      newContacts.push(replacement);
    }
  }
  const mergedCount = decisions.filter(d=>d.type==='merge').length;
  const deletedCount = decisions.filter(d=>d.type==='delete').length;
  const skippedCount = decisions.filter(d=>d.type==='skip').length;
  flashToast(`Imported ${newContacts.length} new · ${mergedCount} merged · ${deletedCount} replaced · ${skippedCount} skipped.`);
  render();
  if(newContacts.length){
    const { error } = await supabaseClient.from('contacts').insert(newContacts.map(contactLocalToRow));
    if(error){ console.error('CSV bulk sync error:', error); flashToast('Imported here, but syncing some to the server failed. (' + error.message + ')'); render(); }
  }
}

const TF_NULL_DATE_MARKER = 'Fri Dec 13 1901';
function tfCleanDate(raw){
  if(!raw) return null;
  if(raw === '0') return null;
  if(raw.startsWith(TF_NULL_DATE_MARKER)) return null; // TaskFire's own placeholder for "no date"
  const d = new Date(raw);
  if(isNaN(d.getTime())) return null;
  return d;
}
function parseTaskFireCSV(text){
  const rows = parseCSV(text);
  const header = rows[0].map(h=>h.trim());
  const idxType = header.indexOf('Task Type');
  const idxName = header.indexOf('Name');
  const idxNote = header.indexOf('Note');
  const idxDue = header.indexOf('Due Date');

  const clientsList = db.lists.find(l=>l.id==='clients');
  const listingsList = db.lists.find(l=>l.id==='listings');
  const existingInClients = new Map(clientsList.clients.map(c=>[c.name.toLowerCase().trim(), c.id]));
  const existingInListings = new Map(listingsList.clients.map(c=>[c.name.toLowerCase().trim(), c.id]));

  const clients = []; // {name, destListId, existingId, deals:[{name,due,todos}], directTodos:[{name,due}]}
  const ambiguousBatches = []; // {projectNames, deals:[{name,todos}]}
  const taskRows = []; // {name}
  let currentClient = null;
  let currentDeal = null;
  let projectsSincePin = []; // names of Projects seen since the last successfully-resolved deal
  let openAmbiguousBatch = null;

  function closeAmbiguousBatch(){
    if(openAmbiguousBatch && openAmbiguousBatch.deals.length) ambiguousBatches.push(openAmbiguousBatch);
    openAmbiguousBatch = null;
  }

  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || !row[idxType]) continue;
    const type = row[idxType].trim();
    const name = (row[idxName]||'').trim();
    if(type==='Task'){ if(name) taskRows.push({name, note:(row[idxNote]||'').trim()}); continue; }
    if(!name) continue;

    if(type==='Project'){
      closeAmbiguousBatch();
      const key = name.toLowerCase().trim();
      const existingClientMatch = existingInClients.get(key) || null;
      const existingListingMatch = existingInListings.get(key) || null;
      // Default every item to Client — if it happens to already exist as a
      // Listing instead, default to that so the smart guess matches what's
      // already there. Either way, it's just a starting point the Admin can
      // flip per-item before confirming, and the merge-target updates
      // automatically to match whichever type is selected.
      const destListId = (!existingClientMatch && existingListingMatch) ? 'listings' : 'clients';
      currentClient = {name, destListId, existingClientMatch, existingListingMatch, deals:[], directTodos:[]};
      clients.push(currentClient);
      projectsSincePin.push(name);
      currentDeal = null;
    } else if(type==='Checklist' || type==='Subtask'){
      const deal = {name, due: tfCleanDate(row[idxDue]), todos:[]};
      currentDeal = deal;
      if(projectsSincePin.length <= 1){
        if(currentClient) currentClient.deals.push(deal);
      } else {
        if(!openAmbiguousBatch) openAmbiguousBatch = {projectNames:[...projectsSincePin], deals:[]};
        openAmbiguousBatch.deals.push(deal);
      }
      projectsSincePin = []; // reset either way — resolved or flagged, this round is done
    } else if(type==='Checklist item'){
      const todo = {name, due: tfCleanDate(row[idxDue])};
      if(currentDeal) currentDeal.todos.push(todo);
      else if(currentClient) currentClient.directTodos.push(todo);
    }
  }
  closeAmbiguousBatch();
  return {clients, ambiguousBatches, taskRows};
}

function tfExistingId(c){ if(c.destListId==='skip') return null; return c.destListId==='listings' ? c.existingListingMatch : c.existingClientMatch; }

async function runTaskFireImport(parsed, ownerUserId){
  async function makeFloatingTodo(title, category, notes){
    const todoObj = {id:crypto.randomUUID(), title, category, dueDate:null, assignedTo:ownerUserId,
      createdBy:ownerUserId, type:'task', private:false, completed:false, isNew:false, notes:notes||'',
      listId:null, clientId:null, dealId:null, entryId:null, attachments:[]};
    db.todos.push(todoObj);
    await supaCreateTodo(todoObj);
  }
  for(const c of parsed.clients){
    if(c.destListId==='skip'){
      // Not a real Client/Listing (e.g. "Alabama" — a category, not a company) — still
      // wanted, just as a plain standalone To-Do rather than forcing a Client record
      // that doesn't really represent anything. Same for whatever was nested under it.
      await makeFloatingTodo(c.name, 'From TaskFire');
      for(const d of c.deals){
        const noteText = d.todos.map(t=>t.name).join('; ');
        await makeFloatingTodo(d.name, c.name, noteText);
      }
      for(const t of c.directTodos){
        await makeFloatingTodo(t.name, c.name);
      }
      continue;
    }
    const destListId = c.destListId || 'clients';
    const targetList = db.lists.find(l=>l.id===destListId);
    const existingId = tfExistingId(c);
    let clientObj;
    if(existingId){
      clientObj = targetList.clients.find(x=>x.id===existingId);
    } else {
      clientObj = {id:crypto.randomUUID(), name:c.name, primary:null, secondContactId:null, thirdContactId:null, deals:[], createdBy:ownerUserId, authorizedUserIds:[]};
      if(destListId==='listings'){ clientObj.prospects=[]; clientObj.categoryConfig=newLSRCategoryConfig(); }
      targetList.clients.push(clientObj);
      await supaCreateClient(clientObj, destListId);
    }
    for(const d of c.deals){
      const dealObj = {id:crypto.randomUUID(), name:d.name, complete:false, activeDeal:false, caExecuted:false, dueDate:d.due||null};
      clientObj.deals.push(dealObj);

      for(const t of d.todos){
        const todoObj = {id:crypto.randomUUID(), title:t.name, category:clientObj.name, dueDate:t.due||null, assignedTo:ownerUserId,
          createdBy:ownerUserId, type:'task', private:false, completed:false, isNew:false, notes:'',
          listId:destListId, clientId:clientObj.id, dealId:dealObj.id, entryId:null, attachments:[]};
        db.todos.push(todoObj);
        await supaCreateTodo(todoObj);
      }
    }
    for(const t of c.directTodos){
      const todoObj = {id:crypto.randomUUID(), title:t.name, category:clientObj.name, dueDate:t.due||null, assignedTo:ownerUserId,
        createdBy:ownerUserId, type:'task', private:false, completed:false, isNew:false, notes:'',
        listId:destListId, clientId:clientObj.id, dealId:null, entryId:null, attachments:[]};
      db.todos.push(todoObj);
      await supaCreateTodo(todoObj);
    }
  }
  // Standalone "Task" rows — these were already shown for review before the import
  // ran. They're intentionally NOT written anywhere: personal notes are locked to
  // the owner's own login now (by design, per the privacy fix), so an Admin
  // importing on someone else's behalf genuinely can't write into their private
  // notes even if we wanted to — that's not a bug, it's the privacy rule working
  // as intended. The account owner can add anything worth keeping themselves.
}

/* ---------------- IMPORT FROM MYMAPS (KML/KMZ) ----------------
   Google MyMaps exports one file per client — each pin is a site/deal, grouped
   into folders (layers) that usually correspond to how far along a deal is.
   This walks an admin through: pick which client the sites belong to, decide
   what each MyMaps folder should become in the Portal (a fixed stage, an
   auto-detected stage, hand-picked individually, or skipped entirely), then
   commits the resulting Deals for real. */
const MAPS_STAGE_OPTIONS = [
  {id:'skip', label:'Skip this folder — don\'t import'},
  {id:'loi', label:'→ LOI'},
  {id:'signedLOI', label:'→ Signed LOI'},
  {id:'negotiating', label:'→ Negotiating Lease / PSA'},
  {id:'signedLease', label:'→ Signed Lease'},
  {id:'auto', label:'→ Auto: store number (AZ####) = Signed LOI, else LOI'},
  {id:'manual', label:'→ No stage yet — let me pick individually which sites import'},
];
function mapsNormalizeStoreNumber(name){
  // "AZ 0808 -Twin Peaks..." -> "AZ0808 -Twin Peaks..." — store numbers should read
  // consistently with no space, regardless of how the pin was typed in MyMaps.
  return name.replace(/^(AZ)\s+(\d{3,4})/i, '$1$2');
}
function mapsHasStoreNumber(name){
  return /^AZ\s?\d{3,4}\b/i.test(name.trim());
}
/* ==================== MYMAPS IMPORT (rebuilt from scratch) ==================== */
async function mapsReadKmlText(file){
  if(!/\.kmz$/i.test(file.name)) return await file.text();
  const zip = await JSZip.loadAsync(file);
  let entry = zip.file('doc.kml');
  if(!entry){
    const kmlPath = Object.keys(zip.files).find(p=>/\.kml$/i.test(p));
    if(kmlPath) entry = zip.file(kmlPath);
  }
  if(!entry) throw new Error("Couldn't find a .kml file inside that .kmz — is this really a MyMaps export?");
  return await entry.async('text');
}
function mapsParseFolders(kmlText){
  const xml = new DOMParser().parseFromString(kmlText, 'text/xml');
  if(xml.querySelector('parsererror')) throw new Error("That file doesn't look like valid KML.");
  // getElementsByTagName instead of querySelectorAll('Folder') on purpose — KML
  // files almost always declare a default XML namespace, and querySelectorAll with
  // a plain tag name can silently match nothing at all against namespaced XML,
  // depending on the browser. getElementsByTagName matches by local name regardless
  // of namespace, which is what actually needs to happen here.
  const directChildByTag = (parent, tag) => {
    for(const child of parent.children){ if(child.tagName===tag || child.localName===tag) return child; }
    return null;
  };
  const directChildrenByTag = (parent, tag) => {
    const out = [];
    for(const child of parent.children){ if(child.tagName===tag || child.localName===tag) out.push(child); }
    return out;
  };
  const extractPlacemarks = (parent) => directChildrenByTag(parent, 'Placemark')
    .filter(p=>p.getElementsByTagName('Point').length > 0)
    .map(p=>{
      const n = directChildByTag(p, 'name');
      return {name: n ? n.textContent.trim() : '(unnamed site)'};
    });

  const folderEls = [...xml.getElementsByTagName('Folder')];
  let results = folderEls.map(folderEl=>{
    const nameEl = directChildByTag(folderEl, 'name');
    const name = nameEl ? nameEl.textContent.trim() : '(unnamed folder)';
    return {name, placemarks: extractPlacemarks(folderEl)};
  }).filter(f=>f.placemarks.length);

  // Google MyMaps skips the Folder wrapper entirely for a map with only one
  // layer — its Placemarks sit directly under Document instead. If there were
  // no Folders at all (or none with any real sites in them), check Document
  // itself for Placemarks before giving up.
  if(!results.length){
    const docEl = xml.getElementsByTagName('Document')[0];
    if(docEl){
      const directPlacemarks = extractPlacemarks(docEl);
      if(directPlacemarks.length){
        const docNameEl = directChildByTag(docEl, 'name');
        const docName = docNameEl ? docNameEl.textContent.trim() : '(unnamed map)';
        results = [{name: docName, placemarks: directPlacemarks}];
      }
    }
  }
  return results;
}
function mapsAllClientsFlat(){
  const out = [];
  db.lists.filter(l=>l.type==='deep').forEach(l=>{
    l.clients.forEach(c=>out.push({id:c.id, name:c.name, listId:l.id, listName:l.name}));
  });
  return out;
}
function mapsComputeResultDeals(m){
  const results = [];
  m.folders.forEach((f,i)=>{
    const stageChoice = m.folderStage[i];
    if(stageChoice==='skip') return;
    f.placemarks.forEach((p,pIdx)=>{
      if(stageChoice==='manual' && !(m.manualPicks[i] && m.manualPicks[i][pIdx])) return;
      let stage = null;
      if(stageChoice==='auto'){
        stage = /^AZ\d{4}(?!\d)/i.test(p.name.trim()) ? 'signedLOI' : 'loi';
      } else if(stageChoice!=='manual'){
        stage = stageChoice;
      }
      results.push({name: p.name, stage});
    });
  });
  return results;
}
async function commitMapsImport(m, results){
  let list, clientObj;
  if(m.pickedClient){
    list = db.lists.find(l=>l.id===m.pickedClient.listId);
    clientObj = list.clients.find(c=>c.id===m.pickedClient.id);
  } else {
    list = db.lists.find(l=>l.id===(m.newClientListId||'clients'));
    clientObj = {id:crypto.randomUUID(), name:m.newClientName.trim(), primary:null, secondContactId:null, thirdContactId:null, deals:[], createdBy:state.currentUser.id, authorizedUserIds:[]};
    if(list.id==='listings'){ clientObj.prospects=[]; clientObj.categoryConfig=newLSRCategoryConfig(); }
    list.clients.push(clientObj);
    await supaCreateClient(clientObj, list.id);
  }
  for(const r of results){
    const dealObj = {id:crypto.randomUUID(), name:r.name, complete:false, activeDeal:false, caExecuted:false, dueDate:null, dealType:'lease', stage:r.stage||null};
    clientObj.deals.push(dealObj);
    await supaCreateDeal(dealObj, clientObj.id);
  }
}

function guessColumn(headers, keywords){
  const lower = headers.map(h=>h.toLowerCase());
  for(const kw of keywords){
    const idx = lower.findIndex(h=>h.includes(kw));
    if(idx>=0) return headers[idx];
  }
  return '';
}

function parseCSV(text){
  // basic CSV parser handling quoted fields
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r[0]&&r[0].trim()!==''));
}
function exportVCards(ids){
  if(!ids.length) return;
  ids.forEach((id,i)=>{
    const c = db.contacts.find(x=>x.id===id);
    if(!c) return;
    const vcf = [
      'BEGIN:VCARD','VERSION:3.0',
      `N:${c.last};${c.first};;;`,
      `FN:${c.first} ${c.last}`,
      c.company?`ORG:${c.company}`:'',
      c.website?`URL:${c.website}`:'',
      c.email?`EMAIL;TYPE=INTERNET:${c.email}`:'',
      c.mobile?`TEL;TYPE=CELL:${c.mobile}`:'',
      c.phone?`TEL;TYPE=WORK:${c.phone}`:'',
      (c.address||c.city||c.state||c.zip)?`ADR;TYPE=WORK:;;${c.address||''};${c.city||''};${c.state||''};${c.zip||''};`:'',
      'END:VCARD'
    ].filter(Boolean).join('\r\n');
    setTimeout(()=>{
      const blob = new Blob([vcf], {type:'text/vcard'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=`${c.first}_${c.last}.vcf`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }, i*150);
  });
  flashToast(`Exporting ${ids.length} vCard file${ids.length===1?'':'s'} to Downloads…`);
}

/* ---------------- TOAST ---------------- */
function flashToast(msg){ state.toast = msg; }
// Wraps a click handler so an unexpected error becomes a visible message instead of
// silently doing nothing. Without this, a thrown error inside an onclick handler
// (e.g. some expected data not being found) aborts everything after it — the modal
// doesn't close, nothing saves, and there is no sign anything went wrong at all.
// Call this instead of a bare render() after any toggle/expand/collapse-style state change.
// A full render() replaces the DOM inside a scroll container, which resets its scroll
// position to the top — this saves it beforehand and restores it right after, so opening
// or closing a section simply reveals/hides content in place instead of jumping the screen.
function renderPreservingScroll(containerSelector){
  // querySelectorAll + take the LAST match, not querySelector's first match — when a
  // modal is nested inside another (e.g. a Project opened from within a Client page),
  // multiple elements can match the same selector at once. The one the user is
  // actually scrolled within is always the topmost/innermost one, added to the DOM
  // most recently — never the outer one underneath it.
  const matches = document.querySelectorAll(containerSelector);
  const scroller = matches.length ? matches[matches.length-1] : null;
  const savedScrollTop = scroller ? scroller.scrollTop : null;
  render();
  if(savedScrollTop!==null){
    requestAnimationFrame(()=>{
      const s2 = document.querySelectorAll(containerSelector);
      const s = s2.length ? s2[s2.length-1] : null;
      if(s) s.scrollTop = savedScrollTop;
    });
  }
}
function safeHandler(fn){
  return function(...args){
    try {
      const result = fn.apply(this, args);
      if(result && typeof result.catch === 'function'){
        // handler was async — catch a rejection that happens after an await too,
        // not just an error thrown synchronously before the first await
        result.catch(err=>{
          console.error('Action failed:', err);
          flashToast("That didn't complete — something unexpected went wrong. Nothing was lost, but please try again or refresh.");
          render();
        });
      }
      return result;
    }
    catch(err){
      console.error('Action failed:', err);
      flashToast("That didn't complete — something unexpected went wrong. Nothing was lost, but please try again or refresh.");
      render();
    }
  };
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------------- PERSISTENCE (localStorage) ----------------
   This app previously lived only in memory — a refresh wiped everything, which is
   why passwords, contacts, and deals all had to be re-entered constantly. Since this
   file runs as your own deployed app (not inside a Claude preview), real browser
   storage is safe and appropriate here. We do NOT persist who's currently logged in
   — the login screen always shows — but passwords, once set, now stick, along with
   every contact/deal/to-do. File attachments are the one exception: their data lives
   only in memory (this was flagged from the start), so they're intentionally not
   carried across a save/reload. */
const STORAGE_KEY = 'swe_portal_v1';
function dateAwareReplacer(key, value){
  const orig = this[key];
  if(orig instanceof Date) return {__type:'Date', __value: orig.toISOString()};
  return value;
}
function dateAwareReviver(key, value){
  if(value && typeof value==='object' && value.__type==='Date') return new Date(value.__value);
  return value;
}
function saveAppState(){
  try{
    const snapshot = {
      mainView: state.mainView,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot, dateAwareReplacer));
  } catch(e){ /* private-browsing mode, storage full, etc. — fail quietly, app still works */ }
}
let appStateWasLoaded = false;
function loadAppState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw, dateAwareReviver);
    // NOTE: lists/contacts/todos/archivedTodos/tenantRoster/brokerList are no longer
    // restored here — Supabase is now the real source of truth for all of those
    // (Phase 2+). Restoring them from this old local cache was actively harmful:
    // it could overwrite fresh data with a stale snapshot from before this app had
    // a real backend. Only things Supabase doesn't manage yet stay local.
    if(saved.mainView) state.mainView = saved.mainView;
    appStateWasLoaded = true;
  } catch(e){ /* corrupted/old save shape — just fall back to the seed data */ }
}
// Wired exactly once, here, at page load — this element is never recreated by any
// render cycle, unlike the file input that used to live inside the MyMaps modal
// itself, which got rebuilt every time that modal re-rendered.
function processMapsSelectedFile(){
  const staticInput = document.getElementById('mapsFileStatic');
  const file = staticInput.files && staticInput.files[0];
  const m = state.mapsImport;
  if(!m || m.step!=='upload') return;
  const fileStatusEl = document.getElementById('mapsFileStatus');
  if(!file){
    if(fileStatusEl) fileStatusEl.textContent = m.selectedFileName ? ('Selected: ' + m.selectedFileName + ' — click Continue to process it.') : 'Choose a KML/KMZ file first.';
    return;
  }
  m.selectedFileName = file.name;
  if(!m.pickedClient && !m.newClientName.trim()){
    if(fileStatusEl) fileStatusEl.textContent = 'Pick or name a Client/Listing first, then click Continue again. (Selected: ' + file.name + ')';
    return;
  }
  if(fileStatusEl) fileStatusEl.textContent = 'Reading ' + file.name + '…';
  mapsReadKmlText(file).then(kmlText=>{
    const folders = mapsParseFolders(kmlText);
    if(!folders.length){
      if(fileStatusEl) fileStatusEl.textContent = "Didn't find any pinned sites in " + file.name + ". (Still selected — no need to re-choose it.)";
      return;
    }
    m.folders = folders;
    m.folderStage = folders.map(()=> 'skip');
    m.manualPicks = folders.map(f=>f.placemarks.map(()=>false));
    m.step = 'mapping';
    staticInput.value = ''; // only reset now that we're actually moving on
    render();
  }).catch(err=>{
    if(fileStatusEl) fileStatusEl.textContent = "Couldn't read " + file.name + " — " + err.message;
  });
}
document.getElementById('mapsFileStatic').addEventListener('change', processMapsSelectedFile);
loadAppState();

// Check for an existing Supabase session (real login persistence — this is the
// part local storage alone could never do). If found, skip the login screen
// and go straight into the app. Runs after the first paint so the login card
// still shows instantly rather than a blank screen while this resolves.
(async ()=>{
  try{
    // Directory additions must land BEFORE the session check below — otherwise
    // someone admitted since this code was last deployed, opening the app on a
    // device that's never seen them, would fail to match against USERS here.
    // Wrapped separately: if this one thing fails (e.g. a flaky connection),
    // it must never prevent the actual session restore below from running.
    try{ if(await fetchDirectoryAdditions()) render(); }
    catch(e){ console.error('Directory additions check failed (continuing anyway):', e); }

    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session || !session.user){ state.screen='login'; render(); return; }

    const profile = await fetchMyProfile(session.user.id);
    if(!profile){ state.screen='login'; render(); return; }

    await fetchAllProfilesIntoUsers();
    const u = USERS.find(x=>x.email.toLowerCase()===profile.email.toLowerCase());
    if(!u){ state.screen='login'; render(); return; }

    u.authId = profile.id;
    if(!u.emailClient) u.emailClient = profile.email_client;
    if(profile.widget_order) state.widgetOrder = profile.widget_order;
    if(profile.sidebar_lists_order && profile.sidebar_lists_order.length) sidebarListsOrder = profile.sidebar_lists_order;
    if(profile.default_smart_list_order && profile.default_smart_list_order.length) state.defaultSmartListOrder = profile.default_smart_list_order;
    try{ u.notesList = await fetchPersonalNotes(profile.id); }
    catch(e){ console.error('Fetching personal notes failed (continuing anyway):', e); u.notesList = u.notesList || []; }

    // A session and a matching profile is genuinely enough to let someone back in —
    // no email client on file yet shouldn't be able to strand a real, valid login
    // on the sign-in screen with no explanation.
    state.currentUser = u;
    state.screen = 'app';
    if(!appStateWasLoaded) seedAll();
    await fetchAllAppDataFromSupabase();
    checkTodoDeepLink(); checkBrokerReviewDeepLink();
    render();
  } catch(e){ console.error('Session check failed:', e); state.screen='login'; render(); }
})();
