  'listings-sale': {code:'BC', label:'Buyer Counter (BC)'},
};
function computeEgnyteFilename(docType, accountName, propertyDescription, counterCode){
  const cleanName = (accountName||'Unknown').replace(/[^a-zA-Z0-9]/g,'');
  // Split "Street & Street - SEC" into the two arterials plus an optional corner suffix.
  const parts = (propertyDescription||'').split('-');
  const streetsPart = parts[0]||'';
  const corner = parts.length>1 ? parts[1].trim().toUpperCase().replace(/[^A-Z]/g,'') : '';
  const streets = streetsPart.split(/&|\/|\band\b/i).map(s=>s.trim().replace(/[^a-zA-Z0-9]/g,'')).filter(Boolean);
  const streetPart = streets.length ? streets.join('_') : 'UnknownLocation';
  const cornerPart = corner ? '_'+corner : '';
  const codePart = counterCode ? '_'+counterCode : '';
  const datePart = toLocalDateStr(todayDate()).replace(/-/g,'');
  return `${docType}_${cleanName}_${streetPart}${cornerPart}${codePart}_${datePart}`;
}
async function readFileAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function detectLoiFileType(file){
  if(!file) return null;
  if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)) return 'pdf';
  if(file.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document' || /\.docx$/i.test(file.name)) return 'docx';
  if(file.type==='application/msword' || /\.doc$/i.test(file.name)) return 'doc';
  return null;
}
async function processLoiFile(file, dropSide){
  const m = state.loiImport;
  const fileType = detectLoiFileType(file);
  if(!file || !fileType){
    m.error = 'Only PDF and Word documents (.pdf, .docx, .doc) are supported.';
    render();
    return;
  }
  m.dropSide = dropSide;
  m.fileName = file.name;
  m.loading = true;
  m.error = null;
  render();
  try{
    const base64 = await readFileAsBase64(file);
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const jwt = sessionData?.session?.access_token;
    const res = await fetch(`https://ugtlyzwvnhmcphtqkbke.supabase.co/functions/v1/extract-loi-terms`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${jwt}` },
      body: JSON.stringify({ fileBase64: base64, fileType })
    });
    const body = await res.json();
    if(!res.ok || body.error){
      m.error = body.error || 'AI extraction failed — please try again.';
      m.loading = false;
      render();
      return;
    }
    m.extracted = body.extracted;
    m.lowConfidenceFileFormat = !!body.lowConfidenceFileFormat;
    matchLoiToAccount();
    m.loading = false;
    m.step = 'review';
    render();
  }catch(e){
    console.error('processLoiFile error:', e);
    m.error = "Something went wrong reading that file — please try again.";
    m.loading = false;
    render();
  }
}
// Finds the matching Client/Listing (hard requirement) and, within it, the matching
// Deal/Prospect (soft — falls back to a pick-list + Create New if no confident match).
function matchLoiToAccount(){
  const m = state.loiImport;
  const ex = m.extracted;
  if(m.dropSide==='clients'){
    const l = db.lists.find(x=>x.id==='clients');
    const client = l.clients.find(c=>fuzzyTextMatch(c.name, ex.accountName));
    if(!client){ m.matchedClient=null; m.matchedDeal=null; m.candidateDeals=[]; return; }
    m.matchedClient = client;
    const candidates = client.deals||[];
    m.candidateDeals = candidates;
    const confident = candidates.find(d=>fuzzyTextMatch(d.building||d.name, ex.propertyDescription));
    m.matchedDeal = confident || null;
    m.isNewDeal = !confident;
  } else {
    const l = db.lists.find(x=>x.id==='listings');
    const client = l.clients.find(c=>fuzzyTextMatch(c.name, ex.propertyDescription));
    if(!client){ m.matchedClient=null; m.matchedDeal=null; m.candidateDeals=[]; return; }
    m.matchedClient = client;
    const candidates = client.prospects||[];
    m.candidateDeals = candidates;
    const confident = candidates.find(p=>fuzzyTextMatch(p.tenantName, ex.accountName));
    m.matchedDeal = confident || null;
    m.isNewDeal = !confident;
  }
}

      c.deals.push(d);
    }
    d.building = ex.propertyDescription || d.building;
    if(isSale) d.price = ex.rentOrPrice||d.price; else d.rent = ex.rentOrPrice||d.rent;
    d.term = ex.term || d.term;
    d.tiAllowance = ex.tiAllowance || d.tiAllowance;
    d.size = ex.size || d.size;
    await (m.isNewDeal ? supaCreateDeal(d, c.id) : supaUpdateDeal(d, c.id));
    m.savedName = `${c.name} — ${d.name}`;
  } else {
    let p = m.matchedDeal;
    if(m.isNewDeal || !p){
      p = {id:crypto.randomUUID(), tenantName: ex.accountName||'New Prospect', stage:'loi', dealType: isSale?'sale':'lease',
        dateOfContact: todayDate(), notes:'', edgeTracker:null, attachments:[], commission1Paid:false, commission2Paid:false};
      c.prospects = c.prospects || [];

    p.term = ex.term || p.term;
    p.tiAllowance = ex.tiAllowance || p.tiAllowance;
    p.size = ex.size || p.size;
    await (m.isNewDeal ? supaCreateProspect(p, c.id) : supaUpdateProspect(p, c.id));

  }
  const key = `${m.dropSide}-${isSale?'sale':'lease'}`;
  const counterInfo = m.counterChoice==='none' ? null : LOI_COUNTER_CODES[key];
  const accountNameForFile = m.dropSide==='clients' ? c.name : ex.accountName;
  m.computedFilename = computeEgnyteFilename(ex.documentType||'LOI', accountNameForFile, ex.propertyDescription, counterInfo?counterInfo.code:null);
  m.step = 'done';
  render();
}
function findClientById(clientId){
  for(const l of db.lists){
    if(!l.clients) continue;
    const c = l.clients.find(x=>x.id===clientId);
    if(c) return c;
  }
  return null;
}
// Splits qualified-offer credit evenly across whoever has access to the client account
// (creator + authorized users) — Admins and Users are treated identically here; only
// LD and Daniel are naturally excluded since they have no login/profile at all.
// --- Pipeline View: weighted-average commission pipeline ---
// Stage -> % likelihood, per Michael's table. Prospect and Dead are excluded entirely
// (0% and no chance of ever paying, respectively) by simply not appearing in this map.
const PIPELINE_STAGE_WA = {
  loi: 0.25, signedLOI: 0.50, negotiating: 0.70, signedLease: 1.00, inEscrow: 0.70, closedEscrow: 1.00
};
// Every deal/prospect (Clients & Listings only — Prospects on the LSR board have no
// value yet) that's still owed commission, broken into one row per person on the split.
// "Still owed" already accounts for a clean 50/50 first/second half: once a half is
// marked paid, only the remaining half's dollars count, and the deal drops out of the
// pipeline entirely once both halves are paid.
// "Paid to Date" = actual collected commission dollars this person has earned (their split
// % applied to whichever half/COE has actually been marked paid) — never includes open
// pipeline, per Michael's explicit call. Intended to be scoped to the calendar year (tiers
// reset Jan 1), but see the note inside computeBrokerGrossForUser below — that's on hold
// until commission due dates are actually enterable, so this is all-time paid for now.
// "Net to Date" = that amount run through their assigned commission plan's current tier split.
function computeBrokerGrossForUser(userId, year){
  // This is meant to be scoped to `year` (tiers reset annually on Jan 1) — the `year`
  // param is kept for that reason — but commission due dates aren't populated anywhere
  // in the data yet, so there's no way to know which year a paid commission belongs to.
  // Per the user: until due-date entry exists, just total every commission marked Paid,
  // regardless of year, so "Paid to Date" shows a real number instead of always $0.
  // Once due dates can actually be entered, restore year-matching here.
  let gross = 0;
  db.lists.filter(l=>l.type==='deep').forEach(l=>{
    l.clients.forEach(c=>{
      (c.deals||[]).forEach(d=>{
        const totalFee = parseFloat(d.totalFee) || 0;
        if(totalFee<=0) return;
        const mySplit = findSplitForUser(d, userId);
        if(!mySplit) return;
        const pct = (parseFloat(mySplit.pct)||0)/100;
        const isSale = d.dealType==='sale';
        if(isSale){
          if(d.commission1Paid) gross += totalFee * pct;
        } else {
          if(d.commission1Paid) gross += (totalFee/2) * pct;
          if(d.commission2Paid) gross += (totalFee/2) * pct;
        }
      });
    });
  });
  return gross;
}
function findCommissionTierForAmount(plan, grossAmount){
  if(!plan || !plan.tiers || !plan.tiers.length) return null;
  const sorted = plan.tiers.slice().sort((a,b)=>a.sortOrder-b.sortOrder);
  let tier = sorted[0];
  for(const t of sorted){
    if(grossAmount >= t.minAmount) tier = t;
  }
  return tier;
}
function computeCommissionSummaryForUser(userId, year){
  const gross = computeBrokerGrossForUser(userId, year);
  const user = USERS.find(u=>u.id===userId);
  const plan = user && user.commissionPlanId ? commissionPlans.find(p=>p.id===user.commissionPlanId) : null;
  const tier = findCommissionTierForAmount(plan, gross);
  const net = tier ? gross * (tier.splitPct/100) : 0;
  const nextTier = plan && tier ? plan.tiers.slice().sort((a,b)=>a.sortOrder-b.sortOrder).find(t=>t.sortOrder===tier.sortOrder+1) : null;
  return { gross, net, plan, tier, nextTier, year };
}
function pipelineRows(){
  const rows = [];
  db.lists.filter(l=>l.type==='deep').forEach(l=>{
    l.clients.forEach(c=>{
      const items = [
        ...(c.deals||[]).map(d=>({rec:d, sourceTable:'deals'})),
        ...(c.prospects||[]).map(p=>({rec:p, sourceTable:'prospects'}))
      ];
      items.forEach(({rec:d, sourceTable})=>{
        const wa = PIPELINE_STAGE_WA[d.stage];
        if(!wa) return; // not in the map = Prospect/Dead/no stage — excluded
        const totalFee = parseFloat(d.totalFee) || 0;
        if(totalFee<=0) return;
        let remaining = totalFee;
        if(d.commission1Paid) remaining -= totalFee/2;
        if(d.commission2Paid) remaining -= totalFee/2;
        if(remaining<=0) return; // both halves paid — out of the pipeline
        // Past-due: an unpaid installment whose own due date has already passed.
        const today = todayDate();
        let pastDueTotal = 0;
        if(sourceTable==='deals'){
          if(!d.commission1Paid && d.commission1DueDate && new Date(d.commission1DueDate+'T00:00:00')<today) pastDueTotal += totalFee/2;
          if(!d.commission2Paid && d.commission2DueDate && new Date(d.commission2DueDate+'T00:00:00')<today) pastDueTotal += totalFee/2;
        }
        const receivedTotal = totalFee - remaining;
        (d.splits||[]).forEach(split=>{
          const pct = parseFloat(split.pct) || 0;
          if(pct<=0) return;
          const waValue = remaining * (pct/100) * wa;
          if(waValue<=0) return;
          rows.push({
            userId: split.userId, clientId: c.id, clientName: c.name, dealName: d.name, listId: l.id,
            stage: d.stage, totalFee, pct, waValue, sourceTable, sourceId: d.id,
            dealId: sourceTable==='deals' ? d.id : null,
            dueDate: sourceTable==='deals' && d.dueDate ? toLocalDateStr(d.dueDate) : null,
            receivedAmt: receivedTotal * (pct/100), pastDueAmt: pastDueTotal * (pct/100),
          });
        });
      });
    });
  });
  return rows;
}
function offerCreditsByUser(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const credits = {}; // userId -> {ytd, month}
  USERS.forEach(u=>{ credits[u.id] = {ytd:0, month:0}; });
  (db.dealOffers||[]).filter(o=>o.qualified).forEach(o=>{
    const c = findClientById(o.clientId);
    if(!c) return;
    const people = Array.from(new Set([c.createdBy, ...(c.authorizedUserIds||[])].filter(Boolean)));
    if(!people.length) return;
    const share = 1/people.length;
    const marked = new Date(o.markedAt);
    const inYear = marked.getFullYear()===year;
    const inMonth = inYear && marked.getMonth()===month;
    people.forEach(uid=>{
      if(!credits[uid]) credits[uid] = {ytd:0, month:0};
      if(inYear) credits[uid].ytd += share;
      if(inMonth) credits[uid].month += share;
    });
  });
  return credits;
}

let newsCache = null; // {items:[{title,link}], fetchedAt} | {error:true, fetchedAt} | {loading:true}
function fetchNewsIfNeeded(){
  if(newsCache && !newsCache.error && (Date.now()-newsCache.fetchedAt) < 30*60*1000) return;
  newsCache = {loading:true, fetchedAt:Date.now()};
  // ORION Investment Real Estate's own public "Daily Top 5" page — no login, no paywall,
  // the same content as their daily email. Their server may still not allow a direct browser
  // fetch from another site (CORS); if so this quietly falls back to a plain link-out.
  fetch('https://www.orionprop.com/daily-top-5/')
    .then(r=>{ if(!r.ok) throw new Error('bad status'); return r.text(); })
    .then(text=>{
      const doc = new DOMParser().parseFromString(text, 'text/html');
      const links = Array.from(doc.querySelectorAll('a[href*="/topfive/"]'));
      const seen = new Set();
      const items = [];
      for(const a of links){
        const href = a.getAttribute('href');
        const title = a.textContent.trim();
        if(!href || !title) continue;
        if(title.toLowerCase().includes('read the full article')) continue;
        if(seen.has(href)) continue;
        seen.add(href);
        items.push({title, link: href});
        if(items.length>=5) break;
      }
      if(!items.length) throw new Error('no items found');
      newsCache = {items, fetchedAt:Date.now()};
      render();
    })
    .catch(()=>{ newsCache = {error:true, fetchedAt:Date.now()}; render(); });
}

function getSundayOfWeek(d){
  const r = new Date(d);
  r.setHours(0,0,0,0);
  r.setDate(r.getDate() - r.getDay());
  return r;
}
function calendarEligibleTodos(){
  // Someday (no date) and Completed to-dos never appear on a calendar.

  // visibility into (visibleTodo() is much broader than that).
  const me = state.currentUser.id;
  return db.todos.filter(td=>td.dueDate && !td.completed && (td.assignedTo===me || td.createdBy===me));

function renderCalendarViewModal(){
  const mode = state.calendarViewMode || 'month';
  if(!state.calendarCursor){ const now=new Date(); state.calendarCursor={year:now.getFullYear(),month:now.getMonth()}; }
  if(!state.calendarWeekStart){ state.calendarWeekStart = getSundayOfWeek(new Date()); }
  const todosByDateKey = calendarTodosByDateKey();
  const today = todayDate();

  let headTitle = '', cellsHtml = '', gridRowsStyle = '';
  if(mode==='month'){
    const {year, month} = state.calendarCursor;
    headTitle = new Date(year,month,1).toLocaleDateString('en-US',{month:'long', year:'numeric'});
    const firstDow = new Date(year,month,1).getDay();
    const daysInMonth = new Date(year,month+1,0).getDate();
    const daysInPrevMonth = new Date(year,month,0).getDate();
    const leadCount = firstDow;
    for(let i=0;i<leadCount;i++){
      const dayNum = daysInPrevMonth - leadCount + 1 + i;
      let pm = month-1, py = year; if(pm<0){pm=11; py--;}
      cellsHtml += renderCalendarDayCell(py, pm, dayNum, todosByDateKey, today, true);
    }
    for(let d=1; d<=daysInMonth; d++){
      cellsHtml += renderCalendarDayCell(year, month, d, todosByDateKey, today, false);
    }
    const totalSoFar = leadCount + daysInMonth;
    const trailCount = (7 - (totalSoFar % 7)) % 7;
    for(let i=1;i<=trailCount;i++){
      let nm = month+1, ny = year; if(nm>11){nm=0; ny++;}
      cellsHtml += renderCalendarDayCell(ny, nm, i, todosByDateKey, today, true);
    }
  } else {
    // week/2week/3week/4week — always a fixed Sun–Sat span (or several), never a rolling window
    const numWeeks = mode==='4week' ? 4 : mode==='3week' ? 3 : mode==='2week' ? 2 : 1;
    const start = state.calendarWeekStart;
    const end = new Date(start); end.setDate(end.getDate() + (numWeeks*7 - 1));
    const sameMonth = start.getMonth()===end.getMonth() && start.getFullYear()===end.getFullYear();
    const fmtShort = (d)=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    headTitle = sameMonth
      ? `${start.toLocaleDateString('en-US',{month:'long'})} ${start.getDate()}–${end.getDate()}, ${start.getFullYear()}`
      : `${fmtShort(start)} – ${fmtShort(end)}, ${end.getFullYear()}`;
    for(let i=0;i<numWeeks*7;i++){
      const d = new Date(start); d.setDate(d.getDate()+i);
      cellsHtml += renderCalendarDayCell(d.getFullYear(), d.getMonth(), d.getDate(), todosByDateKey, today, false);
    }
    gridRowsStyle = `grid-auto-rows:minmax(160px,1fr);`;
  }

  const overlay = document.createElement('div');
  overlay.className='cv-overlay';
  overlay.innerHTML = `
  <div class="cv-card">
    <div class="cv-head">
      <button class="cv-nav-btn" data-cvnav="prev">←</button>
      <div class="cv-head-title">${headTitle}</div>
      <button class="cv-nav-btn" data-cvnav="next">→</button>
      <button class="btn secondary sm" data-cvnav="today">Today</button>
      <div class="segmented" style="margin-left:8px;">
        <button class="${mode==='month'?'active':''}" data-cvmode="month">Month</button>
        <button class="${mode==='week'?'active':''}" data-cvmode="week">1 Week</button>
        <button class="${mode==='2week'?'active':''}" data-cvmode="2week">2 Weeks</button>
        <button class="${mode==='3week'?'active':''}" data-cvmode="3week">3 Weeks</button>
        <button class="${mode==='4week'?'active':''}" data-cvmode="4week">4 Weeks</button>
      </div>
      <div style="flex:1;"></div>
      <button class="modal-close" data-action="closeCalendarView">✕ Done</button>
    </div>
    <div class="cv-legend">
      <span><span class="cv-legend-dot" style="background:var(--edge);"></span>My To-Do's</span>
      <span><span class="cv-legend-dot" style="background:#3B82C4;"></span>Assigned to Others</span>
      <span style="margin-left:auto;">Drag a card onto another day to reschedule it</span>
    </div>
    <div class="cv-grid" style="${gridRowsStyle}">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cv-dow">${d}</div>`).join('')}
      ${cellsHtml}
    </div>
  </div>`;
  document.getElementById('app').appendChild(overlay);
  wireCalendarViewHandlers(overlay);
}
function wireCalendarViewHandlers(overlay){
  overlay.querySelectorAll('[data-action="closeCalendarView"]').forEach(b=>b.onclick=()=>{ state.calendarViewOpen=false; render(); });
  overlay.querySelectorAll('[data-cvmode]').forEach(b=>b.onclick=()=>{
    state.calendarViewMode = b.dataset.cvmode;
    if(state.calendarViewMode!=='month'){ state.calendarWeekStart = getSundayOfWeek(new Date()); }
    render();
  });
  overlay.querySelectorAll('[data-cvnav]').forEach(b=>b.onclick=()=>{
    const nav = b.dataset.cvnav;
    const mode = state.calendarViewMode || 'month';
    if(nav==='today'){
      const now=new Date();
      state.calendarCursor={year:now.getFullYear(),month:now.getMonth()};
      state.calendarWeekStart = getSundayOfWeek(now);
    } else if(mode==='month'){
      let {year,month} = state.calendarCursor;
      month += (nav==='next'?1:-1);
      if(month<0){month=11;year--;} if(month>11){month=0;year++;}
      state.calendarCursor = {year,month};
    } else {
      // week/2week: jump by exactly the span currently shown (7 or 14 days)
      const span = mode==='4week' ? 28 : mode==='3week' ? 21 : mode==='2week' ? 14 : 7;
      const d = new Date(state.calendarWeekStart);
      d.setDate(d.getDate() + (nav==='next'? span : -span));
      state.calendarWeekStart = d;
    }
    render();
  });

function wireMarketingListWizard(overlay, listing, allCats){
  const m = state.marketingListWizard;
  overlay.querySelectorAll('[data-action="mlwCancel"]').forEach(b=>b.onclick=()=>{ state.marketingListWizard=null; render(); });
  if(m.step===1){
    overlay.querySelectorAll('.mlwCategoryCheck').forEach(cb=>cb.onchange=()=>{
      if(cb.checked) m.selectedCategoryIds.push(cb.value);
      else m.selectedCategoryIds = m.selectedCategoryIds.filter(id=>id!==cb.value);
    });
    overlay.querySelector('[data-action="mlwNext"]').onclick=()=>{
      if(!m.selectedCategoryIds.length){ flashToast('Pick at least one category first.'); return; }
      const existingNames = new Set(listing.prospects.map(p=>p.tenantName.toLowerCase().trim()));
      m.reviewItems = TENANT_ROSTER
        .filter(r=>m.selectedCategoryIds.includes(r.categoryId))
        .map(r=>({rosterId:r.id, name:r.name, categoryId:r.categoryId, tenantType:r.tenantType, notes:r.notes,
                   keep:true, tradeArea:false, prohibited:false, alreadyOnListing: existingNames.has(r.name.toLowerCase().trim())}));
      m.step = 2;
      render();
    };
  } else {
    overlay.querySelectorAll('[data-mlwflag]').forEach(cb=>cb.onclick=(ev)=>{
      ev.stopPropagation();
      const item = m.reviewItems.find(i=>i.rosterId===cb.dataset.rosterid);
      if(!item) return;
      item.keep = (cb.dataset.mlwflag==='keep');
      item.tradeArea = (cb.dataset.mlwflag==='tradeArea');
      item.prohibited = (cb.dataset.mlwflag==='prohibited');
    });
    overlay.querySelector('[data-action="mlwBack"]').onclick=()=>{ m.step=1; render(); };
    overlay.querySelector('[data-action="mlwAddNewTenant"]').onclick=()=>{
      const nameInput = document.getElementById('mlwNewName');
      const catSelect = document.getElementById('mlwNewCategory');
      const errBox = document.getElementById('mlwNewTenantError');
      const name = nameInput.value.trim();
      const categoryId = catSelect.value;
      if(!name || !categoryId){
        errBox.textContent = !categoryId ? 'Choose a category before adding this tenant.' : 'Enter a tenant name.';
        errBox.style.display = 'block';
        return;
      }
      errBox.style.display = 'none';
      const newRoster = {id:crypto.randomUUID(), name, categoryId, tenantType:'', notes:''};
      TENANT_ROSTER.push(newRoster); // added to the permanent, cross-listing roster
      supaCreateRosterEntry(newRoster);
      if(!m.selectedCategoryIds.includes(categoryId)) m.selectedCategoryIds.push(categoryId);
      const alreadyOnListing = listing.prospects.some(p=>p.tenantName.toLowerCase().trim()===name.toLowerCase().trim());
      m.reviewItems.push({rosterId:newRoster.id, name, categoryId, tenantType:'', notes:'', keep:true, tradeArea:false, prohibited:false, alreadyOnListing});
      flashToast(`"${name}" added to the roster and this review.`);
      render();
    };
    overlay.querySelector('[data-action="mlwSave"]').onclick=()=>{
      const existingNames = new Set(listing.prospects.map(p=>p.tenantName.toLowerCase().trim()));
      let added=0, skippedDup=0, discarded=0;
      const toSync = [];
      m.reviewItems.forEach(item=>{
        if(!item.keep || item.prohibited){ discarded++; return; }
        const key = item.name.toLowerCase().trim();
        if(existingNames.has(key)){ skippedDup++; return; }
        const newP = {
          id:crypto.randomUUID(), tenantName:item.name, contactId:null, brokerId:null, categoryId:item.categoryId,
          stage:'contacted', dealType:null, dateOfContact:null,
          notes: [item.tenantType, item.notes].filter(Boolean).join(' — '),
          edgeTracker: state.currentUser.id, deadDate:null,
          building:'', spaceNum:'', size:'', rent:'', price:'', term:'', tiAllowance:'', dealNotes:'',
          commission1Paid:false, commission2Paid:false, attachments:[],
          inTradeArea: item.tradeArea
        };
        listing.prospects.push(newP);
        toSync.push(newP);
        existingNames.add(key);
        added++;
      });
      if(toSync.length){
        supabaseClient.from('prospects').insert(toSync.map(p=>prospectLocalToRow(p, listing.id)))
          .then(({error})=>{ if(error){ console.error('marketing list bulk sync error:', error); flashToast('Added here, but syncing some to the server failed.'); render(); } });
      }
      state.marketingListWizard = null;
      let msg = `Added ${added} tenant${added===1?'':'s'} to ${listing.name}.`;
      if(skippedDup) msg += ` Skipped ${skippedDup} already on this listing.`;
      if(discarded) msg += ` Discarded ${discarded}.`;
      flashToast(msg);
      render();
    };
  }
}

function caOutstandingCount(){

function allDealsList(){
  const out = [];
  db.lists.filter(l=>l.type==='deep').forEach(l=>{
    l.clients.forEach(c=>{
      c.deals.forEach(d=>{
        if(!d.stage || d.stage==='prospect' || d.stage==='dead') return; // Prospects and Dead — excluded, this list is active deals only
        const isDone = d.complete || d.stage==='closedEscrow'; // Open for Business or Closed Escrow
        const fullyPaid = !!(d.commission1Paid && d.commission2Paid);
        if(isDone && fullyPaid) return; // truly finished, nothing left to track — excluded
        out.push({deal:d, client:c, listId:l.id});
      });
    });
  });
  return out;
}
// Same "active deal" rules as allDealsList(), but scoped to any one person (or everyone,
// when userId is null/'office') by account access — created it, or listed as an authorized
// user on it — matching exactly how the "All Deals" smart list decides what a person can
// see. This is deliberately NOT the same as pipelineRows()/commission-split scoping: a
// person can be authorized on an account without being in a specific deal's splits yet,
// and the Dashboard should reflect what they can see, not just what they're paid on.
function allDealsForUser(userId){
  const rows = allDealsList();
  if(!userId) return rows; // null/'office' = everyone
  return rows.filter(r=>r.client.createdBy===userId || (r.client.authorizedUserIds||[]).includes(userId));
}
function archivedDealsList(){

        const fullyPaid = !!(d.commission1Paid && d.commission2Paid);

      });
    });
  });
  return out;
}

}

function assigneeRank(td){
  const me = state.currentUser.id;
  if(td.assignedTo===me) return 0;
  const others = USERS.filter(u=>u.id!==me).map(u=>u.id);
  const idx = others.indexOf(td.assignedTo);
  return idx>=0 ? idx+1 : 999;
}
function todoRowLegend(ids){
  const allSelected = ids.length>0 && ids.every(id=>state.selectedTodoIds.includes(id));
  return `
  <div style="display:flex;gap:20px;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:12px;padding:0 2px;align-items:center;">

      Select all (for bulk actions)
    </label>
    <span><span style="display:inline-block;width:15px;height:15px;border:2px solid var(--ink);border-radius:50%;vertical-align:middle;margin-right:6px;"></span>Mark complete</span>
  </div>`;
}
function renderTodoList(list, compact, dateOnly){
  if(!list.length){
    if(compact) return `<div class="tiny" style="color:var(--ink-soft);padding:6px 0;">Nothing here right now.</div>`;
    return `<div class="empty-state"><div class="big">All clear.</div><div class="tiny">Nothing here right now. Nice work. Take five.</div></div>`;
  }
  if(dateOnly){
    // Pure soonest-first sort, no assignee grouping at all — used for personal
    // date-ordered views (e.g. All - Me) where grouping by assignee would break
    // up the chronological order. Completed items still sort to the bottom first.
    const sorted = list.slice().sort((a,b)=>{
      if(!!a.completed !== !!b.completed) return a.completed ? 1 : -1;
      if(!a.dueDate && !b.dueDate) return 0;
      if(!a.dueDate) return 1;
      if(!b.dueDate) return -1;
      return a.dueDate-b.dueDate;
    });
    const allIds = sorted.map(td=>td.id);
    return todoRowLegend(allIds) + sorted.map(td=>renderTodoRow(td)).join('');
  }
  // Completed items always sort to the bottom of whatever list they're in — a checked
  // item should stay visible and land at the end, never disappear or jump around.
  // Group by assignee — mine first, then each teammate in turn — and within each
  // group, new/unseen assignments float up, then soonest due date first.
  const sorted = list.slice().sort((a,b)=>{
    if(!!a.completed !== !!b.completed) return a.completed ? 1 : -1;
    const ra=assigneeRank(a), rb=assigneeRank(b);
    if(ra!==rb) return ra-rb;
    if(ra===0){
      const aNew = a.isNew && a.assignedTo===state.currentUser.id;
      const bNew = b.isNew && b.assignedTo===state.currentUser.id;
      if(aNew && !bNew) return -1;
      if(bNew && !aNew) return 1;
    }
    if(!a.dueDate && !b.dueDate) return 0;
    if(!a.dueDate) return 1;
    if(!b.dueDate) return -1;
    return a.dueDate-b.dueDate;
  });
  const allIds = sorted.map(td=>td.id);
  const multiAssignee = new Set(list.map(t=>t.assignedTo)).size > 1;
  if(!multiAssignee) return todoRowLegend(allIds) + sorted.map(td=>renderTodoRow(td)).join('');
  let html=todoRowLegend(allIds); let lastAssignee=undefined;
  sorted.forEach(td=>{
    if(td.assignedTo!==lastAssignee){
      const isMine = td.assignedTo===state.currentUser.id;
      const u = USERS.find(x=>x.id===td.assignedTo);
      const label = isMine ? 'Mine' : (u? u.name : 'Unassigned');
      html += `<div class="section-label" style="${lastAssignee===undefined?'margin-top:0;':'margin-top:18px;'}">${escapeHtml(label)}</div>`;
      lastAssignee = td.assignedTo;
    }
    html += renderTodoRow(td);
  });
  return html;
}
function contextLabel(td){
  if(td.clientId){
    for(const l of db.lists){
      if(l.type==='deep'){
        const c = l.clients.find(x=>x.id===td.clientId);
        if(c){
          if(td.dealId){
            const d = c.deals.find(x=>x.id===td.dealId);
            if(d) return `${c.name} → ${d.name}`;
          }
          return c.name;
        }
      }
    }
  }
  if(td.entryId){
    for(const l of db.lists){
      if(l.type==='flat'){
        const e = l.entries.find(x=>x.id===td.entryId);
        if(e) return e.name;
      }
    }
  }
  if(td.projectId){
    const proj = db.todos.find(x=>x.id===td.projectId);
    if(proj) return proj.title;
  }
  return td.category || '';
}
function contactForClient(c){
  if(!c || !c.primary) return null;
  return db.contacts.find(x=>x.id===c.primary) || null;
}
function getTodoContact(td){
  if(td.clientId){
    for(const l of db.lists){ if(l.type==='deep'){ const c=l.clients.find(x=>x.id===td.clientId); if(c) return contactForClient(c); } }
  }
  if(td.dealId){
    for(const l of db.lists){ if(l.type==='deep'){ for(const c of l.clients){ if(c.deals.some(d=>d.id===td.dealId)) return contactForClient(c); } } }
  }
  return null;
}
function telHref(num){ return 'tel:'+String(num).replace(/[^0-9+]/g,''); }
function renderTodoRow(td){
  const status = dueStatus(td.dueDate);
  const dueLabel = td.dueDate ? fmtDate(td.dueDate) : 'No date';
  const dueCls = status==='overdue' ? 'overdue' : (status==='today' ? 'today' : '');
  const assignee = USERS.find(u=>u.id===td.assignedTo);
  const assignedBy = (td.createdBy && td.createdBy!==td.assignedTo) ? USERS.find(u=>u.id===td.createdBy) : null;
  const contact = getTodoContact(td);
  const selected = state.selectedTodoIds.includes(td.id);
  return `
  <div class="row-card" data-todo="${td.id}">
    <input type="checkbox" class="row-select" data-select="${td.id}" ${selected?'checked':''} title="Select">
    <div class="row-check ${td.completed?'done':''}" data-toggle="${td.id}" title="Mark complete">${td.completed?'✓':''}</div>
    <div class="row-body">
      <div class="row-title ${td.completed?'done':''}">${escapeHtml(td.title)}</div>
      <div class="row-meta">
        <span class="due ${dueCls}">${dueLabel}</span>
        ${contextLabel(td) ? `<span class="pill">${contextLabel(td)}</span>` : ''}
        ${td.private ? `<span class="pill private">Private</span>`:''}
        ${td.type!=='task' ? `<span class="pill gray">${td.type}${(td.type==='checklist'||td.type==='project') && td.checklistItems && td.checklistItems.length? ` ${td.checklistItems.filter(i=>i.done).length}/${td.checklistItems.length}`:''}${td.type==='project' ? ` · ${db.todos.filter(t=>t.projectId===td.id).length} to-do${db.todos.filter(t=>t.projectId===td.id).length===1?'':'s'}` : ''}</span>`:''}
        ${td.isNew && td.assignedTo===state.currentUser.id ? `<span class="pill" style="background:var(--edge);color:#fff;">New</span>`:''}
        ${assignedBy ? `<span class="pill gray" title="Assigned by ${escapeAttr(assignedBy.name)}">👤 by ${assignedBy.initials}</span>`:''}
        ${td.attachments && td.attachments.length ? `<span class="pill gray">📎 ${td.attachments.length}</span>`:''}
      </div>
    </div>
    ${contact ? `
    <div class="row-contact">
      ${contact.email? `<a class="contact-link" href="mailto:${contact.email}" data-stopprop="1" title="Email ${escapeAttr(contact.first)}">✉️ ${escapeHtml(contact.email)}</a>`:''}
      ${contact.mobile? `<a class="contact-link" href="${telHref(contact.mobile)}" data-stopprop="1" title="Call ${escapeAttr(contact.first)}">📱 ${escapeHtml(contact.mobile)}</a>`:''}
    </div>` : ''}
    <div class="row-right">
      ${assignee ? `<div class="avatar-chip" title="${assignee.name}">${assignee.initials}</div>` : ''}
      <button class="row-trash" data-delete="${td.id}" title="Delete to-do">🗑️</button>
    </div>
  </div>`;
}

    }
    const visibleEntries = l.entries.filter(hasAccess);
    if(!visibleEntries.length) return addBtn + (searchQ ? `<div class="empty-state"><div class="big">No matches for "${escapeHtml(searchQ)}".</div><div class="tiny">Try a different search, or clear it to see everything.</div></div>` : `<div class="empty-state"><div class="big">Nothing here yet.</div><div class="tiny">Add a prospect to start tracking outreach.</div></div>`);
    return addBtn + visibleEntries.map(renderEntryRow).join('');
  }
}

function renderShell(){
  // On a phone-width screen we show exactly one pane at a time: the nav list, or the
  // main content for whatever was tapped. A modal (client/deal drill-down) always
  // covers the full screen on top of either, so it doesn't need special-casing here.
  const hideSidebar = state.isMobile && state.mobileScreen==='main';
  const hideMain = state.isMobile && state.mobileScreen==='nav';
  return `
  <div class="shell">
    <div style="${hideSidebar?'display:none;':''}">${renderSidebar()}</div>

  if(a==='adminDigest'){ state.notifSettingsOpen=true; }
  if(a==='adminUsers'){
    // Refresh every profile fresh from the server first — without this, anyone who
    // logged in for the first time after this browser's own session started would
    // still show as having no real account yet, silently blocking their role change

    await fetchAllProfilesIntoUsers();
    state.manageUsersModalOpen=true;
  }

function levenshteinDistance(a, b){
  a = a.toLowerCase(); b = b.toLowerCase();
  const m = a.length, n = b.length;
  const dp = [];
  for(let i=0;i<=m;i++){ dp.push([i]); }
  for(let j=1;j<=n;j++){ dp[0][j]=j; }
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function allHashtagsInUse(excludeClientId){
  const set = new Set();
  db.lists.forEach(l=>{
    if(l.type==='deep') l.clients.forEach(c=>{
      if(c.id===excludeClientId || !c.hashtags) return;
      c.hashtags.split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>set.add(t));
    });
  });
  return [...set];
}
// Flags likely-duplicate tags (punctuation/capitalization differences AND probable typos —
// both usually land within a small edit distance of each other, e.g. #freddys -> #freddy's
// is a 1-character insert, #freddys -> #freddyz is a 1-character substitution).
function findSimilarHashtag(tag, existingTags){
  const threshold = tag.length <= 5 ? 1 : 2;
  for(const existing of existingTags){
    if(existing.toLowerCase()===tag.toLowerCase()) continue; // exact match — not a typo, a legitimate reuse
    if(levenshteinDistance(tag, existing) <= threshold) return existing;
  }
  return null;
}

  db.lists.filter(l=>l.type==='deep').forEach(l=>l.clients.forEach(c=>out.push({id:c.id, name:c.name, listName:l.name})));
  return out;
}
function findListIdForClient(clientId){
  const list = db.lists.filter(l=>l.type==='deep').find(l=>l.clients.some(c=>c.id===clientId));
  return list ? list.id : null;
}

function findSourceRecord(sourceTable, sourceId){
  for(const l of db.lists){
    if(!l.clients) continue;
    for(const c of l.clients){
      if(sourceTable==='deals' && c.deals){ const d = c.deals.find(x=>x.id===sourceId); if(d) return {ref:d, saveFn:()=>supaUpdateDeal(d, c.id)}; }
      if(sourceTable==='prospects' && c.prospects){ const pr = c.prospects.find(x=>x.id===sourceId); if(pr) return {ref:pr, saveFn:()=>supaUpdateProspect(pr, c.id)}; }
    }
  }
  return null;
}

// --- Map View: live map of Clients/Listings/Deals, using the Google Maps Platform ---
// Deals are named by intersection, so strip a trailing "- SEC/NEC/SWC/NWC" corner suffix
// before geocoding (Google doesn't understand that shorthand) and bias the search to
// Arizona server-side, since that's where nearly everything is.
function stripCornerSuffix(text){
  if(!text) return text;
  return text.replace(/-\s*(SEC|NEC|SWC|NWC)\s*$/i, '').trim();
}
// Deal/prospect names carry the real address info (e.g. "AZ1650 - Camelback & 20th - SSWC"),
// not the mostly-empty "building" field — strip the leading store code, any corner
// designation (wherever it falls, including doubled forms like SSWC/NNEC), and trailing
// parenthetical notes, but keep everything else (a trailing city name genuinely helps).
function extractAddressFromName(name){
  if(!name) return '';
  let s = name;
  s = s.replace(/^[A-Za-z]{2}\d{2,6}\s*-\s*/, ''); // leading store code like "AZ1650 - "
  s = s.replace(/\b(N{1,2}|S{1,2})(E|W)C\b/gi, ''); // corner designation anywhere
  s = s.replace(/\(([^)]*)\)/g, ', $1'); // keep parenthetical content — often a disambiguating city name
  s = s.replace(/-\s*-/g, '-').replace(/\s{2,}/g, ' ').replace(/^\s*-\s*|\s*-\s*$/g, '').trim();
  return s;
}
async function geocodeOneRecord(item){
  if(!item.addressText || !item.addressText.trim()) return;
  try{
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const jwt = sessionData?.session?.access_token;
    const res = await fetch(`https://ugtlyzwvnhmcphtqkbke.supabase.co/functions/v1/geocode-address`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${jwt}` },
      body: JSON.stringify({ address: item.addressText })
    });
    const body = await res.json();
    if(body.found){
      item.rec.latitude = body.lat;
      item.rec.longitude = body.lng;
      item.rec.geocodeFailed = false;
    } else {
      item.rec.geocodeFailed = true;
    }
    if(item.kind==='deal') await supaUpdateDeal(item.rec, item.clientId);
    else await supaUpdateProspect(item.rec, item.clientId);
  }catch(e){
    console.error('geocodeOneRecord error:', e);
  }
}

function loadGoogleMapsScript(callback){
  if(window.google && window.google.maps){ callback(); return; }
  if(document.getElementById('googleMapsScript')){
    document.getElementById('googleMapsScript').addEventListener('load', callback);
    return;
  }
  const script = document.createElement('script');
  script.id = 'googleMapsScript';
  script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_JS_KEY}`;
  script.async = true;
  script.onload = callback;
  document.head.appendChild(script);
}

function exportMapAsKml(c){
  const activeDeals = (c.deals||[]).filter(d=>d.latitude && d.longitude);
  const placemarks = activeDeals.map(d=>{
    const stageInfo = LSR_STAGE_MAP[d.stage];
    return `<Placemark><name>${escapeXml(d.name)}</name><description>${escapeXml(stageInfo?stageInfo.name:d.stage)}</description><Point><coordinates>${d.longitude},${d.latitude},0</coordinates></Point></Placemark>`;
  }).join('');
  const kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${escapeXml(c.name)}</name>${placemarks}</Document></kml>`;
  const blob = new Blob([kml], {type:'application/vnd.google-earth.kml+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${c.name.replace(/[^a-zA-Z0-9]/g,'_')}_map.kml`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function escapeXml(str){
  return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function buildStaticMapUrl(deals, mapType, center, zoom){
  const byColor = {};
  deals.forEach(d=>{
    const color = (MAP_STAGE_COLORS[d.stage] || '#888888').replace('#','0x');
    (byColor[color] = byColor[color]||[]).push(`${d.latitude},${d.longitude}`);
  });
  const markerParams = Object.keys(byColor).map(color=>
    `markers=${encodeURIComponent('size:tiny|color:'+color)}%7C${byColor[color].join('%7C')}`
  ).join('&');
  const staticMapType = mapType==='roadmap' ? 'roadmap' : 'hybrid';
  // Match whatever the person is actually looking at right now — never auto-fit to every
  // pin, since a zoomed-in view of one intersection should print that same close-up view,
  // not zoom out to fit every other pin on the map too.
  const viewParams = `center=${center.lat},${center.lng}&zoom=${zoom}`;
  return `https://maps.googleapis.com/maps/api/staticmap?size=1280x720&scale=2&maptype=${staticMapType}&${viewParams}&${markerParams}&key=${GOOGLE_MAPS_JS_KEY}`;
}
function printClientMap(c){
  const geocodedDeals = (c.deals||[]).filter(d=>d.stage!=='dead' && !(d.commission1Paid && d.commission2Paid) && d.latitude && d.longitude);
  if(!geocodedDeals.length){ flashToast('Nothing to print yet — no deals have a pin on the map.'); return; }
  const mapType = state.currentUser.mapTypePreference || 'hybrid';
  if(!state._activeClientMap){ flashToast("Couldn't read the current map view — please try again."); return; }
  const liveCenter = state._activeClientMap.getCenter();
  const center = {lat: liveCenter.lat(), lng: liveCenter.lng()};
  const zoom = state._activeClientMap.getZoom();
  const imgUrl = buildStaticMapUrl(geocodedDeals, mapType, center, zoom);

  // A real popup window is increasingly blocked or restricted by browsers even on a
  // direct click, and unreliable for this purpose — build a temporary full-page
  // printable view directly in this same window instead, remove it once done.
  const existing = document.getElementById('mapPrintOverlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'mapPrintOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;';
  overlay.innerHTML = `<h2 style="font-family:sans-serif;margin:0;">${escapeHtml(c.name)}</h2><img style="max-width:96%;max-height:88vh;">`;
  document.body.appendChild(overlay);
  const img = overlay.querySelector('img');
  const cleanup = ()=>{ const el = document.getElementById('mapPrintOverlay'); if(el) el.remove(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  img.onload = ()=>{ window.print(); };
  img.onerror = ()=>{ flashToast('Could not load the map image for printing.'); cleanup(); };
  img.src = imgUrl;
}

function extractPortalChatItems(newMessages){
  if(!Array.isArray(newMessages)) return [];
  const toolUseNames = {};
  newMessages.forEach(msg=>{
    if(msg.role==='assistant' && Array.isArray(msg.content)){
      msg.content.forEach(block=>{ if(block.type==='tool_use') toolUseNames[block.id] = block.name; });
    }
  });
  const seen = new Set();
  const items = [];
  newMessages.forEach(msg=>{
    if(msg.role!=='user' || !Array.isArray(msg.content)) return;
    msg.content.forEach(block=>{
      if(block.type!=='tool_result' || toolUseNames[block.tool_use_id]!=='get_portal_data') return;
      let parsed;
      try{ parsed = JSON.parse(block.content); }catch(e){ return; }
      if(!parsed || parsed.error || !Array.isArray(parsed.data)) return;
      if(parsed.resource==='todos'){
        parsed.data.forEach(t=>{
          const key = 'todo:'+t.id;
          if(seen.has(key) || !t.id || !t.title) return;
          seen.add(key);
          items.push({kind:'todo', id:t.id, label:t.title});
        });
      } else if(parsed.resource==='clients' || parsed.resource==='listings'){
        parsed.data.forEach(c=>{
          const key = 'client:'+c.id;
          if(seen.has(key) || !c.id || !c.name) return;
          seen.add(key);
          items.push({kind:'client', listId:parsed.resource, id:c.id, label:c.name});
        });
      }
    });
  });
  return items.slice(0, 12); // keep the chip row from getting out of hand on a big list
}

function toggleChatVoiceInput(){
  if(state.portalChatRecording){
    if(state._portalChatSafetyTimer){ clearTimeout(state._portalChatSafetyTimer); state._portalChatSafetyTimer=null; }
    if(state._portalChatSpeechRecognition){ try{ state._portalChatSpeechRecognition.abort(); }catch(e){} }
    state.portalChatRecording = false;
    render();
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    flashToast("Voice input isn't supported in this browser — try Chrome.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  state.portalChatRecording = true;
  render();
  const clearSafety = ()=>{ if(state._portalChatSafetyTimer){ clearTimeout(state._portalChatSafetyTimer); state._portalChatSafetyTimer=null; } };
  recognition.onresult = (event)=>{
    clearSafety();
    const transcript = event.results[0][0].transcript;
    state.portalChatRecording = false;
    if(transcript && transcript.trim()) sendPortalChatMessage(transcript.trim());
    else render();
  };
  recognition.onerror = (event)=>{
    clearSafety();
    console.error('Portal chat speech recognition error:', event.error);
    state.portalChatRecording = false;
    flashToast("Didn't catch that — please try again.");
    render();
  };
  recognition.onend = ()=>{ clearSafety(); if(state.portalChatRecording){ state.portalChatRecording=false; render(); } };
  state._portalChatSpeechRecognition = recognition;
  // Same 20-second safety net as the Voice Note feature — mobile browsers can
  // occasionally leave a recording session hanging.
  state._portalChatSafetyTimer = setTimeout(()=>{
    if(state.portalChatRecording){
      try{ recognition.abort(); }catch(e){}
      state.portalChatRecording = false;
      flashToast("Voice input timed out — please try again.");
      render();
    }
  }, 20000);
  recognition.start();
}
async function sendPortalChatMessage(text){
  if(!state.portalChatHistory) state.portalChatHistory = [];
  state.portalChatMessages.push({role:'user', text});
  state.portalChatHistory.push({role:'user', content: text});
  state.portalChatSending = true;
  render();
  try{
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const jwt = sessionData?.session?.access_token;
    const res = await fetch(`${SUPABASE_URL}/functions/v1/portal-chat`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${jwt}` },
      body: JSON.stringify({ messages: state.portalChatHistory, userName: state.currentUser.name })
    });
    const data = await res.json();
    if(!res.ok || data.error){
      state.portalChatMessages.push({role:'error', text: data.error || "Something went wrong — please try again."});
    } else {
      const items = extractPortalChatItems(data.newMessages);
      if(Array.isArray(data.newMessages)) state.portalChatHistory.push(...data.newMessages);
      state.portalChatMessages.push({role:'assistant', text: data.reply || "(no response)", items});
    }
  } catch(e){
    console.error('Portal chat error:', e);
    state.portalChatMessages.push({role:'error', text:"Couldn't reach the assistant — check your connection and try again."});
  }
  state.portalChatSending = false;
  render();
}

function renderDealStageChart(userId, yearFilter){
  const rows = allDealsForUser(userId);
  const nowYear = todayDate().getFullYear();
  const filtered = (!yearFilter || yearFilter==='total') ? rows : rows.filter(r=>{
    if(!r.deal.dueDate) return false;
    const y = new Date(r.deal.dueDate).getFullYear();
    return yearFilter==='thisYear' ? y===nowYear : y===nowYear+1;
  });
  const counts = {}, values = {};
  filtered.forEach(r=>{

    values[d.stage] = (values[d.stage]||0) + (parseFloat(d.totalFee)||0);
  });
  const maxValue = Math.max(1, ...Object.values(values));
  const stageOrder = ['loi','signedLOI','negotiating','inEscrow','signedLease','closedEscrow'];
  const bars = stageOrder.filter(id=>counts[id]).map(id=>{
    const s = LSR_STAGE_MAP[id];

      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">

  return bars || `<div class="tiny" style="color:var(--ink-soft);">${yearFilter && yearFilter!=='total' ? 'No active deals with a Due Date in this window.' : 'No active deals.'}</div>`;
}
function renderExpiringItemsWidget(userId){
  const today = todayDate();
  // Negative days = already expired. No lower bound on how far past — this is meant to
  // surface everything needing action, and per the user there's very little data
  // populated yet, so there's no real risk of a huge backlog cluttering the widget.
  const classify = (date)=>{
    if(!date) return null;
    const d = new Date(date+'T00:00:00');
    return Math.ceil((d-today)/(1000*60*60*24));
  };
  const bucketOf = (days)=>{
    if(days<0) return 'expired';
    if(days<=30) return '30';
    if(days<=60) return '60';
    if(days<=90) return '90';
    return null; // more than 90 days out — not urgent yet, don't show
  };
  const caItems = [], listingItems = [];
  db.lists.filter(l=>l.type==='deep').forEach(l=>{
    l.clients.forEach(c=>{
      const hasAccess = !userId || c.createdBy===userId || (c.authorizedUserIds||[]).includes(userId);
      if(!hasAccess) return;
      if(l.id==='listings'){
        // One master Exclusive Listing Agreement covers every deal on the property —
        // a single expiration per Listing account, not one per deal.
        const days = classify(c.elaEndDate ? toLocalDateStr(c.elaEndDate) : null);
        const bucket = days!==null ? bucketOf(days) : null;
        if(bucket) listingItems.push({label:`${c.name} — Exclusive Listing Agreement`, days, bucket, clientId:c.id, listId:l.id});
      } else {
        // Clients (Tenant/Buyer rep): one Commission Agreement per deal.
        (c.deals||[]).forEach(d=>{
          if(d.stage==='dead') return;
          const days = classify(d.caExpirationDate);
          const bucket = days!==null ? bucketOf(days) : null;
          if(bucket) caItems.push({label:`${c.name} — ${d.name} (CA)`, days, bucket, clientId:c.id, listId:l.id, dealId:d.id});
        });
      }
    });
  });
  // Expired first (most overdue first), then the 30/60/90-day windows, soonest first.
  const BUCKETS = [
    {key:'expired', label:'EXPIRED', color:'#b3271c'},
    {key:'30', label:'Next 30 Days', color:'#c25a00'},
    {key:'60', label:'31–60 Days', color:'#9a7b00'},
    {key:'90', label:'61–90 Days', color:'var(--ink-soft)'},
  ];
  const section = (label, icon, items)=>{
    const bucketsHtml = BUCKETS.map(b=>{
      const bucketItems = items.filter(i=>i.bucket===b.key).sort((a,c)=>a.days-c.days);
      if(!bucketItems.length) return '';
      return `
      <div style="margin-bottom:8px;">
        <div style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:${b.color};margin-bottom:2px;">${b.label} (${bucketItems.length})</div>
        ${bucketItems.map(i=>`<div class="tiny" style="padding:2px 0;">${escapeHtml(i.label)} — ${i.days<0 ? `${Math.abs(i.days)} day${Math.abs(i.days)===1?'':'s'} ago` : `${i.days} day${i.days===1?'':'s'}`}</div>`).join('')}
      </div>`;
    }).join('');
    return `
    <div style="margin-bottom:14px;">
      <div style="font-weight:700;font-size:12.5px;margin-bottom:4px;">${icon} ${label} (${items.length})</div>
      ${items.length ? bucketsHtml : `<div class="tiny" style="color:var(--ink-soft);">Nothing EXPIRED, or due in the next 30, 60, or 90 days.</div>`}
    </div>`;
  };
  return section('Client CAs Expiring', '📄', caItems) + section('Listing Agreements Expiring', '🏢', listingItems);
}

// WIP's row source: matches the Dashboard's own "All Deals" scope exactly (account access —
// created it, or authorized on it), NOT the old pipelineRows()/commission-split scoping —
// that was the root cause of WIP only showing a handful of deals: it required the viewer to
// be personally on a deal's commission split. Now WIP shows every one of a person's active
// LOI-and-higher deals (same set the Dashboard and "All Deals" smart list already show),
// whether or not they happen to be on the split. When they ARE on a deal's split, Broker
// Share % and the weighted fee reflect their actual cut; when they're not (account access
// without being added to the split yet), the full deal value is shown instead and Broker
// Share % is blank — there's no personal "share" to compute in that case. "Office Total"
// is one row per deal (not one row per split), full deal value, every producer's names
// listed in the Broker column.
function wipRowsForUser(viewUserId){
  const isOffice = viewUserId==='office' || !viewUserId;
  const base = allDealsForUser(isOffice ? null : viewUserId);
  const rows = [];
  base.forEach(r=>{
    const d = r.deal, c = r.client;
    const wa = PIPELINE_STAGE_WA[d.stage];
    if(!wa) return; // defensive — allDealsForUser already excludes dead/prospect
    const totalFee = parseFloat(d.totalFee) || 0;
    const mySplit = !isOffice ? findSplitForUser(d, viewUserId) : null;
    const pct = mySplit ? (parseFloat(mySplit.pct)||0) : null;
    const shareFactor = pct!=null ? pct/100 : 1;
    const waValue = totalFee * wa * shareFactor;
    // Sale deals pay out in one lump sum at close (commission1Paid = the whole fee received);
    // lease deals pay in two half-fee installments (commission1/commission2) — same split
    // computeBrokerGrossForUser uses for "Paid to Date", so WIP's Received/Past Due agree with it.
    const isSale = d.dealType==='sale';
    let receivedAmt = 0, pastDueAmt = 0;
    if(totalFee>0){
      const today = todayDate();
      if(isSale){
        if(d.commission1Paid) receivedAmt += totalFee * shareFactor;
        if(!d.commission1Paid && d.commission1DueDate && new Date(d.commission1DueDate+'T00:00:00')<today) pastDueAmt += totalFee * shareFactor;
      } else {
        if(d.commission1Paid) receivedAmt += (totalFee/2) * shareFactor;
        if(d.commission2Paid) receivedAmt += (totalFee/2) * shareFactor;
        if(!d.commission1Paid && d.commission1DueDate && new Date(d.commission1DueDate+'T00:00:00')<today) pastDueAmt += (totalFee/2) * shareFactor;
        if(!d.commission2Paid && d.commission2DueDate && new Date(d.commission2DueDate+'T00:00:00')<today) pastDueAmt += (totalFee/2) * shareFactor;
      }
    }
    const brokerNames = (d.splits||[]).map(s=>nameForSplitUserId(s.userId)).filter(Boolean).join(', ') || '—';
    rows.push({
      clientId:c.id, clientName:c.name, dealName:d.name, listId:r.listId, dealId:d.id,
      stage:d.stage, totalFee, pct, waValue, brokerNames,
      dueDate: d.dueDate ? toLocalDateStr(d.dueDate) : null,
      receivedAmt, pastDueAmt,
    });
  });
  return rows;
}

/* ---------------- TODO ACTIONS ---------------- */
function toggleComplete(id){
  const td = db.todos.find(x=>x.id===id);
  if(!td) return;
  const wasComplete = td.completed;
  td.completed = !td.completed;
  td.completedAt = td.completed ? new Date() : null;
  supaUpdateTodo(td);
  if(!wasComplete && td.completed){
    // Just marked complete: keep it visible in the current view (don't let it vanish
    // out from under someone), and offer an undo window in case it was a mis-click.
    if(!state.recentlyCompletedIds.includes(id)) state.recentlyCompletedIds.push(id);
    state.undoToast = {id, title:td.title, expiresAt: Date.now()+13000};
    setTimeout(()=>{ if(state.undoToast && state.undoToast.id===id) { state.undoToast=null; render(); } }, 13100);
  } else if(wasComplete && !td.completed){
    state.recentlyCompletedIds = state.recentlyCompletedIds.filter(x=>x!==id);
  }
}
function renderUndoToast(){
  if(!state.undoToast || Date.now() > state.undoToast.expiresAt){ state.undoToast=null; return; }
  const el = document.createElement('div');
  el.className='toast';
  el.style.display='flex'; el.style.gap='14px'; el.style.alignItems='center';
  el.innerHTML = `<span>Marked "${escapeHtml(state.undoToast.title)}" complete.</span><button class="btn secondary sm" id="undoCompleteBtn">Undo</button>`;
  document.getElementById('app').appendChild(el);
  document.getElementById('undoCompleteBtn').onclick=()=>{ undoLastComplete(); render(); };
}
function undoLastComplete(){
  if(!state.undoToast) return;
  const id = state.undoToast.id;
  const td = db.todos.find(x=>x.id===id);
  if(td && td.completed){ toggleComplete(id); }
  state.undoToast=null;
}
function archiveTodo(id){
  const idx = db.todos.findIndex(x=>x.id===id);
  if(idx<0) return;
  const [td] = db.todos.splice(idx,1);
  td.archivedAt = new Date();
  db.archivedTodos.push(td);
  supaUpdateTodo(td);
}
function archiveAllCompleted(){
  const completed = db.todos.filter(t=>t.completed);
  completed.forEach(t=>{ t.archivedAt=new Date(); db.archivedTodos.push(t); supaUpdateTodo(t); });
  db.todos = db.todos.filter(t=>!t.completed);
  return completed.length;
}
function restoreArchivedTodo(id){
  const idx = db.archivedTodos.findIndex(x=>x.id===id);
  if(idx<0) return;
  const [td] = db.archivedTodos.splice(idx,1);
  delete td.archivedAt;
  db.todos.push(td);
  supaUpdateTodo(td);
}
function takeTodo(id){
  const td = db.todos.find(x=>x.id===id);
  if(td){ td.assignedTo = state.currentUser.id; supaUpdateTodo(td); flashToast('Task taken — now yours.'); }
}
function assignTodo(id, userId){
  const td = db.todos.find(x=>x.id===id);
  if(td){
    td.assignedTo = userId;
    supaUpdateTodo(td);
    const u = USERS.find(x=>x.id===userId);
    flashToast(`Assigned to ${u.name}. Email sent: "You Have a New To Do on Southwest Edge."`);
  }
}
function togglePrivate(id){
  const td = db.todos.find(x=>x.id===id);
  if(td){ td.private = !td.private; supaUpdateTodo(td); }
}
function deleteTodo(id){
  db.todos = db.todos.filter(x=>x.id!==id);
  state.selectedTodoIds = state.selectedTodoIds.filter(x=>x!==id);
  if(state.todoDetailModal && state.todoDetailModal.id===id) state.todoDetailModal=null;
  supaDeleteTodo(id);
  flashToast('To-do deleted.');
}
function toggleSelectTodo(id){
  if(state.selectedTodoIds.includes(id)) state.selectedTodoIds = state.selectedTodoIds.filter(x=>x!==id);
  else state.selectedTodoIds.push(id);
}
function bulkDeleteSelected(){
  const n = state.selectedTodoIds.length;
  const idsToDelete = state.selectedTodoIds.slice();
  db.todos = db.todos.filter(x=>!idsToDelete.includes(x.id));
  state.selectedTodoIds=[];
  idsToDelete.forEach(id=>supaDeleteTodo(id));
  flashToast(`Deleted ${n} to-do${n===1?'':'s'}.`);
}
function bulkCompleteSelected(){
  db.todos.forEach(td=>{ if(state.selectedTodoIds.includes(td.id)){ td.completed=true; supaUpdateTodo(td); } });
  const n = state.selectedTodoIds.length;
  state.selectedTodoIds=[];
  flashToast(`Marked ${n} to-do${n===1?'':'s'} complete.`);
}

/* ---------------- TODO DETAIL / EDIT MODAL ---------------- */
function openTodoDetail(id){
  const td = db.todos.find(x=>x.id===id);
  if(td && (td.type==='brokerReview' || td.type==='closedEscrowChecklist' || td.type==='closedEscrowApproval')){
    if(td.isNew && td.assignedTo===state.currentUser.id) td.isNew=false;
    state.brokerReviewModal = {todoId:td.id, reviewId:td.brokerReviewId};
    return;
  }
  state.todoDetailModal = {id, originalAssignedTo: td ? td.assignedTo : null};
  if(td && td.isNew && td.assignedTo===state.currentUser.id) td.isNew=false;
}
// Deep-link support: digest emails link to a specific to-do via ?todo=<id>. Call this
// once, right after app data has actually loaded (db.todos populated), so the to-do
// exists to be found. Cleans the URL either way so a refresh doesn't repeat this.
function attemptCloseTodoDetail(td){
  if(state.mustRespondTodoId === td.id){
    const snap = state.mustRespondSnapshot;
    const changed = td.status !== snap.status || td.notes !== snap.notes || td.completed !== snap.completed ||
      (td.dueDate ? +td.dueDate : null) !== snap.dueDate;
    if(!changed){
      flashToast("Before closing this, please update the status, add a note, mark it complete, or change the due date — whoever sent this reminder is waiting on an update.");
      return false;
    }
    td.reminderPending = false;
    supaUpdateTodo(td);
    state.mustRespondTodoId = null;
    state.mustRespondSnapshot = null;
  }
  state.todoDetailModal = null;
  return true;
}
function checkBrokerReviewDeepLink(){
  const params = new URLSearchParams(window.location.search);
  const reviewId = params.get('brokerReview');
  if(!reviewId) return;
  history.replaceState(null, '', window.location.pathname);
  const rev = (db.brokerReviews||[]).find(r=>r.id===reviewId);
  if(!rev){
    flashToast("That review couldn't be found — it may have been removed.");
    return;
  }
  const listId = findListIdForClient(rev.clientId);
  if(listId){
    try{
      if(rev.sourceTable==='deals'){
        openClientModal(listId, rev.clientId);
        openDealModal(listId, rev.clientId, rev.sourceId);
      } else {
        openClientModal(listId, rev.clientId);
        openLSRProspect(rev.clientId, rev.sourceId);
      }
    }catch(e){ console.error('Broker review deep-link navigation failed:', e); }
  }
  const matchingTodo = db.todos.find(t=>t.brokerReviewId===reviewId && t.assignedTo===state.currentUser.id && !t.completed);
  state.brokerReviewModal = {todoId: matchingTodo ? matchingTodo.id : null, reviewId: rev.id};
}
function checkTodoDeepLink(){
  const params = new URLSearchParams(window.location.search);
  const todoId = params.get('todo');
  if(!todoId) return;
  const isReminder = params.get('reminder')==='1';
  history.replaceState(null, '', window.location.pathname);
  const td = db.todos.find(x=>x.id===todoId);
  if(td){
    openTodoDetail(todoId);
    if(isReminder && td.reminderPending && td.assignedTo===state.currentUser.id){
      state.mustRespondTodoId = td.id;
      state.mustRespondSnapshot = {
        status: td.status, notes: td.notes, completed: td.completed,
        dueDate: td.dueDate ? +td.dueDate : null,
      };
    }
  } else {
    flashToast("That to-do couldn't be found — it may have been completed, moved, or removed since the email was sent.");
  }
}
function getTodoLinkSummary(td){
  if(td.dealId){
    const l = db.lists.find(x=>x.id===td.listId);
    const c = l && l.clients.find(x=>x.id===td.clientId);
    const d = c && c.deals.find(x=>x.id===td.dealId);
    if(c && d) return `${c.name} → ${d.name}`;
    return "Linked to a client/deal you don't have access to";
  }
  if(td.clientId){
    const l = db.lists.find(x=>x.id===td.listId);
    const c = l && l.clients.find(x=>x.id===td.clientId);
    if(c) return `${c.name} (general, no specific site)`;
    return "Linked to a client you don't have access to";
  }
  if(td.entryId){
    const l = db.lists.find(x=>x.id===td.listId);
    const e = l && l.entries.find(x=>x.id===td.entryId);
    if(e) return `${l.name}: ${e.name}`;
    return "Linked to a target you don't have access to";
  }
  return 'Not linked to anything — a floating to-do';
}

// A Checklist is a series of free-form checkable boxes that live only inside this one
// to-do — not independently assignable. Items are directly editable in place; a fresh
// Checklist (or a Project's embedded one) starts with 5 blank rows to fill in, and
// "+ Add item" grows it one at a time after that.
function renderChecklistSection(td){
  const doneCount = td.checklistItems.filter(i=>i.done).length;
  const sortedChecklistItems = td.checklistItems.map((item,idx)=>({item,idx})).sort((a,b)=>{
    if(!!a.item.done !== !!b.item.done) return a.item.done ? 1 : -1;
    return a.idx - b.idx;
  });
  return `
  <div class="field">
    <label>Checklist${td.checklistItems.length? ` <span style="font-weight:400;color:var(--ink-soft);">(${doneCount}/${td.checklistItems.length} done)</span>`:''}</label>
    <div id="checklistItemsList">
      ${sortedChecklistItems.map(({item,idx})=>`
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap;">
          <input type="checkbox" data-checkitem="${item.id}" ${item.done?'checked':''} style="width:auto;flex:none;">
          <input data-checklistitemtext="${item.id}" value="${escapeAttr(item.text)}" placeholder="Item ${idx+1}" style="flex:1 1 160px;min-width:120px;font-size:13.5px;${item.done?'text-decoration:line-through;color:var(--ink-soft);':''}">
          <input type="date" data-checklistitemdue="${item.id}" value="${item.dueDate?toLocalDateStr(item.dueDate):''}" title="Date 1 (optional)" style="flex:1 1 130px;min-width:110px;font-size:12.5px;color:var(--ink-soft);">
          <input type="date" data-checklistitemdue2="${item.id}" value="${item.dueDate2?toLocalDateStr(item.dueDate2):''}" title="Date 2 (optional)" style="flex:1 1 130px;min-width:110px;font-size:12.5px;color:var(--ink-soft);">
          <button class="row-trash" data-removeitem="${item.id}" style="opacity:.5;flex:none;">✕</button>
        </div>`).join('')}
    </div>
    <button class="btn secondary sm" data-action="addChecklistItem" style="margin-top:6px;">+ Add item</button>
  </div>`;
}
